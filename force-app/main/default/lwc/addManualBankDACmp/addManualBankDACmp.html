                                    <td style="border-color: black;">

                                                placeholder="Please enter Bank here.."

                                                name="bankCombobox"
                                                max-results={maxResults}
                                                selected-id={row.bank}    
                                                selected-name={row.bankName}
                                                return-fields="['Id','Name','MICR__c']"
                                                search-fields="['IFSC__c']"
                                                filter-criteria="[RecordType.Name = 'Branch']"
                                                data-id={row.id}          
                                                onlookupselected={handleSelectDocument}
                                                onlookupdeselected={handleldeselectDocument}
                                                disabled={row.isEditable}
                                            >
                                            </c-search-lookup><!-- //Sanwar(29/11/2025)-->
                                    
                                        </p>
                                    </td>
                                </template>
                        </template>
                        <template if:true={row.isEditable}>

                        <td style="border-color: black;"><p style="font-weight: 400;"><lightning-combobox name="yearCombobox"  options={yearOptions} label="" variant="label-hidden" value={row.year}  disabled placeholder="type here..." data-id={row.docId} onchange={handleBDUpdate}></lightning-combobox></p></td>-->

                                onuploadfinished={handleReUpload}                                    
                                ></lightning-file-upload>

                            <template if:true={row.isPreview}>

                        <template for:each={daRecords.headerList} for:item="iter">

                    <template for:each={daRecords.mainWrapList} for:item="item">

                                {item.fieldName}

                                <td key={iter2} class=""

                                <span style="display:inline-flex;">
                                    <p style="font-weight: 400;"><lightning-input type="number" label="Enter some text" variant="label-hidden" value={iter2.recVal} data-id={iter2.recId} name={iter2.recFieldName} placeholder="type here..." onblur={handleFieldChange}></lightning-input></p>

                <div style="padding-top: 1%;text-align: right;">

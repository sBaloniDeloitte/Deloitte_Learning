    <template lwc:if = {displayButton}>
        <div class="slds-align_absolute-center" style="height:5rem">Are you sure to split the loan, please confirm proceed?</div>
        <div class="slds-align_absolute-center" style="height:5rem">        
            <div class="slds-grid slds-gutters">
                <div class="slds-col">
                    <span><lightning-button label="Proceed" onclick={handleButtonValidation}></lightning-button></span>
                </div>
                <div class="slds-col">
                    <span><lightning-button label="Cancel" onclick={closeModal}></lightning-button></span>
                </div>
            </div>
        </div>
    </template>

    <template if:true={isValidations}>
        <div class="slds-backdrop slds-backdrop_open"></div>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 id="modal-heading-01" class="slds-text-heading_medium">Required validations</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <template for:each={validationMessages} for:item="message">
                        <ul key={message}>
                            <li>{message}</li>
                        </ul>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Close" onclick={handleCloseValidation}></lightning-button>
                </footer>
            </div>
        </section>
    </template>
        <template if:true={isSplitSuccess}>
        <div class="slds-backdrop slds-backdrop_open"></div>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 id="modal-heading-02" class="slds-text-heading_medium">Child Loan Details</h2>
                </header>
                <template for:each={resultWrapper} for:item="row">
                    <div key = {row.ChildLoanId} class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                        <div class="slds-cell-wrap" style="text-align: center;"> Child Loan : &nbsp;
                            <a href={row.ChildLoanId} target="_blank">{row.ChildLoanName}</a></div>
                    </div>
                </template>
                <footer class="slds-modal__footer">
                    <lightning-button label="Close" onclick={handleCloseSplitSuccess}></lightning-button>
                </footer>
            </div>
        </section>
    </template>
        
    <!-- Load spinner -->
    <template lwc:if ={isLoading}>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </template>     
</template>

<template>
    <div class="app-form-container">
        <div class="select-section-wrapper">
            <!-- <template if:true={isSales}> -->
                <div class="select-section-wrapper">
                    <div class="generate-button-row">
                        <div class="slds-m-top_medium slds-text-align_left">
                            <button class="slds-button slds-button_brand generate-button" onclick={handleGenerateAppForm}>Generate</button>
                        </div>
                    </div>
                </div>
            <!-- </template> -->

            <template if:true={isLoading}>
                <div class="slds-spinner_container">
                    <lightning-spinner alternative-text="Generating PDF" size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- Render PDF in the same page -->

            <template if:true={showAppForm}>
                <template if:false={isMobile}>
                <div class="slds-m-top_medium pdf-frame-wrapper">
                    <iframe src={pdfUrl} width="100%" height="1000px"></iframe>
                </div>
            </template>
                <template if:true={isMobile}>
                <div style="text-align:center; margin-top:20px;">
                    <lightning-button label="View Application Form" onclick={openPDF} variant="brand" class="view-app-form-button"></lightning-button>
                </div>
            </template>
            </template>

        </div>
    </div>
</template>

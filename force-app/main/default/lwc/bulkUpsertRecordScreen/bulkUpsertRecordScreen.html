<template>
    <span class="styleContainer"></span>
    <template if:true={isSpinner}>
        <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
    </template>
    <template if:true={isShowModal}>
       

        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
        aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
        <!-- modal header start -->
            <header class="slds-modal__header custom-modal-header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    title="Close" onclick={hideModalBox}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                        size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Update/Upload Records</h2>
            </header>


                <!-- modal body start -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <div class="slds-align_absolute-center fileCSV">
                    <lightning-file-upload label="Attach receipt" name="fileUploader" accept={acceptedFormats}
                        onuploadfinished={handleUploadFinished} variant="label-hidden" >
                    </lightning-file-upload>
                </div>
                <div style="text-align: center;margin-top:3%;">
                    <div class="slds-align_absolute-center">
                       <!-- <button class="slds-button slds-button_brand" style="font-size: 11px;width: 150px;background-color:#dc387e;color: white;border-color: skyblue;font-weight: 500;" onclick={downloadSampleCSV}>Download CSV Format</button>-->
                        <button class="slds-button slds-button_brand" style="font-size: 11px;width: 140px;background-color: #9bbf56;color: white;border-color: skyblue;font-weight: 500;" onclick={submitCsv}>Submit</button>
                        <button class="slds-button slds-button_brand" style="font-size: 11px;width: 140px;background-color: #dc387e;color: white;border-color: skyblue;font-weight: 500;" onclick={hideModalBox}>Cancel</button>
                    </div>
                </div>

                </div>
              

                <footer class="slds-modal__footer" style="background-color: skyblue; padding: 1rem; text-align: center; color: white; font-weight: bold;order: revert;">
                  
                </footer>

<!--                
                <footer class="slds-modal__footer">
                    <lightning-button variant="brand" label="Download CSV Format" title="Download CSV Format"
                        onclick={downloadSampleCSV} class="slds-m-left_x-small"></lightning-button>
                    <lightning-button variant="brand" label="Submit" title="Submit" onclick={submitCsv}
                        class="slds-m-left_x-small"></lightning-button>
                    <lightning-button variant="brand" label="Cancel" title="Cancel" onclick={hideModalBox}
                        class="slds-m-left_x-small"></lightning-button>
                </footer> -->

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <!-- modal end -->
</template>

<template>
    <template if:true={showTable}>
            <div class="slds-scrollable_x" style="overflow: initial;padding: 20px 0px;">
                <table class="slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered slds-table_col-bordered slds-border_left slds-border_right custom-table" style=" border-color: black">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <template lwc:if={isTradeReference}>
                                <th style="text-align: center; background-color: skyblue; color: black; border-color: black" scope="col" colspan="1">
                                    Name				
                                </th>
                                <th style="text-align: center; background-color: skyblue; color: black; border-color: black" scope="col" colspan="1">
                                    Relationship						
                                </th>
                                <th style="text-align: center; background-color: skyblue; color: black; border-color: black;"
                                scope="col" colspan="1">
                                    Mobile Number
                                </th>
                                <th style="text-align: center; background-color: skyblue; color: black; border-color: black;"
                                scope="col" colspan="1">
                                    Remarks
                                </th>
                            </template>
                            <template lwc:elseif={isAsset}>
                               <th style="text-align: center; background-color: skyblue; color: black; border-color: black" scope="col" colspan="1">
                                    Type of Asset				
                                </th>
                                <th style="text-align: center; background-color: skyblue; color: black; border-color: black" scope="col" colspan="1">
                                    Year of Purchase						
                                </th>
                                <th style="text-align: center; background-color: skyblue; color: black; border-color: black;"
                                scope="col" colspan="1">
                                    Name of the Asset Onwer
                                </th>
                                <th style="text-align: center; background-color: skyblue; color: black; border-color: black" scope="col" colspan="1">
                                   Amount of Investment				
                                </th>
                                <th style="text-align: center; background-color: skyblue; color: black; border-color: black" scope="col" colspan="1">
                                    Proof						
                                </th>
                            </template>
                            <template lwc:elseif={isChildrenDetails}>
                               <th style="text-align: center; background-color: skyblue; color: black; border-color: black" scope="col" colspan="1">
                                    Child Name				
                                </th>
                                <th style="text-align: center; background-color: skyblue; color: black; border-color: black" scope="col" colspan="1">
                                    Relationship ( Son/Daughter)						
                                </th>
                                <th style="text-align: center; background-color: skyblue; color: black; border-color: black;"
                                scope="col" colspan="1">
                                    Age
                                </th>
                                <th style="text-align: center; background-color: skyblue; color: black; border-color: black" scope="col" colspan="1">
                                   Current Status ( Studying / Working)			
                                </th>
                                <th style="text-align: center; background-color: skyblue; color: black; border-color: black" scope="col" colspan="1">
                                    Highest Level of Education						
                                </th>
                                 <th style="text-align: center; background-color: skyblue; color: black; border-color: black" scope="col" colspan="1">
                                    Occupation Details 						
                                </th>
                            </template>
                             <th style="text-align: center; background-color: skyblue; color: black; border-color: black;"
                                scope="col" colspan="1">
                                    Delete
                            </th>
                        </tr>
                    </thead>
                    
                    <tbody>
                        <template lwc:if={isTradeReference}>
                        <template for:each={tradeReferenceList} for:item="record" for:index="index">
                            <tr key={record.Id}>
                                <td style=" border-color: black">
                                    <lightning-input data-index={index} type="text" data-name="TradeReference" data-id="Trade_Reference_Name__c" value={record.Trade_Reference_Name__c} onblur={handleChange} variant="label-hidden"></lightning-input>
                                </td>
                                <td style=" border-color: black">
                                    <lightning-input type="text" data-name="TradeReference" data-index={index} data-id="Trade_Reference_Relationship__c" value={record.Trade_Reference_Relationship__c} onblur={handleChange} variant="label-hidden"></lightning-input>
                                </td>
                                <td style=" border-color: black">
                                    <lightning-input type="tel"  data-name="TradeReference" data-index={index} data-id="Trade_Reference_Mobile_Number__c" maxlength="10" value={record.Trade_Reference_Mobile_Number__c} onblur={handleChange} variant="label-hidden"></lightning-input>
                                </td>
                                <td style=" border-color: black">
                                    <lightning-input type="tel"  data-name="TradeReference" data-index={index} data-id="Trade_Reference_Remarks__c" value={record.Trade_Reference_Remarks__c} onblur={handleChange} variant="label-hidden"></lightning-input>
                                </td>
                                <td style=" border-color: black">
                                    <lightning-icon data-index={index} data-id={record.Id} data-name="TradeReference" icon-name="utility:delete" alternative-text="Delete Document" title="DELETE" size="x-small" onclick={handleDeleteRow} style="cursor: pointer;" ></lightning-icon>
                                </td>
                            </tr>
                        </template>
                        </template>
                        <template lwc:elseif={isAsset}>
                        <template for:each={assetList} for:item="record" for:index="index">
                            <tr key={record.Id}>
                                <td style=" border-color: black">
                                    <lightning-input data-index={index} data-name="Asset" data-id="Type_of_Asset__c" value={record.Type_of_Asset__c} onblur={handleChange} variant="label-hidden"></lightning-input>
                                </td>
                                <td style=" border-color: black">
                                    <lightning-input type="number" data-name="Asset" data-index={index} data-id="Year_of_Purchase__c" value={record.Year_of_Purchase__c} onblur={handleChange} variant="label-hidden"></lightning-input>
                                </td>
                                 <td style=" border-color: black">
                                    <lightning-input type="text" data-name="Asset" data-index={index} data-id="Name_of_the_Asset_Owner__c" value={record.Name_of_the_Asset_Owner__c} onblur={handleChange} variant="label-hidden"></lightning-input>
                                </td>
                                <td style=" border-color: black">
                                    <lightning-input type="number" formatter="currency" data-name="Asset" data-index={index} data-id="Amount_of_Investment__c" value={record.Amount_of_Investment__c} onblur={handleChange} variant="label-hidden"></lightning-input>
                                </td>
                                <td style=" border-color: black">
                                    <lightning-input type="text" data-name="Asset" data-index={index} data-id="Proof__c" value={record.Proof__c} onblur={handleChange} variant="label-hidden"></lightning-input>
                                </td>
                               
                                <td style=" border-color: black">
                                    <lightning-icon data-index={index} data-id={record.Id} data-name="Asset" icon-name="utility:delete" alternative-text="Delete Document" title="DELETE" size="x-small" onclick={handleDeleteRow} style="cursor: pointer;" ></lightning-icon>
                                </td>
                            </tr>
                        </template>
                        </template>
                        
                        <template lwc:elseif={isChildrenDetails}>
                        <template for:each={childrenList} for:item="record" for:index="index">
                            <tr key={record.Id}>
                                <td style=" border-color: black">
                                    <lightning-input type="text"  data-name="Children" data-index={index} data-id="Child_Name__c" value={record.Child_Name__c} onblur={handleChange} variant="label-hidden"></lightning-input>
                                </td>
                                <td style=" border-color: black">
                               <!--    <lightning-input type="text"  data-name="Children" data-index={index} data-id="Relationship_Son_Daughter__c" value={record.Relationship_Son_Daughter__c} onblur={handleChange} variant="label-hidden"></lightning-input> -->
                               <lightning-combobox data-name="Children" data-index={index} data-id="Relationship_Son_Daughter__c" value={record.Relationship_Son_Daughter__c} options={relationshipOptions} onchange={handleChange} variant="label-hidden"></lightning-combobox>
                                </td>
                                <td style=" border-color: black">
                                  <lightning-input type="number"  data-name="Children" data-index={index} data-id="Child_Age__c" value={record.Child_Age__c} onblur={handleChange} variant="label-hidden"></lightning-input>
                                  
                                </td>
                                <td style=" border-color: black">
                                   <!-- <lightning-input type="text"  data-name="Children" data-index={index} data-id="Current_Status_Studying_Working__c" value={record.Current_Status_Studying_Working__c} onblur={handleChange} variant="label-hidden"></lightning-input>-->
                                      <lightning-combobox data-name="Children" data-index={index} data-id="Current_Status_Studying_Working__c" value={record.Current_Status_Studying_Working__c} options={currentStatusOptions} onchange={handleChange} variant="label-hidden"></lightning-combobox>
                                </td>
                                <td style=" border-color: black">
                                   <!-- <lightning-input type="text" data-name="Children" data-index={index} data-id="Highest_Level_of_Education__c" value={record.Highest_Level_of_Education__c} onblur={handleChange} variant="label-hidden"></lightning-input>-->
                                    <lightning-combobox data-name="Children" data-index={index} data-id="Highest_Level_of_Education__c" value={record.Highest_Level_of_Education__c} options={highestLevelOfEducationOptions} onchange={handleChange} variant="label-hidden"></lightning-combobox>
                                </td>
                                <td style=" border-color: black">
                                    <lightning-input type="text" data-name="Children" data-index={index} data-id="Occupation_Details__c" value={record.Occupation_Details__c} onblur={handleChange} variant="label-hidden"></lightning-input>
                                </td>
                                <td style=" border-color: black">
                                    <lightning-icon data-index={index} data-id={record.Id} data-name="Children"  icon-name="utility:delete" alternative-text="Delete Document" title="DELETE" size="x-small" onclick={handleDeleteRow} style="cursor: pointer;" ></lightning-icon>
                                </td>
                            </tr>
                        </template>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
</template>

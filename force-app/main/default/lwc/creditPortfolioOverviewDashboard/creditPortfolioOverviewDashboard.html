<template>
    <div class="cpo-container">

        <!-- Header banner: greeting + name are dynamic, quote is static -->
        <div class="cpo-header">
            <div class="cpo-header-left">
                <div class="cpo-avatar-icon">
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">

                    </svg>
                </div>

                    <p class="cpo-subgreeting">Here's your team's credit portfolio and key updates.</p>
                </div>
            </div>
            <div class="cpo-header-right">

                <p class="cpo-quote">&ldquo;Enable informed decisions<br />for a stronger tomorrow.&rdquo;</p>
            </div>
        </div>

        <!-- Credit Portfolio Overview -->
        <div class="cpo-section">
            <div class="cpo-section-head">
                <div class="cpo-section-title-group">

                            <rect x="10" y="7" width="4" height="13" fill="#4aa3ff"></rect>
                            <rect x="17" y="3" width="4" height="17" fill="#4aa3ff"></rect>
                        </svg>
                    </span>
                    <div>
                        <h2 class="cpo-section-title">Credit Portfolio Overview</h2>
                        <p class="cpo-section-subtitle">Track your team's applications across stages</p>
                    </div>
                </div>
                <div class="cpo-dropdown" onclick={handlePortfolioDropdownToggle}>
                    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">

                    </svg>
                    <span>{portfolioRange}</span>
                    <svg viewBox="0 0 24 24" width="12" height="12" class="cpo-chevron" aria-hidden="true">
                        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    <template if:true={isPortfolioDropdownOpen}>
                        <ul class="cpo-dropdown-menu">
                            <template for:each={portfolioDropdownOptions} for:item="opt">
                                <li key={opt} data-value={opt} onclick={handlePortfolioOptionSelect}>{opt}</li>
                            </template>
                        </ul>
                    </template>
                </div>
            </div>

            <div class="cpo-stat-strip">
                <template for:each={statCards} for:item="card">
                    <div key={card.key} class="cpo-stat-card">
                        <div class={card.iconClass}>

                                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                                    <path d="M6 2h9l3 3v17H6z" style={card.glyphStyle}></path>
                                    <path d="M15 2v3h3" fill="#0c1526"></path>
                                    <rect x="8.5" y="10" width="7" height="1.4" fill="#0c1526"></rect>
                                    <rect x="8.5" y="13" width="7" height="1.4" fill="#0c1526"></rect>
                                    <rect x="8.5" y="16" width="4.5" height="1.4" fill="#0c1526"></rect>
                                </svg>
                            </template>
                            <template if:true={card.isClock}>
                                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                                    <circle cx="12" cy="12" r="9" style={card.glyphStyle}></circle>
                                    <path d="M12 7v5l4 2" fill="none" stroke="#0c1526" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                                </svg>
                            </template>
                            <template if:true={card.isHourglass}>
                                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                                    <circle cx="12" cy="12" r="9" style={card.glyphStyle}></circle>
                                    <path d="M8 7h8M8 17h8M8 7c0 4 4 4 4 5s-4 1-4 5M16 7c0 4-4 4-4 5s4 1 4 5" fill="none" stroke="#0c1526" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
                                </svg>
                            </template>
                            <template if:true={card.isCheck}>
                                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                                    <circle cx="12" cy="12" r="9" style={card.glyphStyle}></circle>
                                    <path d="M8 12.5l2.5 2.5L16 9" fill="none" stroke="#0c1526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                                </svg>
                            </template>
                            <template if:true={card.isCross}>
                                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                                    <circle cx="12" cy="12" r="9" style={card.glyphStyle}></circle>
                                    <path d="M9 9l6 6M15 9l-6 6" fill="none" stroke="#0c1526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                                </svg>
                            </template>
                            <template if:true={card.isPeople}>
                                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                                    <circle cx="9" cy="9" r="3" style={card.glyphStyle}></circle>
                                    <circle cx="16" cy="10" r="2.4" style={card.glyphStyle}></circle>
                                    <path d="M3.5 19c0-3.3 2.5-5.6 5.5-5.6s5.5 2.3 5.5 5.6" style={card.glyphStyle}></path>
                                    <path d="M14.5 14.2c2.4.3 4 2.2 4 4.8" style={card.glyphStyle}></path>
                                </svg>
                            </template>
                        </div>
                        <div class="cpo-stat-value">{card.value}</div>
                        <div class="cpo-stat-label">{card.label}</div>
                        <div class={card.trendClass}>{card.trendLabel} <span class="cpo-trend-suffix">vs last week</span></div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Applications Trend + Credit Decisions by Product -->
        <div class="cpo-row-2col">

            <div class="cpo-section cpo-card-panel">
                <div class="cpo-section-head">
                    <div class="cpo-section-title-group">
                        <span class="cpo-section-icon">
                            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                                <rect x="3" y="12" width="3" height="8" fill="#4aa3ff"></rect>
                                <rect x="9" y="7" width="3" height="13" fill="#4aa3ff"></rect>
                                <rect x="15" y="3" width="3" height="17" fill="#4aa3ff"></rect>
                            </svg>
                        </span>
                        <div>
                            <h2 class="cpo-section-title">Applications Trend</h2>
                            <p class="cpo-section-subtitle">Application volume across last 6 weeks</p>
                        </div>
                    </div>
                    <div class="cpo-dropdown" onclick={handleTrendDropdownToggle}>
                        <span>{trendRange}</span>
                        <svg viewBox="0 0 24 24" width="12" height="12" class="cpo-chevron" aria-hidden="true">
                            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        <template if:true={isTrendDropdownOpen}>
                            <ul class="cpo-dropdown-menu">
                                <template for:each={trendDropdownOptions} for:item="opt">
                                    <li key={opt} data-value={opt} onclick={handleTrendOptionSelect}>{opt}</li>
                                </template>
                            </ul>
                        </template>
                    </div>
                </div>

                <div class="cpo-trend-chart">
                    <svg class="cpo-trend-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                        <template for:each={trendChartSeries} for:item="series">
                            <g key={series.key}>
                                <polyline class="cpo-trend-line" points={series.polyline} style={series.lineStyle}></polyline>
                                <template for:each={series.markers} for:item="marker">
                                    <circle key={marker.key} class="cpo-trend-dot" cx={marker.cx} cy={marker.cy} r="1.6" style={marker.style}></circle>
                                </template>
                            </g>
                        </template>
                    </svg>
                    <div class="cpo-trend-axis">
                        <template for:each={trendWeeks} for:item="week">
                            <span key={week} class="cpo-trend-axis-label">{week}</span>
                        </template>
                    </div>
                </div>

                <div class="cpo-trend-legend">
                    <template for:each={trendChartSeries} for:item="series">
                        <span key={series.key} class="cpo-legend-item">
                            <span class="cpo-legend-dot" style={series.dotStyle}></span>{series.label}
                        </span>
                    </template>
                </div>
            </div>

            <div class="cpo-section cpo-card-panel">
                <div class="cpo-section-head">
                    <div class="cpo-section-title-group">
                        <span class="cpo-section-icon">
                            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                                <circle cx="12" cy="12" r="4" fill="none" stroke="#4aa3ff" stroke-width="8"></circle>
                            </svg>
                        </span>
                        <div>
                            <h2 class="cpo-section-title">Credit Decisions by Product</h2>
                            <p class="cpo-section-subtitle">Breakup of approvals across loan products</p>
                        </div>
                    </div>
                    <div class="cpo-dropdown" onclick={handleDecisionsDropdownToggle}>

                            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        <template if:true={isDecisionsDropdownOpen}>
                            <ul class="cpo-dropdown-menu">
                                <template for:each={decisionsDropdownOptions} for:item="opt">
                                    <li key={opt} data-value={opt} onclick={handleDecisionsOptionSelect}>{opt}</li>
                                </template>
                            </ul>
                        </template>
                    </div>
                </div>

                <div class="cpo-donut-wrapper">
                    <svg class="cpo-donut-svg" viewBox="0 0 180 180" aria-hidden="true">
                        <circle class="cpo-donut-track" cx="90" cy="90" r="70" fill="none" stroke-width="26"></circle>
                        <template for:each={donutSegments} for:item="segment">
                            <circle
                                key={segment.key}
                                class="cpo-donut-segment"
                                cx="90"
                                cy="90"
                                r="70"
                                fill="none"
                                stroke-width="26"
                                stroke-dasharray={segment.dashArray}
                                stroke-dashoffset={segment.dashOffset}
                                style={segment.pathStyle}
                                transform="rotate(-90 90 90)"
                            ></circle>
                        </template>
                        <text x="90" y="86" class="cpo-donut-center-value" text-anchor="middle">{donutApprovedTotal}</text>
                        <text x="90" y="106" class="cpo-donut-center-label" text-anchor="middle">Approved</text>
                    </svg>
                    <ul class="cpo-donut-legend">
                        <template for:each={donutSegments} for:item="segment">
                            <li key={segment.key} class="cpo-donut-legend-item">
                                <span class="cpo-legend-dot" style={segment.swatchStyle}></span>
                                <span class="cpo-donut-legend-label">{segment.label}</span>
                                <span class="cpo-donut-legend-value">{segment.count} ({segment.percent}%)</span>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>

        </div>

        <!-- Pending Approvals + My Tasks & Alerts -->
        <div class="cpo-row-2col">

            <div class="cpo-section cpo-card-panel">
                <div class="cpo-section-head">

                                <path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9" stroke="currentColor" stroke-width="1.6" fill="none"></path>
                            </svg>
                        </span>
                        <div>
                            <h2 class="cpo-section-title">Pending Approvals <span class="cpo-count-badge cpo-badge-red">{pendingApprovalsCount}</span></h2>
                            <p class="cpo-section-subtitle">Applications awaiting your decision</p>
                        </div>
                    </div>
                    <button class="cpo-view-all" type="button" onclick={handleViewAllApprovals}>View All &rarr;</button>
                </div>

                <table class="cpo-approvals-table">
                    <thead>
                        <tr>
                            <th>Application No.</th>
                            <th>Customer Name</th>
                            <th>Product</th>
                            <th>TAT (Days)</th>
                            <th>Priority</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={pendingApprovals} for:item="row">
                            <tr key={row.key}>
                                <td>{row.appNo}</td>
                                <td>{row.customer}</td>
                                <td>{row.product}</td>
                                <td>{row.tat}</td>
                                <td><span class={row.priorityClass}>{row.priority}</span></td>
                                <td><button class="cpo-review-btn" type="button" data-appno={row.appNo} onclick={handleReviewClick}>Review</button></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <div class="cpo-section cpo-card-panel">
                <div class="cpo-section-head">
                    <div class="cpo-section-title-group">
                        <span class="cpo-section-icon cpo-icon-red">
                            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                                <path d="M12 2a6 6 0 0 0-6 6v4l-2 4h16l-2-4V8a6 6 0 0 0-6-6z" fill="currentColor"></path>
                                <path d="M9 20a3 3 0 0 0 6 0" fill="none" stroke="currentColor" stroke-width="1.6"></path>
                            </svg>
                        </span>
                        <div>
                            <h2 class="cpo-section-title">My Tasks &amp; Alerts <span class="cpo-count-badge cpo-badge-red">{tasksAlertsCount}</span></h2>
                            <p class="cpo-section-subtitle">Your pending tasks and important updates</p>
                        </div>
                    </div>
                    <button class="cpo-view-all" type="button" onclick={handleViewAllTasks}>View All &rarr;</button>
                </div>

                <ul class="cpo-tasks-list">
                    <template for:each={tasksAlerts} for:item="task">
                        <li key={task.key} class="cpo-task-row">
                            <span class={task.dotClass}></span>
                            <span class="cpo-task-text">{task.text}</span>
                            <span class="cpo-task-count">{task.count}</span>
                            <span class="cpo-task-date">{task.date}</span>
                        </li>
                    </template>
                </ul>
            </div>

        </div>

    </div>
</template>

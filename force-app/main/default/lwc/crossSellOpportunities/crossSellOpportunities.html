                />
            </div>
            <select class="cso-product-select product-select" onchange={handleProductChange}>
                <template for:each={productOptions} for:item="opt">
                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                </template>
            </select>
        </div>

        <!-- Table -->
        <template lwc:if={hasRecords}>
            <div class="cso-table-wrapper">
                <table class="cso-table">

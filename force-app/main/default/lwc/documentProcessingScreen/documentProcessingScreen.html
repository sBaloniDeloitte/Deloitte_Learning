                                                        data-name={checklistrecord.id} onchange={handleChecklistselection}
                                                        class="applicant-checkbox">
                                                    </lightning-input>
                                                    <span style="margin-left: 8px;">{checklistrecord.name}</span>
                                                </label>
                                            </td>
                                        </tr>
                                    </template>
                                </table>
                                
                            </div>
                        </template>
                        <br>
                        <div>
                            <button class="save-button slds-button slds-button_brand"
                                style="border: none"
                                onclick={handlesave}>Add</button>
                        </div>
                        <template if:true={createdRecordsVisibility}>
                            <div style="padding-top: 3%;">
                                <p slot="title" style="font-size:14px; font-style: italic; color: #113451;">New Documents.</p>
                                <table
                                    class="slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered slds-table_col-bordered slds-border_left slds-border_right">
                                    <thead>
                                        <tr class="slds-line-height_reset">
                                            <th class="" scope="col" style="width: 10%; text-align: center;">
                                                <div class="slds-truncate" title="Serial No.">Sr No.</div>
                                            </th>
                                            <th class="" scope="col" style="width: 25%; text-align: center;">
                                                <div class="slds-truncate" title="Serial No.">Applicable For</div>
                                            </th>
                                            <th class="" scope="col" style="width: 25%; text-align: center;">
                                                <div class="slds-truncate" title="Serial No.">Applicants</div>
                                            </th>
                                            <th class="" scope="col" style="width: 30%; text-align: center;">
                                                <div class="slds-truncate" title="Serial No.">Document Name</div>
                                            </th>
                                            <th class="" scope="col" style="width: 10%; text-align: center;">
                                                <div class="slds-truncate" title="Serial No.">Actions</div>
                                            </th>
                                        </tr>
                                    </thead>
                                    <template for:each={createdNewDocTable} for:item="record">
                                        <tbody key={record.id}>
                                            <td style="width: 10%;text-align:centre">{record.no}</td>
                                            <td style="width: 25%;text-align:centre;">{record.reqLevel}</td>
                                            <td style="width: 25%;text-align:centre;">{record.custName}</td>
                                            <td style="width: 30%;text-align:centre;">{record.name}</td>
                                            <td style="width: 10%;text-align:centre;">                                                    
                                                <c-upload-view-delete-document 
                                                doc-detail-id={record.id}
                                                content-doc-id={record.contentId} 
                                                show-upload={record.showUpload}
                                                show-view={record.showView}
                                                show-delete={record.showDelete} 
                                                show-retake={record.showRetake} 
                                                show-location={record.showLocation}
                                                lattitude={record.lattitude}
                                                longitude={record.longitude}
                                                file-type={record.fileType}
                                                doc-name={record.docName}
                                                name={processObject}>
                                            </c-upload-view-delete-document>
                                        </td>
                                        </tbody>
                                    </template>
                                </table>
                            </div>
                        </template>
                    </div>
                    <footer class="slds-modal__footer" style="border: revert;">
                        <div class="slds-align_absolute-center">
                            <button class="cancel-button slds-button slds-button_brand"
                                style="border:none" onclick={handleClose}>Close</button>
                            <button class="SaveButton slds-button slds-button_brand" style="font-size: 11px;width: 140px;background-color: #113451;color: white;border-color: #113451;font-weight: 500;" onclick={handleSave}>Create</button> 
                        </div>
                    </footer>
                    -->
                    <template if:true={isSpinnerLoading}>
                        <div class="slds-spinner_container">
                            <lightning-spinner alternative-text="Loading applicants" variant="brand" size="large"></lightning-spinner>
                        </div>
                    </template>

                    <header class="slds-modal__header modal-header-custom select-doc-header">
                        <div class="slds-text-align_center">
                            <h2 class="slds-text-heading_medium slds-hyphenate"
                                style="font-size:15px;font-weight:bold;margin:5px 0;">
                                Select Documents
                            </h2>
                        </div>
                    </header>

                    <!-- Applicant picker -->
                    <div class="slds-modal__content slds-p-around_medium">
                        <template if:true={showApplicantPicker}>
                            <lightning-combobox name="applicant" label="Pick an Applicant" options={applicantOptions}
                                value={selectedApplicantId} placeholder="Select an applicant"
                                onchange={handleApplicantChange}>
                            </lightning-combobox>
                        </template>
                    </div>

                    <!-- Checklist -->
                    <div class="slds-modal__content slds-p-around_medium slds-modal__content_headless"
                        id="confirm-body2" style="min-height:30% !important;">
                        <template if:false={showApplicantPicker}>
                            <template for:each={docCheckList} for:item="section">
                                <div key={section.docType} class="doc-category-header">                                    {section.docType}
                                </div>
                                <template for:each={section.docList} for:item="doc">
                                    <div key={doc.Id} style="margin:1.5%;">
                                        <lightning-input type="checkbox" data-id={doc.Id} data-name={doc.Name}
                                            label={doc.Name} onchange={docSelectHandler} checked={doc.checked}
                                            disabled={doc.isDisabled}>
                                        </lightning-input>
                                    </div>
                                </template>
                            </template>
                        </template>
                    </div>

                    <footer class="slds-modal__footer split-footer select-doc-footer" style="border: revert;">
                        <div class="slds-align_absolute-center">
                            <button class="cancel-button slds-button slds-button_brand select-doc-close-btn" style="border:none" onclick={handleClose}>Close</button>
                            <button class="save-button slds-button slds-button_brand select-doc-confirm-btn" style="border:none" onclick={addDocHandler}>Confirm</button>
                        </div>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open slds-modal_large"></div>
        </template>
    </template>


    <template if:true={showSplitViewModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="split-view-header"
            class="slds-modal slds-fade-in-open split-modal">

            <div class="slds-modal__container split-container"
                style="max-width: 95vw; width: 95vw; min-height: 80vh; height: 80vh; max-height: 90vh;">


                <header class="slds-modal__header modal-header-custom">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    title="Close" onclick={closeSplitViewModal}>
                    <lightning-icon icon-name="utility:close" size="small" alternative-text="Close">
                    </lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                    <h2 id="split-view-header" class="slds-text-heading_medium" style="margin: 0;">
                        Split View - {selectedDocumentName}
                    </h2>
                </header>


                <div class="slds-modal__content slds-p-around_medium slds-scrollable_y split-content"
                    style="height: calc(100% - 140px); min-height: 400px; padding: 0.5rem;">


                    <div class="applicant-summary slds-m-bottom_small">
                       <div class="slds-grid slds-gutters slds-text-align_center"> 
                            
                            <div class="slds-col slds-size_1-of-4">
                                <strong>Applicant Name:</strong> {selectedApplicantName}
                            </div>
                            <div class="slds-col slds-size_1-of-4">
                                <strong>Customer Type:</strong> {selectedCustomerType}
                            </div>
                            <div class="slds-col slds-size_1-of-4">
                                <strong>Applicant Type:</strong> {selectedApplicantType}
                            </div> 
                            <div class="slds-col slds-size_1-of-4">
                                <strong>{financialStatus}</strong>
                            </div>
                            
                        </div>
                    </div>
                    <div class="slds-grid slds-gutters slds-wrap split-row" style="height: calc(100% - 120px); min-height: 300px;">

                        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-m-bottom_small" style="height: 100%;">
                            <div class="slds-box split-card "
                                style="height: 100%;  padding: 8px; overflow: hidden;">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">
                                    <lightning-icon icon-name="utility:file" size="small" class="slds-m-right_x-small">
                                    </lightning-icon>
                                    Document View
                                </h3>
                                <div class="split-card-body" style="height: calc(100% - 40px); overflow: auto;">
                                    <template if:true={selectedContentId}>
                                        <c-document-view-cmp record-id={recordId} doc-check-id={selectedDocumentId}
                                            content-doc-id={selectedContentId} extension={selectedDocExtension}
                                            is-split-view-mode={showSplitViewModal}
                                            single-document-data={selectedDocumentData}
                                            show-masking-check={selectedShowMaskingCheck}
                                            is-acknowledged={selectedIsAcknowledged} ocr-applicable={ocrForNewUploads}
                                            from-sales={fromSales} disabled={isDisabled}
                                            ondocumentuploaded={handleDocumentUploaded} 
                                            onocrcompleted={handleOCRCompleted} onocrready={handleOCRReady}>
                                        </c-document-view-cmp>
                                    </template>
                                    <template if:false={selectedContentId}>
                                        <div
                                            style="height: 100%; display: flex; align-items: center; justify-content: center; border: 1px dashed #ccc;">
                                            <div style="text-align: center; color: #666;">
                                                <lightning-icon icon-name="utility:upload" size="large"
                                                    class="slds-m-bottom_small">
                                                </lightning-icon>
                                                <p>No document uploaded yet</p>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2" style="height: 100%;">
                            <div class="slds-box split-card"
                                style="height: 100%; padding: 8px; overflow: hidden;">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">
                                    <lightning-icon icon-name="utility:edit" size="small" class="slds-m-right_x-small">
                                    </lightning-icon>
                                    Document Details
                                </h3>
                                <template if:true={sendForFCU}>
                                    <label class="slds-checkbox" style="display:flex; align-items:center; gap:.45rem;">
                                        <input type="checkbox" checked={isForFCU} onchange={handleFCUChange}/>
                                        <span class="slds-checkbox_faux"></span>
                                        <span class="slds-form-element__label"
                                            style="font-weight:700; font-size:1.05rem;">
                                            Send For FCU
                                        </span>
                                    </label>
                                </template>

                                <div class="split-card-body" style="height: calc(100% - 40px); overflow: auto;">
                                    <template if:true={singleDoc}>
                                        <template for:each={singleDoc} for:item="doc">
                                            <c-document-details-update-cmp key={doc.id} record-id={recordId}
                                                app-id={doc.applicantId} doc-check-id={doc.id} form-identifier={doc.name}
                                                address-record-id={doc.addressRecordId} name={doc.name} 
                                                catg={doc.docCategory} edit-fields={editFields}
                                                applicant-type={selectedApplicantType}>
                                            </c-document-details-update-cmp>
                                        </template>
                                    </template>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div class="slds-grid slds-gutters slds-m-top_small">
                        <div class="slds-col slds-size_1-of-2">
                            <template if:true={canShowVerify}>
                                <label class="slds-checkbox" style="display:flex; align-items:center; gap:.45rem;">
                                <input type="checkbox"
                                    checked={isVerified}
                                    onchange={handleVerifiedChange}
                                    disabled={disableVerified}/>
                                <span class="slds-checkbox_faux"></span>
                                <span class="slds-form-element__label" style="font-weight:700; font-size:1.05rem;">
                                Verify Document
                                </span>
                            </label>
                            </template>
                        </div>

                        <div class="slds-col slds-size_1-of-2"></div>
                    </div>

                </div>

                <footer class="slds-modal__footer split-footer">
                    <div class="split-footer-container">
                        <lightning-button class="previous-btn split-footer-btn" label="Previous" variant="brand"
                            onclick={handlePrev} disabled={disablePrev}>
                        </lightning-button>
                        <div class="split-footer-right">
                            <lightning-button class="close-btn split-footer-btn" label="Close" variant="neutral"
                                onclick={closeSplitViewModal}>
                            </lightning-button>
                            <lightning-button class="next-btn split-footer-btn" label="Next" variant="brand"
                                icon-name="utility:chevronright" icon-position="right" onclick={handleNext}
                                disabled={disableNext}>
                            </lightning-button>
                        </div>
                    </div>
                </footer>


            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" style="z-index: 9000;"></div>


    </template>


</template>

            <!-- Content Viewer -->
            <template if:false={noImage}>
                <div class="content-container" style="margin-top: 2%;">
                    <!-- PDF Preview -->
                    <template if:true={isPdf}>
                        <template if:true={showAndroidPdfButton}>
                            <div class="pdf-android-shell">
                            <div class="pdf-android-center">
                                <lightning-button variant="brand-outline" label="Open PDF"
                                    icon-name="utility:new_window" onclick={handleOpenPdfExternally}>
                                </lightning-button>
                            </div>
                            </div>
                        </template>
                        <template if:false={showAndroidPdfButton}>
                            <object
                                data={pdfUrl}
                                type="application/pdf"
                                style="width:100%; height:600px; border:none;"
                                aria-label="PDF preview"
                              >
                                <p>
                                  Your browser doesn’t support inline PDFs.
                                  <a href={pdfUrl} target="_blank">Download PDF</a>
                                </p>
                              </object>
                        </template>
                    </template>

                    <!-- Image Preview -->
                    <template if:true={showimage}>
                        <div class="scrollable">
                            <img
                                  data-id="documentImage"
                                  src={imageUrl}
                                  alt="Document Image"
                                  class="content-viewer"
                                  style="border:1px solid #000; margin-bottom:5px; width:70%;"
                                />
                        </div>
                    </template>
                </div>
            </template>
            <!-- No Image Message -->
            <template if:true={noImage}>
                <div class="no-document-message" style="text-align: center; margin-top: 2%;">
                    <lightning-icon icon-name="utility:document" size="large"></lightning-icon>
                    <p style="text-align: center; font-style: italic; color: gray;">Document Not Uploaded</p>
                </div>
            </template>
        </div>

        <!-- Action Buttons - Outside scrollable-content -->
        <template if:false={noImage}>
            <div>
                <lightning-layout horizontal-align="center" multiple-rows>
                    <!-- Zoom Out Button -->
                    <lightning-layout-item size="3" class="slds-text-align_center">
                        <lightning-button-icon icon-name="utility:dash" variant="bare" alternative-text="Zoom Out"
                            title="Zoom Out" size="large" class="slds-m-left_xx-small icon-blue" onclick={handleZoomOut}
                            disabled={disabled}>
                        </lightning-button-icon>
                    </lightning-layout-item>

                    <!-- Zoom In Button -->
                    <lightning-layout-item size="3" class="slds-text-align_center">
                        <lightning-button-icon icon-name="utility:zoomin" variant="bare" alternative-text="Zoom In"
                            title="Zoom In" size="large" class="slds-m-left_xx-small icon-blue" onclick={handleZoomIn}
                            disabled={disabled}>
                        </lightning-button-icon>
                    </lightning-layout-item>
                </lightning-layout>
            </div>
        </template>

        <!-- Upload Section -->
        <template if:false={loginChecklist}>
            <template if:true={ckyc}>
                <lightning-layout-item size="12">
                    <lightning-layout justify="start">
                        <lightning-layout-item>
                            <div class="trigger-api-container">
                                <template if:false={noImage}>
                                    <lightning-file-upload label="" name="fileUploader" disabled={disabled}
                                        accept=".png,.jpeg,.jpg,.pdf," record-id={recordId}
                                        onuploadfinished={handleReUpload}>
                                    </lightning-file-upload>
                                </template>
                                <template if:true={noImage}>
                                    <lightning-file-upload label="" name="fileUploader" disabled={disabled}
                                        accept=".png,.jpeg,.jpg,.pdf," record-id={recordId}
                                        onuploadfinished={handleUpload}>
                                    </lightning-file-upload>
                                </template>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                </lightning-layout-item>
            </template>

            <template if:true={showMaskingCheck}>
                <div style="padding-top: 5%;">
                    The system is currently unable to mask the uploaded Aadhar card. You can try again later or upload a
                    masked Aadhar by clicking the checkbox below.
                    <lightning-input class="comboBoxSelect" type="checkbox"
                        label="I acknowledge that I am uploading a masked Aadhar card." disabled={disableMaskingCheck}
                        checked={checked} onchange={handleAckowledgeChangeChange}></lightning-input>
                </div>
            </template>

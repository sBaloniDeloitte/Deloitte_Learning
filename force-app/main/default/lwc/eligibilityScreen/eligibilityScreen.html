<template>
    <span class="styleContainer"></span>
    <template if:true={spinner}>
        <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
    </template>

    <lightning-card>
        <div>
            <template if:true={showButton}>
                
            </template>
        </div>

        <div class="slds-m-around_medium slds-align_absolute-center">
            <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_cell-buffer custom-table">
                <thead>
                    <tr>
                        <th class="" style="text-align: center; background-color: skyblue; color: black; border-color: black;width: 20%;">Income Method</th>
                        <th class="" style="text-align: center; background-color: skyblue; color: black; border-color: black;width: 20%;">Eligible Loan Amount</th>
                        <!--<th class="" style="text-align: center; background-color: skyblue; color: black; border-color: black;width: 20%;">Final loan EMI (FICO)</th>
                        <th class="" style="text-align: center; background-color: skyblue; color: black; border-color: black;width: 10%;">Tenor</th>-->
                        <th class="" style="text-align: center; background-color: skyblue; color: black; border-color: black;width: 20%;">Action</th>
                        <template if:false={fromsales}>
                            <th class="" style="text-align: center; background-color: skyblue; color: black; border-color: black;width: 10%;">Considered Eligibility</th>
                        </template>
                    </tr>
                </thead>
                <tbody>
                   <template for:each={records} for:item="record">
    <tr key={record.eligibilityType}>
        <td style="width: 30%;">{record.eligibilityType}</td>
        <td style="width: 20%;">
            <lightning-input 
                type="number" 
                value={record.eligibleLoanAmount} 
                onchange={handleLoanAmountChange} 
                data-id={record.eligibilityType} 
                variant="label-hidden" 
                disabled={hasPsvOrDisbursalStage}>
            </lightning-input>
        </td>

        <!-- <td style="width: 20%;">{record.finalLoanEmi}</td>
        <td style="width: 20%;">{record.tenor}</td>-->

        <td style="width: 20%;">
            <template if:false={hasPsvOrDisbursalStage}>
                <button 
                    class="save-button slds-button slds-button_brand slds-m-right_medium" 
                    data-id={record.eligibilityTypeFicoName}
                    style="border:none" 
                    onclick={onClickAddButton} 
                    disabled={isDisabled}>
                    Save
                </button>
            </template>
        </td>

        <template if:false={fromsales}>
            <td style="width: 10%;">
                <template if:false={hasPsvOrDisbursalStage}>
                    <lightning-input 
                        type="radio" 
                        name="recordSelection" 
                        value={record.integrationId} 
                        disabled={record.isLock}
                        onchange={handleSelection} 
                        checked={record.consideredEligibility}>
                    </lightning-input>
                </template>
                <template if:true={hasPsvOrDisbursalStage}>
                    <lightning-input 
                        type="radio" 
                        name="recordSelection" 
                        value={record.integrationId} 
                        disabled
                        onchange={handleSelection} 
                        checked={record.consideredEligibility}>
                    </lightning-input>
                </template>
            </td>
        </template>
    </tr>
</template>

                </tbody>
            </table>
        </div>

        <br> <!-- Line break added -->
        <br> <!-- Extra spacing -->

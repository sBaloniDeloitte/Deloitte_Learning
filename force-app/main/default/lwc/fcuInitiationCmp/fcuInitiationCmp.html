<template>
    <template if:true={spinnerRun}>
        <section role="dialog" tabindex="-1" aria-labelledby="header43" class="slds-modal slds-fade-in-open"
            style="z-index: 900003;">
            <div class="slds-modal__container">
                <div class="slds-spinner--brand slds-spinner slds-spinner--medium" role="alert">
                    <span class="slds-assistive-text">Loading...</span>
                    <div class="slds-spinner__dot-a"></div>
                    <div class="slds-spinner__dot-b"></div>
                </div>
            </div>
        </section>
    </template>
    <template if:true={isTableVisible}>
        <div class="content slds-scrollable-x">
            <div class="slds-scrollable-x slds-scrollable-y external-events slds-scrollable"
                style="max-height: calc(100vh - 5rem);">
                <table
                    class="slds-table slds-table_cell-buffer slds-table_fixed-layout slds-table_bordered slds-table_col-bordered slds-table slds-table_cell-buffer slds-table_bordered slds-scrollable-x slds-scrollable-y doc-table-css"
                    style="overflow-y: scroll; overflow-x: scroll;width: 100%;" border="2">
                    <thead>
                        <tr class="slds-line-height_reset" style="width:2px; word-wrap:break-word;">
                            <th class="slds-text-title_caps tableCss" scope="col" style="width:6%;background: #111d30;color:#ffffff;">
                                <div class="slds-truncate" style="text-align: center;" title="Name">Sr. No.</div>
                            </th>
                            <th class="slds-text-title_caps tableCss" scope="col"
                                style="width:20%;background: #111d30;color:#ffffff;">
                                <div style="text-align: center;" title="Applicant Type">Document Name
                                </div>
                            </th>
                            <th class="slds-text-title_caps tableCss" scope="col"
                                style="width:20%;background: #111d30;color:#ffffff;">
                                <div style="text-align: center;" title="Status">Screening Status</div>
                            </th>
                            <th class="slds-text-title_caps tableCss" scope="col"
                                style="width:20%;background: #111d30;color:#ffffff;">
                                <div style="text-align: center;" title="Status">Verification Status</div>
                            </th>

                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={alldocuments} for:item="rec" for:index="index">
                            <tr class="slds-line-height_reset" key={rec.docChecklistId}>
                                <td scope="row" class="tableCss" style="width:4px; word-wrap:break-word;">
                                    <div class="slds-truncate slds-cell-wrap" style="text-align: center;">{rec.docCount}
                                    </div>
                                </td>
                                <td scope="row" class="tableCss" style="width:2px; word-wrap:break-word;">
                                    <!-- <div class="slds-truncate slds-cell-wrap"
                                    style="cursor: pointer; text-decoration: underline;" 
                                    onclick={handleDocChangeClick} 
                                    data-id={rec.docContentId}>
                                    {rec.docName}
                                    </div> -->
                                    <a href="javascript:void(0);" class="slds-truncate slds-cell-wrap"
                                        style="cursor: pointer; text-decoration: underline;color: #7db2ff"
                                        onclick={handleDocChangeClick} data-id={rec.docContentId}>
                                        {rec.docName}
                                    </a>
                                </td>

                                <td scope="row" class="tableCss" style="text-align: center;">
                                    <template if:false={rec.fcuinitiated}>
                                        <div class=" slds-cell-wrap" style="text-align: center;">{rec.screeningstatus}
                                        </div>
                                    </template>
                                    <template if:true={rec.fcuinitiated}>
                                        <div class="slds-truncate slds-cell-wrap" style="text-align: center;">FCU
                                            initiated
                                        </div>
                                    </template>
                                </td>
                                <td scope="row" class="tableCss" style="text-align: center;">
                                    <div class="slds-cell-wrap" style="text-align: center;">
                                        <!--{rec.Status}-->
                                        {rec.screeningstatus}
                                    </div>
                                </td>
                            </tr>
                        </template>

                    </tbody>
                </table>
                <footer class="slds-modal__footer slds-align_absolute-center slds-m-top_medium slds-m-top_xx-small"
                    style="border: revert;background: #0a1524;">
                    <button class="cancel-button slds-button slds-button_brand" onclick={handleBackConfirmationTab}>Back</button>
                </footer>
            </div>
        </div>
    </template>
    <template if:false={isTableVisible}>
        <template if:true={modalVisibility}>
            <template if:false={isVendor}>
                <template if:true={show5level}>
                    <lightning-layout>
                        <lightning-layout-item size="1">

                        </lightning-layout-item>
                        <lightning-layout-item size="2">
                            <div class="slds-align_absolute-center">
                                <template if:true={showApplicationSuccess}>
                                    <lightning-icon icon-name="utility:success" size="small" variant="success"
                                        alternative-text="complete" style="cursor: pointer;"
                                        onclick={handleShowApplicationLevel}></lightning-icon>
                                </template>
                                <template if:false={showApplicationSuccess}>
                                    <lightning-icon icon-name="utility:error" size="small" variant="error"
                                        alternative-text="incomplete" style="cursor: pointer;"
                                        onclick={handleShowApplicationLevel}></lightning-icon>
                                </template>
                            </div>
                            <div class="line slds-align_absolute-center"></div>
                            <div class="slds-text-align_center">
                                <p style="color: #ffffff; font-weight: 500; margin-top: 5px; font-size:12px">Application
                                    level documents</p>
                            </div>
                        </lightning-layout-item>
                        <lightning-layout-item size="2">
                            <div class="slds-align_absolute-center">
                                <template if:true={showApplicantSuccess}>
                                    <lightning-icon icon-name="utility:success" size="small" variant="success"
                                        alternative-text="complete" style="cursor: pointer;"
                                        onclick={handleApplicantLevel}></lightning-icon>
                                </template>
                                <template if:false={showApplicantSuccess}>
                                    <lightning-icon icon-name="utility:error" size="small" variant="error"
                                        alternative-text="incomplete" style="cursor: pointer;"
                                        onclick={handleApplicantLevel}></lightning-icon>
                                </template>
                            </div>
                            <div class="line slds-align_absolute-center"></div>
                            <div class="slds-text-align_center">
                                <p style="color: #ffffff; font-weight: 500; margin-top: 5px; font-size:12px">Applicant
                                    level documents</p>
                            </div>
                        </lightning-layout-item>
                        <lightning-layout-item size="2">
                            <div class="slds-align_absolute-center">
                                <lightning-icon icon-name="utility:error" size="small" variant="error"
                                    alternative-text="incomplete"></lightning-icon>
                            </div>
                            <div class="line slds-align_absolute-center"></div>
                            <div class="slds-text-align_center">
                                <p style="color: #ffffff; font-weight: 500; margin-top: 5px;">Co-applicant level

                            </div>

                            </div>

                        </lightning-layout-item>
                        <lightning-layout-item size="2">

                            </div>

                            </div>
                        </lightning-layout-item>
                        <lightning-layout-item size="1">

                    </lightning-layout>
                </template>

                                        <lightning-icon icon-name="utility:success" size="small" variant="success"
                                            alternative-text="complete" style="cursor: pointer;"
                                            onclick={handleShowApplicationLevel}></lightning-icon>
                                    </template>
                                    <template if:false={showApplicationSuccess}>
                                        <lightning-icon icon-name="utility:error" size="small" variant="error"
                                            alternative-text="incomplete" style="cursor: pointer;"
                                            onclick={handleShowApplicationLevel}></lightning-icon>
                                    </template>
                                </div>
                                <template if:true={showApplicationLevelLine}>
                                    <div class="line slds-align_absolute-center"></div>
                                </template>
                                <div class="slds-text-align_center">
                                    <p style="color: #113451; font-weight: 500; margin-top: 5px; font-size:12px">

                                </div>
                            </lightning-layout-item>
                        </template>
                        <template if:true={showApplicantLevel}>

                                    </template>
                                    <template if:false={showApplicantSuccess}>
                                        <lightning-icon icon-name="utility:error" size="small" variant="error"

                                    </template>
                                </div>
                                <template if:true={showApplicantLevelLine}>
                                    <div class="line slds-align_absolute-center"></div>
                                </template>
                                <div class="slds-text-align_center">
                                    <p style="color: #113451; font-weight: 500; margin-top: 5px;font-size:12px">
                                        Applicant level documents</p>
                                </div>
                            </lightning-layout-item>
                        </template>
                        <template if:true={showCollateralLevel}>

                                        <lightning-icon icon-name="utility:success" size="small" variant="success"

                                            onclick={handleCollateralLevel}></lightning-icon>
                                    </template>
                                    <template if:false={showCollateralSuccess}>
                                        <lightning-icon icon-name="utility:error" size="small" variant="error"
                                            alternative-text="incomplete" style="cursor: pointer;"
                                            onclick={handleCollateralLevel}></lightning-icon>
                                    </template>
                                </div>
                                <template if:true={showCollateralLevelLine}>
                                    <div class="line slds-align_absolute-center"></div>
                                </template>
                                <div class="slds-text-align_center">
                                    <p style="color: #113451; font-weight: 500; margin-top: 5px;font-size:12px">
                                        Collateral level documents</p>
                                </div>
                            </lightning-layout-item>
                        </template>
                    </lightning-layout>
                </template>
            </template>

                                </td>
                                <template if:true={currentDocOwner}>
                                    <td

                                        <p slot="title" style="font-size:11px; color: #ffffff;">{setRemarks}</p>
                                    </td>
                                </tr>
                            </template>
                           
                                <!-- <template for:each={queries} for:item="field" lwc:if={queries} for:index="index">

                                        <td

                        </table>
                    </lightning-layout-item>
                    <lightning-layout-item size="2">

            <div class="content-container">

                <template if:true={imageUrl}>

                <template if:true={isZipFolder}>
                    <div>

                    <div class="fixed-action-buttons">
                        <lightning-layout horizontal-align="center" multiple-rows>
                            <!-- Zoom Out Button -->
                            <lightning-layout-item size="auto" class="slds-text-align_center">
                                <lightning-button-icon 
                                    icon-name="utility:dash" 
                                    variant="bare"
                                    alternative-text="Zoom Out" 
                                    title="Zoom Out" 
                                    size="large"
                                    class="slds-m-left_xx-small icon-blue" 
                                    onclick={handleZoomOut}>
                                </lightning-button-icon>
                            </lightning-layout-item>

                                <lightning-button-icon

                                    variant="bare"
                                    alternative-text="Zoom In" 
                                    title="Zoom In" 
                                    size="large"
                                    class="slds-m-left_xx-small icon-blue"

                                            <button class="save-button slds-button slds-button_brand slds-m-left_small" onclick={handleSample}>Add to queue</button>

                                <template if:true={disableNext}>
                                    <button class="cancel-button slds-button slds-button_brand slds-m-left_small" onclick={handleLastNext}>Next</button>
                                </template>
                            </template>
                            <template if:true={buttonVisibilityScreened}>

                                    <template lwc:elseif={profile.Sampler}>
                                    </template>

                                    <template lwc:elseif={profile.Sampler}>

                            </template>

                aria-label="Meaningful description of the modal content" class="slds-modal slds-fade-in-open">

                    <header class="slds-modal__header" style="background-color: #1467eb; color:#ffffff;font-weight:500;">

                          variant="error"
                          size="small" ></lightning-icon>
                       <span class="slds-assistive-text">Close</span>
                    </button>
                        <div class="slds-text-align_center">
                            <h2 slot="title"

                        </div>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium slds-modal__content_headless slds-scrollable_y"

                        <div class="button-shadow"
                            style="width: 90%;background: #16283f; margin: 20px;padding: 20px;border-radius: 10px;border: 1px solid #33455e;">
                            <lightning-textarea label="Remarks" type="text" value={remarks}
                                onchange={handleSaveRemarksOnChange} required class="custom-input-style">
                            </lightning-textarea>

                        </div>
                        <footer
                            class="slds-modal__footer slds-align_absolute-center slds-m-top_medium slds-m-top_xx-small"
                            style="border: revert;">
                            <button class="cancel-button slds-button slds-button_brand" onclick={handleCloseRemarks}>Cancel</button>
                            <button class="save-button slds-button slds-button_brand"  onclick={handleSaveRemarks}>Save</button>
                        </footer>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open slds-modal_large"></div>
        </template>
    </template>
    <template if:true={openQueryModule}>
        <c-query-module-child-cmp record-id={recordId} onclosequerymodal={closeQueryModule} width-percentage =80
            onclosequerymodalwithdata={closeQueryModuleWithData} document-checklist-id={currentDocCheckListId} 
             onassignedquery={handleUpdateQueryAssignment} onclosemodal={handleCloseModal} module-name="FCU Module" ></c-query-module-child-cmp>
    </template>
</template>

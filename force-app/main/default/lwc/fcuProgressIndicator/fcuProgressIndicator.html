<template>
    <div class="slds-box slds-theme_default">
        <template lwc:if={isLoaded}>
            <template if:false={isParent}>
            <lightning-layout>
                <lightning-layout-item size="4">
                    <template lwc:if={progressStep.isDetailPresent}>
                        <div class="slds-align_absolute-center">
                            <lightning-icon icon-name="utility:success" size="small" variant="success" alternative-text="incomplete"></lightning-icon>
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="slds-align_absolute-center">
                            <lightning-icon icon-name="utility:error" size="small" variant="error" alternative-text="incomplete"></lightning-icon>
                        </div>
                    </template>
                    <div class={isMobile}></div>
                    <div class="slds-text-align_center">
                        <p style="color: #113451; font-weight: 500; margin-top: 5px;">Details</p>
                    </div>
                </lightning-layout-item>
                
                <lightning-layout-item size="4">
                    <template lwc:if={progressStep.isSubmitted}>
                        <div class="slds-align_absolute-center">
                            <lightning-icon icon-name="utility:success" size="small" variant="success" alternative-text="incomplete"></lightning-icon>
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="slds-align_absolute-center">
                            <lightning-icon icon-name="utility:error" size="small" variant="error" alternative-text="incomplete"></lightning-icon>
                        </div>
                    </template>
                    <div class={isMobile}></div>
                    <div class="slds-text-align_center">
                        <p style="color: #113451; font-weight: 500; margin-top: 5px;">Submit</p>
                    </div>
                </lightning-layout-item>
                <lightning-layout-item size="4">
                    <template lwc:if={progressStep.isApproved}>
                        <div class="slds-align_absolute-center">
                            <lightning-icon icon-name="utility:success" size="small" variant="success" alternative-text="incomplete"></lightning-icon>
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="slds-align_absolute-center">
                            <lightning-icon icon-name="utility:error" size="small" variant="error" alternative-text="incomplete"></lightning-icon>
                        </div>
                    </template>
                    <div class="slds-text-align_center">
                        <p style="color: #113451; font-weight: 500; margin-top: 5px;">Approved</p>
                    </div>
                </lightning-layout-item>
            </lightning-layout>
        </template>
        </template>
        
    </div>
</template>

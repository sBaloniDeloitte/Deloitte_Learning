                                                <lightning-input-field field-name='Interest_paid_on_loans__c'
                                                    variant="label-stacked" disabled={isConsolidated} required="true">
                                                </lightning-input-field>
                                            </lightning-layout-item>
                                            <lightning-layout-item size="4" class="slds-p-around_x-small">
                                                <lightning-input-field
                                                    field-name='Interest_or_salary_to_directors_partners__c'
                                                    variant="label-stacked" disabled={isConsolidated} required="true">
                                                </lightning-input-field>
                                            </lightning-layout-item>
                                            <lightning-layout-item size="4" class="slds-p-around_x-small">
                                                <lightning-input-field
                                                    field-name='Salary_paid_to_directors__c'
                                                    variant="label-stacked" disabled={isConsolidated} onfocus={handleStopPropogation} required="true">
                                                </lightning-input-field>
                                            </lightning-layout-item>
                                        </lightning-layout>
                                    </div>
                                    <template if:false={isConsolidated}>
                                        <div class="sactionDiv">
                                            <p class="sactionHeader">Upload FSA Document</p>
                                            <div class="slds-grid slds-gutters" style="padding: 15px;">
                                                <div class="slds-col slds-size_4-of-4 slds-align_absolute-center">
                                                    <template if:false={documentDetails}>
                                                        <button onclick={openCamera} style="background-color: var(--accent); width: 120px; font-weight: bold; height: 38px; color: #ffffff;" disabled={isDisabledFSA}>Upload</button>
                                                    </template>
                                                    <template if:true={documentDetails}>
                                                        <button onclick={handleView} style="background-color: var(--accent-hover); width: 120px; font-weight: bold; height: 38px; color: #ffffff;">Preview</button>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                    <lightning-layout multiple-rows>
                                        <template if:false={isConsolidated}>
                                            <lightning-layout-item size="12"
                                                class="slds-p-around_x-small rec-edit-button"
                                                style="text-align: center;">
                                                <button class="save-button slds-button slds-button_brand"
                                                    type="submit" disabled={isDisabledFSA}>Save</button>
                                            </lightning-layout-item>
                                        </template>
                                    </lightning-layout>

                                </div>
                            </lightning-record-edit-form>

                        </lightning-tab>
                        <!-- <lightning-tab label="Eligibility History" onactive={handleActive}>
                            <lightning-layout multiple-rows>
                            </lightning-layout>
                        </lightning-tab> -->

                    </lightning-tabset>
                </div>
            </template>
        </div>
        <div class="slds-col slds-size_3-of-12">

        </div>

    </div>
    
    <template if:true={showImage}>
        <c-popup-screen 
            show-preview-cmp="true"
            image-url={imageURL}
            pdf-url={pdfURL}
            width-percentage="80"
            header-title="FSA Document"
            show-close-btn=true
            show-save-btn=false
            save-btn-text="Retake"
            process-name="Reupload File"
            onhandleclose={handleClose}
            onhandleretake={reUploadFile}
        ></c-popup-screen>
    </template>
</template>

    <template if:true={showgenericConfirm}>

                    <h2 class="slds-text-heading_medium">Confirmation Screen</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    {confirmMessage}
                </div>
                <footer class="slds-modal__footer slds-text-align_center" style="background-color: #5bb6e3;">
                    <button class="slds-button slds-button_brand" style="background-color: #dc387e; margin-right: 7px; width: 100px;" onclick={handleNegative}>No</button>
                    <button class="slds-button slds-button_brand" style="background-color: #9bbf56; width: 100px;" onclick={handlePositive}>Yes</button>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

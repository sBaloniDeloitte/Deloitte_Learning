<template>
    <template if:true={spinnerRun}>
        <section role="dialog" tabindex="-1" aria-labelledby="header43" class="slds-modal slds-fade-in-open" style="z-index: 900003;">
            <lightning-spinner></lightning-spinner>
        </section>
    </template>
    <template if:true={dataLoaded}>
        <div class="slds-grid slds-wrap slds-scrollable_x" style="margin-bottom:2%">
          <div class="select-name-table-wrap">
           <table class="slds-table select-name-table">
                <thead >
                    <tr>
                        <th scope="col" class="select-name-th select-name-th-select">Select</th>
                        <th scope="col" class="select-name-th">Name</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={applicantList} for:item="iter">
                        <tr key={iter.name}>
                            <td class="select-name-td select-name-td-select">
                                <lightning-input type="checkbox" data-id={iter.appId} checked={iter.isDataCreated} onchange={handleCheckboxChange}></lightning-input>
                            </td>
                            <td class="select-name-td">{iter.name}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
          </div>
        </div>
        <template if:true={showTab}>
            <c-hl-director-renumeration record-id={recordId}></c-hl-director-renumeration>
        </template>
    </template>
     <template if:true={confirmationScreen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Confirmation Screen</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    Are you sure you want to remove this applicant’s director renumeration record?
                </div>
                <footer class="slds-modal__footer slds-text-align_center" >
                    <button class="slds-button slds-button_brand" style="background-color: #7c3aed; color: #000000; border: none; border-radius: 8px; height: 36px; min-width: 90px; font-weight: 700; margin-right: 100px;" onclick={onClickModalNo}>No</button>
                    <button class="slds-button slds-button_brand" style="background-color: #7c3aed; color: #000000; border: none; border-radius: 8px; height: 36px; min-width: 90px; font-weight: 700;" onclick={onClickModalYes}>Yes</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>

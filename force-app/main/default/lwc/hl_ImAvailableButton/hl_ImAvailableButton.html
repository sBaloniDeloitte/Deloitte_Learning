<template>
    <lightning-card title="Daily Availability" icon-name="standard:user">
        <div class="slds-p-around_medium">
            
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>

            <template if:true={isUnavailable}>
                <div class="slds-text-heading_medium slds-text-color_success">
                    <lightning-icon icon-name="utility:success" size="small"></lightning-icon>
                    You are marked as unavailable for today!
                </div>
            </template>

            <template if:false={isUnavailable}>
                <template if:false={isLoading}>
                    <lightning-button
                        variant="brand"
                        label="I'm Unavailable Today"
                        title="Click to mark yourself as unavailable"
                        onclick={handleAvailableClick}>
                    </lightning-button>
                </template>
            </template>

        </div>
    </lightning-card>
</template>

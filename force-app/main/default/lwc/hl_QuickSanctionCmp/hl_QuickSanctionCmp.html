<template>
    <template if:true={showLoader}>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </template>
    <template if:true={showErrorList}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-label="Meaningful description of the modal content" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container" style={cssStyle}>
                <header class="slds-modal__header" style="background-color: skyblue; color:black;font-weight:500;">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleClose}>
                       <lightning-icon icon-name="utility:close"
                          alternative-text="close"
                          variant="error"
                          size="small" ></lightning-icon>
                       <span class="slds-assistive-text">Close</span>
                    </button>
                    <div class="slds-text-align_center">
                        <h2 slot="title" style="font-style: Lato Bold; font-size:15px; font-weight: bold; margin-top: 5px; margin-bottom: 5px" class="slds-text-heading_medium slds-hyphenate">Quick Sanction Validations</h2>
                    </div> 
                </header>
                <div class="slds-modal__content slds-p-around_medium slds-modal__content_headless slds-scrollable_y" id="confirm-body" style="max-height: 100% !important;overflow: auto;">
                    <template for:each={errorList} for:item="data">
                        <p style="font-size: 14px;color: red;" key={data}>{data}</p>
                    </template>
                </div>
                <footer class="slds-modal__footer" style="border: revert;">
                    <div class="slds-align_absolute-center">
                        <button class="SaveButton slds-button slds-button_brand" style="font-size: 11px;width: 140px;background-color: rgb(220, 56, 126);color: black;border-color: #113451;font-weight: 500;" onclick={handleClose}>Cancel</button>
                    </div>
                </footer>
           </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open slds-modal_large"></div>
    </template>
        <template if:true={showSuccessMessage}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-label="Meaningful description of the modal content" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container" style={cssStyle}>
                <header class="slds-modal__header" style="background-color: skyblue; color:black;font-weight:500;">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCloseSuccess}>
                       <lightning-icon icon-name="utility:close"
                          alternative-text="close"
                          variant="error"
                          size="small" ></lightning-icon>
                       <span class="slds-assistive-text">Close</span>
                    </button>
                    <div class="slds-text-align_center">
                        <h2 slot="title" style="font-style: Lato Bold; font-size:15px; font-weight: bold; margin-top: 5px; margin-bottom: 5px" class="slds-text-heading_medium slds-hyphenate">Quick Sanction Validations</h2>
                    </div> 
                </header>
                <div class="slds-modal__content slds-p-around_medium slds-modal__content_headless slds-scrollable_y" id="confirm-body2" style="max-height: 100% !important;overflow: auto;">
                        <p style="font-size: 14px;color: red;">{showMessage}</p>
                </div>
                <footer class="slds-modal__footer" style="border: revert;">
                    <div class="slds-align_absolute-center">
                        <button class="SaveButton slds-button slds-button_brand" style="font-size: 11px;width: 140px;background-color: rgb(220, 56, 126);color: black;border-color: #113451;font-weight: 500;" onclick={handleCloseSuccess}>Cancel</button>
                        <template if:true={checkBreApi}>
                            <button class="SaveButton slds-button slds-button_brand" style="font-size: 11px;width: 140px;background-color: rgb(220, 56, 126);color: black;border-color: #113451;font-weight: 500;" onclick={handleProceed}>Proceed</button>
                        </template>
                    </div>
                </footer>
           </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open slds-modal_large"></div>
    </template>
</template>

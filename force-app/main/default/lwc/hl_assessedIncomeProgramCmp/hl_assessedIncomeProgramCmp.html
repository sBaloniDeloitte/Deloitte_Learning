<template>
    <template if:true={spinnerRun}>
        <section role="dialog" tabindex="-1" aria-labelledby="header43" class="slds-modal slds-fade-in-open" style="z-index: 900003;">
            <lightning-spinner></lightning-spinner>
        </section>
    </template>
    <template if:true={dataLoaded}>
        <div class="slds-grid slds-wrap slds-scrollable_x" style="margin-bottom:2%">
           <table class="slds-table" style="width: 500px;">
                <thead style="text-align: left;">
                    <tr>
                        <th class="color-theme" style="text-align: left;width: 100px;">Select</th>
                        <th class=" color-theme" style="text-align: left;">Name</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={applicantList} for:item="iter">
                        <tr key={iter.name}>
                            <td>
                                <lightning-input type="checkbox" data-id={iter.appId} checked={iter.isDataCreated} onchange={handleCheckboxChange}></lightning-input>
                            </td>
                            <td>{iter.name}</td>
                        </tr>
                    </template>
                </tbody>
            </table>

        </div>
        <template if:true={showTab}>
            <lightning-tabset>
                <template for:each={tabList} for:item="record" for:index="index">
                    <lightning-tab key={record.name} label={record.name}>
                        <c-hl_assessed-income-program-child-cmp loan-id={recordId} applicant-id={record.appId}></c-hl_assessed-income-program-child-cmp>
                    </lightning-tab>
                </template>
            </lightning-tabset>
        </template>
    </template>
    <template if:true={confirmationScreen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Confirmation Screen</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    Are you sure you want to remove this applicant’s Gross Margin record?
                </div>
                <footer class="slds-modal__footer slds-text-align_center">
                    <button class="btn-negative-action slds-button slds-button_brand" style="margin-right: 7px; width: 100px; " onclick={onClickModalNo}>No</button>
                    <button class="btn-positive-action slds-button slds-button_brand" style="width: 100px;" onclick={onClickModalYes}>Yes</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>

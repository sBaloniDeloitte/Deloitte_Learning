<template>
    <template if:true={isModalOpen}>

        <div class="slds-backdrop slds-backdrop_open"></div>

        <!-- MODAL -->
        <div class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- HEADER -->
                <header class="slds-modal__header" style="background-color:#87CEEB; border-bottom:1px solid #ccc;">
                    <h2 class="slds-text-heading_medium slds-hyphenate" 
                        style="text-align:center; font-weight:700; color:#16325c;">
                        Assign to CM for Covenant Approval
                    </h2>
                </header>

                <!-- BODY -->
                <div class="slds-modal__content slds-p-around_medium">
                    
                    <template if:true={showOptions}>
                        <lightning-radio-group
                            name="radioGroup"
                            label="Select an Approver"
                            options={approverOptions}
                            value={approver}
                            onchange={handleApproverChange}
                            required
                            type="radio"
                            message-when-value-missing="Please select an approver">
                        </lightning-radio-group>
                    </template>

                    <template if:true={isConfirm}>
                        <p style="text-align:center;">
                            Are you sure you want to perform this action?
                        </p>
                    </template>

                    <template if:true={isLoading}>
                        <div class="loading-overlay">
                            <lightning-spinner alternative-text="Assigning..." size="medium" variant="brand"></lightning-spinner>
                        </div>
                    </template>

                </div>

                <!-- FOOTER -->
                <footer class="slds-modal__footer" style="background-color:#87CEEB;">
                    <div class="slds-grid slds-grid_align-center slds-gutters_small">
                        <template if:true={showOptions}>
                            <button class="slds-button slds-button_brand" onclick={handleNext} disabled={isLoading}>
                                Next
                            </button>
                        </template>
                        <template if:true={isConfirm}>
                            <button class="slds-button slds-button_brand" onclick={handleApprovalYes} disabled={isLoading}>
                                Send for Approval
                            </button>
                        </template>
                        <button class="slds-button slds-button_destructive" onclick={handleCancel} disabled={isLoading}>
                            Cancel
                        </button>
                    </div>
                </footer>
            </div>
        </div>
    </template>
</template>

<template>
    <div class="slds-scrollable_x hl-covenant-dark-theme" style="overflow: auto;">
        <span class="styleContainer"></span>
        <template lwc:if={showNoRecords}>

        <template lwc:else>

            <template lwc:if={showSummaryStyle}>

                                        Covenant Name
                                        </th>

                                        <th scope="col" style=" background-color: #5bb6e3;border: 1px solid black"  class="slds-col slds-size_1-of-12 slds-m-top_x-small">Status</th>

                                                        {record.covenantType}

                                                </td>

                                                        <div class="slds-text-color_success slds-cell-wrap" style="overflow:auto">
                                                             {record.description}

                                                            onchange={handleChange} onblur={handleOnBlur} disabled={disableDocField}>
                                                        </lightning-select>
                                                    </div>
                                                </td>
                                                <td class="slds-col slds-size_1-of-12" style="border: 1px solid black;">
                                                    <div class="slds-truncate slds-cell-wrap">

                                                        <lightning-select  variant="label-hidden" name="Status__c" data-id={record.documentMasterId} data-docid={record.documentDetailId}

                                                            onchange={handleChange} onblur={handleOnBlur} disabled={disableDocField}>
                                                        </lightning-select>

                                                        </lightning-input>

                                                                options={nodOptions}

                                                            </lightning-select>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td class="slds-col slds-size_1-of-12" style="border: 1px solid black;">
                                                    <template lwc:if={record.documentDetailId}>
                                                     <lightning-layout key={record.documentDetailId} horizontal-align="space-between" vertical-align="center">
                                                        <div style="display: flex; align-items: center; gap: 20px; justify-content: flex-start;padding-bottom: 2%;">

                                                                </lightning-icon> -->

                                                    </lightning-layout>

                                                <td class="slds-col slds-size_1-of-12" style="border: 1px solid black;">
                                                    <div class="slds-truncate slds-cell-wrap">
                                                        <lightning-select  variant="label-hidden" name="Approval_Level__c" data-id={record.documentMasterId} data-docid={record.documentDetailId}

                                                            onchange={handleChange} onblur={handleOnBlur} disabled={disableDocField}>
                                                        </lightning-select>
                                                    </div>

                                                <td class="slds-col slds-size_2-of-12" style="border: 1px solid black;">
                                                        <div class="slds-text-color_success slds-cell-wrap" style="overflow:auto">
                                                             
                                                        </div>

                                                <td class="slds-col slds-size_1-of-12" style="border: 1px solid black;">
                                                    <div class="slds-truncate slds-cell-wrap">
                                                        <lightning-select  variant="label-hidden" name="Approval_Status__c" data-id={record.documentMasterId} data-docid={record.documentDetailId}
                                                            label="Select Status"
                                                            value={record.approvalStatus}
                                                            options={approvalStatusOptions}
                                                            onchange={handleChange} onblur={handleOnBlur} disabled={disableDocField}>
                                                        </lightning-select>
                                                    </div>
                                                </td><!--Sanwar-->
                                                <template if:false ={record.hideDeleteIcon}>
                                                    <td class="slds-col slds-size_1-of-12" style="border: 1px solid black; text-align: center;">
                                                        <lightning-icon icon-name="utility:delete"

                                                                        size="small"
                                                                        class="slds-m-left_x-small delete-icon clickable"
                                                                        data-id={record.documentMasterId} data-docid={record.documentDetailId}
                                                                        onclick={handleDeleteRecord}>
                                                        </lightning-icon>
                                                    </td>
                                                </template>
                                                
                                            </tr>
                                        
                                        </template>
                                    </template>

                                                                value={record.Status__c} onchange={handleChange} onblur={handleOnBlur}>

                                                            <lightning-select  variant="label-hidden" name="Document_Category__c"

                                                            onchange={handleChangeRecord}>
                                                            </lightning-select>
                                                        </div>
                                                    </td>

                                                     <td class="slds-col slds-size_1-of-12" style="border: 1px solid black;">

                                                            <lightning-select  variant="label-hidden" name="Document_Type__c"

                                                            onchange={handleChangeRecord}>
                                                            </lightning-select>
                                                        </div>

                                                    <td class="slds-col slds-size_1-of-12" style="border: 1px solid black;">
                                                        <div class="slds-truncate slds-cell-wrap">
                                                            <!-- <lightning-input  data-id={record.documentMasterId} data-docid={record.documentDetailId} type="text" name="Status__c"
                                                                value={record.Status__c} onchange={handleChange} onblur={handleOnBlur}>
                                                            </lightning-input> -->
                                                            <lightning-select  variant="label-hidden" name="Document_Name__c"
                                                            data-id="docNameCb"

                                                            options={docNameOptions}
                                                            onchange={handleChangeRecord}>
                                                            </lightning-select>
                                                        </div>
                                                    </td>
                    
                                                    <td class="slds-col slds-size_2-of-12" style="border: 1px solid black;">

                                                            <div class="slds-text-color_success slds-cell-wrap" style="overflow:auto; margin-bottom: 14px;">
                                                                <lightning-input
                                                                    name="Description__c"
                                                                    value={descriptionValue}
                                                                    type="text"
                                                                    onchange={handleChangeRecord}>
                                                                </lightning-input>
                                                            </div>
                                                    </td>
                    
                                                    <td class="slds-col slds-size_1-of-12" style="border: 1px solid black;">
                                                        <div class="slds-truncate slds-cell-wrap">
                                                            <!-- <lightning-input  data-id={record.documentMasterId} data-docid={record.documentDetailId} type="text" name="Status__c"
                                                                value={record.Status__c} onchange={handleChange} onblur={handleOnBlur}>
                                                            </lightning-input> -->
                                                            <lightning-select  variant="label-hidden" name="Type__c" 
                                                            label="Select Type"
                                                            options={typeOptions}
                                                                onchange={handleChangeRecord}  disabled={disableDocField}>
                                                            </lightning-select>
                                                        </div>
                                                    </td>
                                                    <td class="slds-col slds-size_1-of-12" style="border: 1px solid black;">
                                                        <div class="slds-truncate slds-cell-wrap">
                                                            <lightning-select  variant="label-hidden" name="Status__c" 
                                                            label="Select Status"
                                                            options={statusOptions}
                                                            onchange={handleChangeRecord}  disabled={disableDocField}>
                                                            </lightning-select>
                                                        </div>
                                                    </td>
                                                    <td class="slds-col slds-size_1-of-12" style="border: 1px solid black;">
                                                        <div class="slds-truncate slds-cell-wrap" style="overflow:auto">
                                                            <lightning-textarea
                                                                name="Remarks__c" onchange={handleChangeRecord} disabled={disableDocField}>
                                                            </lightning-textarea>
                                                        </div>
                                                    </td>
                                                    <td class="slds-col slds-size_1-of-12" style="border: 1px solid black;">
                                                        <div class="slds-truncate slds-cell-wrap" style="padding-bottom: 18px">
                                                            <lightning-input 
                                                            name="Target_Date__c" type="date" onchange={handleChangeRecord} min={today} max={futureDate} disabled={disableDocField}><!--Sanwar-->
                                                            </lightning-input>
                                                        </div>
                                                    </td>
                    
                                                    <td class="slds-col slds-size_1-of-12" style="border: 1px solid black;">
                                                        <div class="slds-truncate slds-cell-wrap" style="padding-bottom: 18px">
                                                            <lightning-input type="date" name="Document_Date_of_Receipt__c"
                                                                onchange={handleChangeRecord} min={today} max={futureDate} disabled={disableDocField}> <!--Sanwar-->
                                                            </lightning-input>
                                                        </div>
                                                    </td>
                    
                                                    <td class="slds-col slds-size_1-of-12" style="border: 1px solid black;">
                                                        <div class="slds-truncate slds-cell-wrap">                                            
                                                                <lightning-select  variant="label-hidden" name="Nature_of_Document__c" 
                                                                    label="Select Options"
                                                                    options={nodOptions}
                                                                    onchange={handleChangeRecord} disabled={disableDocField}>
                                                                </lightning-select>
                                                        </div>
                                                    </td>
                                                    <td class="slds-col slds-size_1-of-12" style="border: 1px solid black;">
                                                            <lightning-layout>
                                                            <div style="display: flex; align-items: center; gap: 20px; justify-content: flex-start;padding-bottom: 2%;">
                                                                    
                                                            </div>
                                                        </lightning-layout>
                                                    </td>
                                                    <td class="slds-col slds-size_1-of-12" style="border: 1px solid black;">
                                                        <div class="slds-truncate slds-cell-wrap">                                            
                                                                <lightning-select  variant="label-hidden" name="Approval_Level__c" 
                                                                    label="Select Options"
                                                                    options={approvalLevelOptions}
                                                                    onchange={handleChangeRecord} disabled={disableDocField}>
                                                                </lightning-select>
                                                        </div>
                                                    </td>

                                                    <td class="slds-col slds-size_1-of-12" style="border: 1px solid black;">
                                                        <div class="slds-truncate slds-cell-wrap" style="padding-bottom: 18px">
                                                            
                                                        </div>
                                                    </td>

                                                    <td class="slds-col slds-size_1-of-12" style="border: 1px solid black;">
                                                        <div class="slds-truncate slds-cell-wrap">                                            
                                                                <lightning-select  variant="label-hidden" name="Approval_Status__c"

                                                                    onchange={handleChangeRecord} disabled={disableDocField}>

                                                        </div>

                                                </tr>

                                </tbody>

                        <template lwc:if={showCovenantSection}> 
                            <div class="slds-grid slds-grid_align-end">
                                <button class="slds-button slds-button_brand" style="font-size: 11px;width: 140px;background-color: #fafcfc;color: rgb(5, 0, 0);border-color: #01050a;font-weight: 500;" onclick={handleClose}>Cancel</button>
                                <button class="save-button slds-button slds-button_brand" onclick={handleSave} >
                                    Save
                                </button>
                            </div>
                        </template>
            </template>

        </template>
    </div>

    <template lwc:if={isLoading}>
        <lightning-spinner alternative-text="Loading" variant="brand" size="large">
        </lightning-spinner>
    </template>

    <template if:true={showConfirmation}>

            <c-confirmation-screen confirm-message={confirmMessage} negative-label="No" positive-label="Yes"
            onnegativeclick={handleNo} onpositiveclick={handleDocDelete}>
        </c-confirmation-screen>
    </template>
</template>

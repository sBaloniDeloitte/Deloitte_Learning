<template>
    <span class="styleContainer"></span>
    <c-product-table record-id={recordId} is-one-view=true></c-product-table>
    <template if:true={spinner}>
        <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
    </template>
    <template if:false={isOneView}>
    <template if:true={approvalData.showApprovalButtons}>
        <template if:false={spinner}>
        <div style="padding:1%">
            <template if:true={approvalData.showApproveButton}>
                <button class="SaveButton slds-button slds-button_brand"
                    style="margin-bottom: 3px;font-size: 11px;width: 140px;background-color: green;color: white;border-color: black;font-weight: 500;"
                    data-name="Approv" onclick={handleAction} onfocus={stopPropogation}
                    onblur={stopPropogation}>Approve</button>
            </template>
            <!--
            <template if:true={approvalData.showRecommendButton}>
                <button class="SaveButton slds-button slds-button_brand" style="font-size: 11px;width: 140px;background-color: green;color: white;border-color: black;font-weight: 500;" data-name="Recommended" onclick={handleAction} onfocus={stopPropogation} onblur={stopPropogation} >Recommend</button>
            </template>
            -->
            

            <template if:true={approvalData.showSubmitApprovalButton}>
                <button class="SaveButton slds-button slds-button_brand"
                    style="margin-bottom: 3px;font-size: 11px;width: 140px;background-color: green;color: white;border-color: black;font-weight: 500;"
                    data-name="submitted For Approval" onclick={handleAction} onfocus={stopPropogation}
                    onblur={stopPropogation}>Submit for Approval</button>
            </template>
            <!--
            <template if:true={approvalData.showHoldButton}>
                <button class="SaveButton slds-button slds-button_brand" style="font-size: 11px;width: 140px;background-color: #FFC107;color: white;border-color: black;font-weight: 500;" data-name="Send Back" onclick={handleAction} onfocus={stopPropogation} onblur={stopPropogation} >Send Back</button>
                <button class="SaveButton slds-button slds-button_brand" style="font-size: 11px;width: 140px;background-color: blue;color: white;border-color: black;font-weight: 500;" data-name="Hold" onclick={handleAction} onfocus={stopPropogation} onblur={stopPropogation} >Hold</button>
            </template>-->
            <template if:true={approvalData.showRejectButton}>
                <button class="SaveButton slds-button slds-button_brand"
                    style="margin-bottom: 3px;font-size: 11px;width: 140px;background-color: red;color: white;border-color: black;font-weight: 500;"
                    data-name="Reject" onclick={handleAction} onfocus={stopPropogation}
                    onblur={stopPropogation}>Reject</button>
            </template>
            <template if:true={approvalData.showSendBackButton}>
                <button class="SaveButton slds-button slds-button_brand"
                    style="margin-bottom: 3px;font-size: 11px;width: 140px;background-color: red;color: white;border-color: black;font-weight: 500;"
                    data-name="Send Back" onclick={handleAction} onfocus={stopPropogation}
                    onblur={stopPropogation}>Send Back</button>
            </template>
            <template if:true={approvalData.showPullBackButton}>
                <button class="SaveButton slds-button slds-button_brand"
                    style="margin-bottom: 3px;font-size: 11px;width: 140px;background-color: red;color: white;border-color: black;font-weight: 500;"
                    data-name="Recall" onclick={handleAction} onfocus={stopPropogation}
                    onblur={stopPropogation}>Recall</button>
            </template>
           

             <template if:true={approvalData.showRecommendButton}>
                <button class="SaveButton slds-button slds-button_brand" style="margin-bottom: 3px;font-size: 11px;width: 140px;background-color: green;color: white;border-color: black;font-weight: 500;" data-name="Recommended" onclick={handleAction} onfocus={stopPropogation} onblur={stopPropogation} >Recommend</button>
            </template>
             <template if:true={approvalData.showSubmitApprovalOptions}>
                <div style="width: 12%;display: inline-block;padding: 0px 6px;">
                <lightning-combobox variant = "label-hidden" name="progress" label="Select Approver" value={value} placeholder="Select Approver" options={options} onchange={handleChangeApprover} ></lightning-combobox>
                    </div>
            </template>
            <template if:true={approvalData.markAsComplete}>
                    <button class="SaveButton slds-button slds-button_brand"
                    style="margin-bottom: 3px;font-size: 11px;width: 140px;background-color: green;color: white;border-color: black;font-weight: 500;"
                    data-name="MarkAsComplete" onclick={handleAction} onfocus={stopPropogation}
                    onblur={stopPropogation}>Mark As Complete</button>
            </template>

        </div>
        </template>
        <template if:true={showRejectModal}>
                <c-reject-loan-application-cmp record-id={recordId} onclose={handleRejectClose}
                    onsuccess={handleRejectSuccess}>
                </c-reject-loan-application-cmp>
            </template>
    </template>
</template>
    <template if:false={spinner}>
        <lightning-layout>
            <lightning-layout-item size="6">
                <div style="padding:1%">
                    <lightning-layout>
                        <lightning-layout-item size="12">
                            <div>
                                <p slot="title" class="approval-status-heading">Approval Status</p>
                                <div style="padding:1%;padding-top: 3%">
                                    <table
                                        class="slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered slds-table_col-bordered slds-border_left slds-border_right"
                                        style=" border-color: black">
                                        <tr>
                                            <th
                                                style=" text-align: center; background-color: #16283f; color: white; border-color: black;font-weight: 700;">
                                                Current Approval Status</th>
                                            <th
                                                style=" text-align: center; background-color: #16283f; color: white; border-color: black;font-weight: 700;">
                                                Approving Authority</th>
                                            <th
                                                style=" text-align: center; background-color: #16283f; color: white; border-color: black;font-weight: 700;">
                                                Current Approver</th>
                                        </tr>
                                        <tr>
                                            <td style=" border-color: black">{approvalData.currentStatus}</td>
                                            <td style=" border-color: black">{approvalData.finalAuthority}</td>
                                            <td style=" border-color: black">{approvalData.currentApprover}</td>
                                        </tr>
                                    </table>
                                </div>


                            </div>



                        </lightning-layout-item>
                    </lightning-layout>

                </div>
            </lightning-layout-item>
        </lightning-layout>

    </template>
    <template if:false={isOneView}>
    <lightning-layout>
        <lightning-layout-item size="12">
            <div style="padding:1%">

                <template if:true={approvalData.showApprovalButtons}>
                    <template if:false={spinner}>
                    <div style="padding:1%">
                        <lightning-layout>
                            <lightning-layout-item size="12">
                                <div class="custom-div">
                                    <p slot="title" class="required-field"
                                        style="font-size: 106%;/* font-style: italic; */color: black;font-weight: bold;text-align: left;">
                                        Approval Notes ( Kindly do not enter the following combination of special characters
                                        '%%- and &&-'.)</p>
                                    <lightning-textarea name="Comments" label="" onfocus={stopPropogation}
                                        onblur={stopPropogation} placeholder="Please add your comments here...."
                                        value={comment} onchange={handleCommentChange}
                                        max-length={approvalData.commentLenth}></lightning-textarea>


                                </div>

                            </lightning-layout-item>
                        </lightning-layout>
                        <lightning-layout>
                            <lightning-layout-item size="4">
                                <div style="padding-top: 2%;">
                                    <button class="SaveButton slds-button slds-button_brand"
                                        style="font-size: 11px;width: 140px;background-color: green;color: white;border-color: black;font-weight: 500;"
                                        data-name="saveDraft" onclick={handleAction} onfocus={stopPropogation}
                                        onblur={stopPropogation}>Save Draft</button>
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>

                    </div>
                    </template>
                </template>




            </div>
        </lightning-layout-item>

    </lightning-layout>
</template>
    <template if:true={approvalData.showApprovalHistory}>
        <lightning-layout>
            <lightning-layout-item size="12">
                <div>
                    <p slot="title" class="required-field" style="font-size: 106%;/* font-style: italic; */color: black;font-weight: bold;padding: 1%;text-align: left;">Approval History</p>
                    <div class="slds-scrollable_y card-div"  style="overflow: hidden;padding:1%;max-height: 80%;padding-top: 3%;">
                    
                        <template for:each={approvalData.statusHistory} for:item="iterObj">   
                            <div key={iterObj.timeStamp} class="slds-m-bottom_small wrapped-content" style="padding-bottom:4%">
                                <template if:true={iterObj.isRequestor}>
                                    <div><span style="font-weight: 700;">Timestamp</span> : <span class="data-div"><lightning-formatted-date-time value={iterObj.timeStamp} year="numeric" month="numeric" day="numeric" hour="2-digit"
                                        minute="2-digit"></lightning-formatted-date-time></span></div>
                                    <div><span style="font-weight: 700;">Requestor</span> : <span class="data-div">{iterObj.requestor}</span></div>
                                    <div><span style="font-weight: 700;">Status</span> : <span class="data-div">{iterObj.status}</span></div>
                                    <div><span style="font-weight: 700;">Remarks</span> : <div class="formatted-text">
                                            {iterObj.remarks}
                                        </div>
                                    </div>
                                     <!-- <span class="data-div">{iterObj.remarks}</span> -->
                                    
                                </template>

                                <div >

                                </div>

                                <template if:false={iterObj.isRequestor}>
                                    <div><span style="font-weight: 700;">Timestamp</span> : <span class="data-div"><lightning-formatted-date-time value={iterObj.timeStamp} year="numeric" month="numeric" day="numeric" hour="2-digit"
                                        minute="2-digit"></lightning-formatted-date-time></span></div>
                                    <div><span style="font-weight: 700;">Approver</span> : <span class="data-div">{iterObj.requestor}</span></div>
                                    <div><span style="font-weight: 700;">Status</span> : <span class="data-div">{iterObj.status}</span></div>
                                    <div><span style="font-weight: 700;">Remarks</span> : <div class="formatted-text">
                                            {iterObj.remarks}
                                        </div>
                                    </div>
                                    
                                </template>
                                
                                <!-- <lightning-tile class="slds-border_top slds-border_bottom slds-border_left slds-border_right slds-p-around_x-small" style="border-color: black;border-radius: 2%;">
                                    <dl class="slds-dl_vertical">
                                        <dt class="slds-dl_ vertical__label">
                                            <p class="slds-wrap" title="Status"  ><b>Status: </b>{iterObj.status}</p>
                                        </dt>
                                        <dt class="slds-dl_ vertical__label">
                                            <p class="slds-wrap" title="Priority"  ><b>Time Stamp:</b> <lightning-formatted-date-time scope="row" class="tableCss" value={iterObj.timeStamp}  year="numeric" month="numeric" day="numeric" hour="2-digit" minute="2-digit"></lightning-formatted-date-time></p>
                                        </dt>
                                        <dt class="slds-dl_ vertical__label">
                                            <p class="slds-wrap" title="Priority"  ><b>Remarks: </b>{iterObj.remarks}</p>
                                        </dt>                                           
                                    </dl>
                                </lightning-tile> -->
                            </div>
                        </template>
                    </div>
                </div>
                
            </lightning-layout-item>
        </lightning-layout>
    </template>
    <template if:true={errorModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container" style="min-width: 80%;">
            
               <header class="slds-modal__header" style="background-color: skyblue; font-weight:500;">
                  <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Please review the following errors</h2>
               </header>
           
               <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <template for:each={errorLst} for:item="listVariable" for:index="index">
                    <div style="color: red;" key={listVariable}>
                        {listVariable}
                    </div>
                  </template>
               </div>
     
               
               <div class="slds-modal__footer" style="background-color: skyblue;border-radius: 0px 0px 5px 5px;text-align: center;min-height: 30px;">
               
                  <button class="slds-button slds-button_brand previous-button" style="width: 140px;background-color: #dc387e;font-weight: 500;" onclick={hideModalBox}>Cancel</button>
               
               </div>
            
            </div>
         </section>
         <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>

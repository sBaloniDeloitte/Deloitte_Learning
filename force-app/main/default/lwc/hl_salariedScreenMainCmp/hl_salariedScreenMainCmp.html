<template>
    <template if:true={spinnerRun}>
        <section role="dialog" tabindex="-1" aria-labelledby="header43" class="slds-modal slds-fade-in-open" style="z-index: 900003;">
            <lightning-spinner></lightning-spinner>
        </section>
    </template>

    <div class="slds-grid slds-wrap slds-scrollable_x sal-scroll-wrapper" style="padding: 0px;">
        <table class="slds-table sal-table1" style="width: 500px; margin-bottom: 15px;">
            <thead style="text-align: left;">
                <tr>
                    <th class="color-theme" style="width: 100px; text-align: left;">Select</th>
                    <th class=" color-theme" style="text-align: left;">Name</th>
                </tr>
            </thead>
            <tbody>
                <template for:each={applicantList} for:item="iter">
                    <tr key={iter.name}>
                        <td>
                            <lightning-input type="checkbox" data-id={iter.appId} checked={iter.isDataCreated} onchange={handleCheckboxChange}></lightning-input>
                        </td>
                        <td>{iter.name}</td>
                    </tr>
                </template>
            </tbody>
        </table>
    
        <template if:true={showTab}>
            <div class="sal-tabset-wrapper">
                <lightning-tabset>
                    <template for:each={tabList} for:item="record" for:index="index">
                        <lightning-tab key={record.name} label={record.name}>
                            <template if:false={showCalculator}>
                            <c-hl_salaried-screen-cmp record-id={recordId} applicant-id={record.appId} parent-id={record.parentRecordId} disable-edit={disableEdit}></c-hl_salaried-screen-cmp>
                            </template>
                            <template if:true={showCalculator}>
                          <c-h-l_salaried-income-calculator
                                record-id={recordId}
                                show-calculator={showCalculator}
                                applicant-id={record.appId}
                                parent-id={record.parentRecordId}
                                disable-edit={disableEdit}
                            ></c-h-l_salaried-income-calculator>
                            </template>
                        </lightning-tab>
                    </template>
                </lightning-tabset>
            </div>
        </template>
    </div>

    <template if:true={showgenericConfirm}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header sal-modal-header">
                    <h2 class="slds-text-heading_medium">Confirmation Screen</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    {confirmMessage}
                </div>
                <footer class="slds-modal__footer slds-text-align_center sal-modal-footer">
                    <button class="btn-negative-action cancel-button slds-button slds-button_brand" style="margin-right: 7px; width: 100px; border:none;" onclick={handleNegative}>No</button>
                    <button class="btn-positive-action save-button slds-button slds-button_brand" style="width: 100px; border:none;" onclick={handlePositive}>Yes</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    
</template>

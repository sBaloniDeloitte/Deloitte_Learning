    <div class="slds-box slds-theme_default progress-container" style="margin-top:1%">
                <div class={getProgressBar} style="overflow: auto;">
                    <template for:each={progressStages} for:item="stage" for:index="index">
                        <div key={stage.key} class="progress-step">

                            <!-- Connector Line -->
                            <template if:true={stage.showLine}>
                                <div class="connector"></div>
                            </template>

                            <!-- Stage Icon -->
                            <div class="icon-wrapper">
                                <template if:true={stage.completed}>
                                    <lightning-icon icon-name="utility:success" size="small"
                                        variant="success" alternative-text="Completed"></lightning-icon>
                                </template>
                                <template if:false={stage.completed}>
                                    <lightning-icon icon-name="utility:error" size="small" variant="error"
                                        alternative-text="Incomplete"></lightning-icon>
                                </template>
                            </div>

                            <!-- Stage Name -->
                            <div class="slds-text-align_center">
                                <p class="stage-name">{stage.label}</p>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
  
      <template if:true={isTranch}>
          <div class="slds-p-vertical_xx-small">
            <template if:true={isTechManager}>
          <lightning-radio-group data-name="validate" name="radioGroup" label="Step 1 : Select Type of Evaluation" options={finaloptions} disabled
            value="Technical Evaluation" onchange={handleChange} message-when-value-missing="type of valuation" required type="radio">
          </lightning-radio-group>
          </template>
          <template if:false={isTechManager}>
            <lightning-radio-group data-name="validate" name="radioGroup" label="Step 1 : Select Type of Evaluation" options={finaloptions}
            value={techRecords} onchange={handleChange} message-when-value-missing="type of valuation" required type="radio">
          </lightning-radio-group>
          </template>
        </div> 
      
      
      <template if:true={isEvaluationSelected}>
        <div class="slds-p-vertical_xx-small">
          <legend class="slds-form-element__legend slds-form-element__label"><abbr class="slds-required" title="required">* </abbr>Step 2 : Related Collateral</legend>
          <template if:true={isTechManager}>
          <lightning-combobox data-name="validate" variant="label-hidden" class="inputfield" name="none" label="Step 1 : Related Collateral"
            value={aplicationcolatteral} placeholder="Select Collateral" options={options1} disabled
            onchange={handleCollateralSelection} required>
          </lightning-combobox>
          </template>
          <template if:false={isTechManager}>
          <lightning-combobox data-name="validate" variant="label-hidden" class="inputfield" name="none" label="Step 1 : Related Collateral"
            value={aplicationcolatteral} placeholder="Select Collateral" options={options1}
            onchange={handleCollateralSelection} required>
          </lightning-combobox>
          </template>
        </div>
      </template>
      
      
        <template lwc:if={recordAllocation}>
            <template if:false={isTechManager}>
            <div class="slds-p-vertical_xx-small">
            <legend class="slds-form-element__legend slds-form-element__label"><abbr class="slds-required" title="required">* </abbr>Step 3 : Technical Type</legend>
            <lightning-combobox data-name="validate" variant="label-hidden" class="inputfield" name="none" label="Step 3 : Technical Type"
                placeholder="Select Technical Type" options={reportOptions}
                onchange={handleTechType} required>
            </lightning-combobox>
            </div>
            </template>
      </template>
      
      <template lwc:if={recordAllocation}>
        <div class="slds-p-vertical_xx-small">

            Add New Document
          </button>
        </div>

      <template lwc:if={openTable}>
    <div class="slds-p-horizontal_medium">
        <!-- Horizontal scroll container -->
        <div class="slds-scrollable_x" style="overflow-x: auto; max-width: 100%;">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered slds-border_left slds-border_right" aria-label="Example table of Opportunities with vertical borders" style="min-width: 900px;">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col" style="text-align: center; background-color: #113451; color: white; font-weight: 500; padding: 10px">
                            <div class="slds-truncate">Sr. No</div>
                        </th>
                        <th scope="col" style="text-align: center; background-color: #113451; color: white; font-weight: 500; padding: 10px">
                            <div class="slds-truncate">Description</div>
                        </th>
                        <th scope="col" style="text-align: center; background-color: #113451; color: white; font-weight: 500; padding: 10px">
                            <div class="slds-truncate">Upload</div>
                        </th>
                        <th scope="col" style="text-align: center; background-color: #113451; color: white; font-weight: 500; padding: 10px">
                            <div class="slds-truncate">Uploaded Files</div>
                        </th>
                        <th scope="col" style="text-align: center; background-color: #113451; color: white; font-weight: 500; padding: 10px">
                            <div class="slds-truncate">Delete</div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={documents} for:item="document" for:index="index">
                        <tr key={document.Id} class="slds-hint-parent">
                            <td>
                                <div class="slds-truncate">{document.srno}</div>
                            </td>
                            <td>
                                <div class="slds-truncate">{document.docName}</div>
                            </td>
                            <td class="uploadFileView">
                                <lightning-file-upload
                                    variant="label-hidden"
                                    name="fileUploader"
                                    accept={acceptedFormats}
                                    data-id={document.docId}
                                    onuploadfinished={handleFileChange}
                                    class="file-upload-input"
                                    data-record-id={document.docId}
                                    disabled={document.isUploadNeeded}
                                    multiple>
                                </lightning-file-upload>
                            </td>
                            <td>
                                <table class="slds-table slds-table_bordered slds-scrollable_x slds-border_right slds-border_left">
                                    <tbody>
                                        <template for:each={document.uploadedFiles} for:item="iterFile">
                                            <tr key={iterFile.contentDocId} style="background: #f2f2f2; border-color: white;">
                                                <td style="border: none;">
                                                    <a href="javascript:void(0);" data-id={iterFile.contentDocId} onclick={handlePreview}>
                                                        {iterFile.fileName}
                                                    </a>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </td>
                            <td>
                                    <template if:false={document.isRequired}>
                                        <lightning-button-icon
                                            data-index={index}
                                            data-id={document.docId}
                                            icon-name="utility:delete"
                                            size="medium"
                                            alternative-text="Delete"
                                            class="slds-m-left_xx-small"
                                            onclick={deleteCheckList}>
                                        </lightning-button-icon>
                                    </template>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</template>

      </template>

      </div>
  
      <div class="slds-border_bottom slds-m-vertical_x-small"></div>

<template lwc:if={openAddDocModal}>
        <c-document-checklist-modal record-id={recordId} application-coll-id={aplicationcolatteral} onclosemodal={closeDocumentModal} onreset={resetDocuments} type="Technical Documents" onhandledocadded={handledoc} ondocumentsadded={handledoc}></c-document-checklist-modal>
    
        </template> 

    <template if:true={showConfirmModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Confirm Cancellation</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>Are you sure you want to cancel?</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="No" onclick={closeConfirmModal}></lightning-button>
                    <lightning-button class="slds-m-left_small" variant="brand" label="Yes" onclick={confirmCloseAction}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

<template if:true={showConfirmDocModal}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <h2 class="slds-text-heading_medium">Confirm Change</h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <p>Are you sure you want to delete the documents before making any changes?</p>
            </div>
            <footer class="slds-modal__footer">
                <lightning-button variant="neutral" label="No" onclick={closeConfirmDocModal}></lightning-button>
                <lightning-button class="slds-m-left_small" variant="brand" label="Yes" onclick={confirmDocDeletion}></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>

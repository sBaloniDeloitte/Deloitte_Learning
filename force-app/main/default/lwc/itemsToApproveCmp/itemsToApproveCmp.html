<template>
    <template if:true={showApprovalTable}>
        <lightning-card>
            <div class="slds-p-around_x-small" style="padding-right: 1%;padding-left: 1%;">
                <div class="slds-page-header__row">
                    <div class="slds-page-header__col-title">
                        <div class="slds-media">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="standard:approval" size="medium" alternative-text="Approval">
                                </lightning-icon>
                            </div>
                            <div class="slds-media__body" style="line-height: 13px;">
                                <span class="slds-page-header__title slds-truncate">Approvals</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!--
                <template if:true={isSales}>
                    <lightning-layout>
                        <lightning-layout-item size="10">
        
                        </lightning-layout-item>
                        
                        <lightning-layout-item size="2">
                            <lightning-combobox label="Approval Type" options={filterOptions} value={approvalType} onchange={handleApprovalChange}
                                class="slds-m-bottom_small"></lightning-combobox>
                        </lightning-layout-item>
                        
                    </lightning-layout>
                </template>

                -->

                <div class="slds-p-around_x-small">
                    <div class="slds-scrollable_x">
                        <div class="slds-table_header-fixed_container slds-scrollable_y slds-is-relative"
                            style="max-height:24rem; padding:0;">
                            <table
                                class=" sortable slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered slds-table_col-bordered slds-border_left slds-border_right"
                                style="border-color: black; margin:0;">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th style="text-align: center; background-color: #5bb6e3; color: black; border-color: black;min-width: 150px;"
                                            scope="col" colspan="1">
                                            Loan Number
                                        </th>
                                        <th style="text-align: center; background-color: #5bb6e3; color: black; border-color: black;min-width: 150px;"
                                            scope="col" colspan="1">
                                            Primary Applicant Name
                                        </th>
                                        <th style="text-align: center; background-color: #5bb6e3; color: black; border-color: black;min-width: 150px;"
                                            scope="col" colspan="1">
                                            Branch Name
                                        </th>
                                        <th style="text-align: center; background-color: #5bb6e3; color: black; border-color: black;min-width: 150px;"
                                            scope="col" colspan="1">
                                            Approval Type
                                        </th>
                                        <th style="text-align: center; background-color: #5bb6e3; color: black; border-color: black;min-width: 150px;"
                                            scope="col" colspan="1">
                                            Requestor Name
                                        </th>
                                        <th style="text-align: center; background-color: #5bb6e3; color: black; border-color: black;min-width: 150px;"
                                            scope="col" colspan="1">
                                            Requestor Comments
                                        </th>
                                        <th style="text-align: center; background-color: #5bb6e3; color: black; border-color: black;min-width: 100px;"
                                            scope="col" colspan="1">
                                            Submitted Date
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={approvalData} for:item="record">
                                        <tr key={record.id}>
                                            <td style="border-color: black">
                                                <div class="slds-truncate" title="name"><a data-id={record.objId}
                                                        onclick={navigateToRecord}>{record.workItemName}</a></div>
                                            </td>
                                            <td style="border-color: black">{record.primaryAppName}</td>
                                            <td style="border-color: black">{record.branchName}</td>
                                            <td style="border-color: black">{record.objName}</td>
                                            <td style="border-color: black">{record.reqName}</td>
                                            <td style="border-color: black">{record.comments}</td>
                                            <td style="border-color: black">
                                                <lightning-formatted-date-time scope="row" class="tableCss"
                                                    value={record.createdDate} year="numeric" month="numeric"
                                                    day="numeric" hour="2-digit" minute="2-digit">
                                                </lightning-formatted-date-time>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>

                    </div>

                </div>

            </div>
        </lightning-card>
    </template>
</template>

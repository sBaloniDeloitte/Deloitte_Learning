<template>
  <!-- Method Selection Dropdown -->
  <div class="slds-m-around_medium combobox-container">
    <lightning-combobox label="Select Method" value={selectedMethod} options={methodOptions}
      onchange={handleMethodChange} class="full-width-combobox">
    </lightning-combobox>
  </div>

  <!-- Manual Entry Form -->
  <template if:true={isManual}>
    <lightning-layout multiple-rows class="layout-border">
      <!-- Left Column: Form Inputs -->
      <lightning-layout-item size="12" medium-device-size="6" padding="around-small">
        <div class="form-container slds-box slds-theme_default custom-border">
          <lightning-combobox value={applicantValue} options={options} onchange={handleApplicantChange}
            class="validate full-width-combobox" label="Select Applicant" placeholder="Select Applicant">
          </lightning-combobox>

          <lightning-tabset>
            <!-- Current Year Tab -->
            <lightning-tab label="CY">
              <lightning-layout multiple-rows>
                <lightning-layout-item size="12" medium-device-size="6" class="slds-p-around_x-small">
                  <lightning-combobox value={yearCY} name="yearCY" options={yearOptions} onchange={handleYearChange} disabled
                    class="validate full-width-combobox" label="Year">
                  </lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item size="12" medium-device-size="6" class="slds-p-around_x-small">
                  <lightning-input type="number" name="incomeAsPerPolicyCY" value={incomeAsPerPolicyCY} label="Business income/profit as per policy" onblur={onBlurInputField}>
                  </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="12" medium-device-size="6" class="slds-p-around_x-small">
                  <lightning-input type="date" name="itrfillingDateCY" value={itrfillingDateCY} label="ITR Filling Date" onblur={onBlurInputField}>
                  </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="12" medium-device-size="6" class="slds-p-around_x-small">
                  <lightning-input type="number" name="ackNumberCY" value={ackNumberCY} label="Acknowledgement Number" onblur={onBlurInputField}>
                  </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="12" class="slds-p-around_x-small">
                  <lightning-combobox value={assMentYearCY} name="assMentYearCY" options={yearOptions} onchange={handleYearChange} class="validate full-width-combobox" label="Assessment Year">
                  </lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item size="12" medium-device-size="6" class="slds-p-around_medium">
                  <lightning-file-upload label="Attach ITR Document" name="fileUploader" accept={acceptedFormats} multiple record-id={recordId} onuploadfinished={handleUploadFinishedCY}>
                  </lightning-file-upload>
                  <template if:true={showDocumentNameCY}>
                    <template for:each={uploadedFileNameCY} for:item="filename">
                      <p key={filename} class="uploaded-filename">{filename}</p>
                    </template>
                  </template>
                </lightning-layout-item>
                <lightning-layout-item size="12" medium-device-size="6" class="slds-p-around_medium">
                  <lightning-input type="text" label="Enter Password" name="userPassword" value={passWord} placeholder="Enter your password" onchange={handlePasswordChange}>
                  </lightning-input>
                </lightning-layout-item>
              </lightning-layout>
              <div class="slds-p-around_x-small button-group">
                <button class="save-button slds-button slds-button_brand" onclick={handleSaveClick}>Save</button>
              </div>
            </lightning-tab>

            <!-- Previous Year Tab -->
            <lightning-tab label="PY">
              <lightning-layout multiple-rows>
                <lightning-layout-item size="12" medium-device-size="6" class="slds-p-around_x-small">
                  <lightning-combobox value={yearPY} options={yearOptions} onchange={handleYearChange} disabled
                    class="validate full-width-combobox" label="Year" name="yearPY">
                  </lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item size="12" medium-device-size="6" class="slds-p-around_x-small">
                  <lightning-input type="number" name="incomeAsPerPolicyPY" value={incomeAsPerPolicyPY} label="Business income/profit as per policy" onblur={onBlurInputFieldPY}>
                  </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="12" medium-device-size="6" class="slds-p-around_x-small">
                  <lightning-input type="date" name="itrfillingDatePY" value={itrfillingDatePY} label="ITR Filling Date" onblur={onBlurInputFieldPY}>
                  </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="12" medium-device-size="6" class="slds-p-around_x-small">
                  <lightning-input type="number" name="ackNumberPY" value={ackNumberPY} label="Acknowledgement Number" onblur={onBlurInputFieldPY}>
                  </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="12" class="slds-p-around_x-small">
                  <lightning-combobox value={assMentYearPY} name="assMentYearPY" options={yearOptions} onchange={handleYearChangePY} class="validate full-width-combobox" label="Assessment Year">
                  </lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item size="12" medium-device-size="6" class="slds-p-around_medium">
                  <lightning-file-upload label="Attach ITR Document" name="fileUploader" accept={acceptedFormats} multiple record-id={recordId} onuploadfinished={handleUploadFinishedPY}>
                  </lightning-file-upload>
                  <template if:true={showDocumentNamePY}>
                    <template for:each={uploadedFileNamePY} for:item="filename">
                      <p key={filename} class="uploaded-filename">{filename}</p>
                    </template>
                  </template>
                </lightning-layout-item>
                <lightning-layout-item size="12" medium-device-size="6" class="slds-p-around_medium">
                  <lightning-input type="text" label="Enter Password" name="userPassword" value={passWordPY} placeholder="Enter your password" onchange={handlePasswordChangePY}>
                  </lightning-input>
                </lightning-layout-item>
              </lightning-layout>
              <div class="slds-p-around_x-small button-group">
                <button class="save-button slds-button slds-button_brand" onclick={handleSaveClickPY}>Save</button>
              </div>
            </lightning-tab>
          </lightning-tabset>
        </div>
      </lightning-layout-item>

      <!-- Right Column: Document Table -->
      <lightning-layout-item size="12" medium-device-size="6" padding="around-small">
        <template if:true={showRecords}>
          <div class="table-container">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
              <thead>
                <tr class="sticky">
                  <th>Applicant Name</th>
                  <th>File Name</th>
                  <th>Year</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={documentList} for:item="doc">
                  <tr key={doc.id}>
                    <td>{doc.applicantName}</td>
                    <td>{doc.name}</td>
                    <td>{doc.year}</td>
                    <td>
                      <lightning-icon icon-name="utility:preview" size="small" variant="brand" title="View Document" data-id={doc.contentId} onclick={handleView} class="green-utility-icon"></lightning-icon>
                      <template if:true={doc.showDelete}>
                        <lightning-icon icon-name="utility:delete" size="small" variant="brand" title="Delete Document" data-id={doc.contentId} data-doc={doc.id} onclick={handleDelete} class="red-utility-icon"></lightning-icon>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </lightning-layout-item>
    </lightning-layout>
  </template>
  <div style="display: flex; justify-content: flex-end; margin-top: 2%;">
                        <button class="SaveButton slds-button slds-button_brand"
                            style="font-size: 11px; width: 140px; background-color:#9bbf56; color: white; border-color: #9bbf56; font-weight: 500;"
                            onclick={handleNavigateNext}>Next</button>
                    </div>

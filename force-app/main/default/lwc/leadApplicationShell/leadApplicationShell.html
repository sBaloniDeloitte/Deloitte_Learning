        <button class="btn-convert btn-convert-banner" onclick={handleCustomNotes}>

        <button class="btn-convert btn-convert-banner" onclick={handleActivityTimeline}>

            onclick={closeCustomNotes}>
            ✕
        </button>
    </div>
        <div class="slds-modal__content">
            <c-custom-notes
                record-id={recordId}>
            </c-custom-notes>
        </div>
    </div>
    </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>


    <!-- Activity Timeline Popup -->
    <template if:true={showActivityTimeline}>

    <div class="slds-modal__container custom-modal">

            Activity Timeline class="slds-modal__header modal-header"
        </h2> -->

            class="close-btn"
            onclick={closeActivityTimeline}>
            ✕

        <div class="slds-modal__content">

                record-id={recordId}>
            </c-activity-time-Line>
        </div>
    </div>
    </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Loading Overlay -->
    <template if:true={isLoading}>
        <div class="loading-overlay">
            <span class="spinner-small"></span>
            <span class="loading-text">Loading lead data…</span>

                    <!-- ═══════════════════════════════════════

                    ═══════════════════════════════════════ -->

                            <div class="welcome-illustration">🎓</div>
                            <h2 class="welcome-title">Lead Application Details</h2>
                            <p class="welcome-desc">
                                Select a section from the left panel to view and update the lead's information.
                                All previously entered data is pre-filled and ready to edit.
                            </p>
                            <div class="welcome-steps">
                                <div class="welcome-step">

                                    <span class="welcome-step-label">Basic Info</span>
                                </div>
                                <div class="welcome-step-arrow">→</div>
                                <div class="welcome-step">

                                </div>
                                <div class="welcome-step-arrow">→</div>
                                <div class="welcome-step">
                                    <span class="welcome-step-icon">💰</span>
                                    <span class="welcome-step-label">Funding</span>
                                </div>
                                <div class="welcome-step-arrow">→</div>
                                <div class="welcome-step">
                                    <span class="welcome-step-icon">👥</span>
                                    <span class="welcome-step-label">Co-Applicant</span>
                                </div>
                            </div>
                            -->

                                <button class="btn-primary welcome-start-btn" data-section="basic" onclick={handleNavClick}>
                                    View Application →
                                </button>
                                <button class="btn-convert welcome-start-btn" onclick={handleOpenConvertModal}>
                                    🔄 Convert to Opportunity
                                </button>
                            </div>
                        </div>

                    <!-- ═══════════════════════════════════════
                         CONVERT TO OPPORTUNITY MODAL
                    ═══════════════════════════════════════ -->
                    <template if:true={showConvertModal}>
                        <div class="modal-backdrop" onclick={handleCloseConvertModal}>
                            <div class="modal-box" onclick={stopPropagation}>

                                <!-- Modal Header -->
                                <div class="modal-header">
                                    <span class="modal-header-icon">🔄</span>
                                    <div>
                                        <h2 class="modal-title">Convert to Opportunity</h2>
                                        <p class="modal-subtitle">This will create an Account, Contact, and Opportunity from this Lead.</p>
                                    </div>
                                    <button class="modal-close-btn" onclick={handleCloseConvertModal} disabled={isConverting}>✕</button>
                                </div>

                                <!-- Success State -->
                                <template if:true={convertSuccess}>
                                    <div class="modal-body">
                                        <div class="convert-success-block">
                                            <div class="convert-success-icon">✅</div>
                                            <h3 class="convert-success-title">Lead Converted Successfully!</h3>
                                            <p class="convert-success-desc">
                                                An Account, Contact, and Opportunity have been created.
                                            </p>
                                            <div class="convert-result-card">
                                                <span class="convert-result-label">Opportunity</span>
                                                <span class="convert-result-value">{convertedOppName}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button class="btn-secondary" onclick={handleCloseConvertModal}>Close</button>
                                        <button class="btn-primary" onclick={handleNavigateToOpportunity}>
                                            View Opportunity →
                                        </button>
                                    </div>
                                </template>

                                <!-- Confirmation State -->
                                <template if:false={convertSuccess}>

                                                <span class="convert-info-icon">🏢</span>
                                                <div>
                                                    <p class="convert-info-label">Account</p>
                                                    <p class="convert-info-value">New Account will be created</p>
                                                </div>
                                            </div>
                                            <div class="convert-info-item">
                                                <span class="convert-info-icon">👤</span>
                                                <div>
                                                    <p class="convert-info-label">Contact</p>
                                                    <p class="convert-info-value">New Contact will be created</p>
                                                </div>
                                            </div>
                                            <div class="convert-info-item">
                                                <span class="convert-info-icon">💼</span>
                                                <div>
                                                    <p class="convert-info-label">Opportunity</p>
                                                    <p class="convert-info-value">New Education Loan Opportunity will be created</p>
                                                </div>
                                            </div>
                                            <div class="convert-info-item convert-info-warn">
                                                <span class="convert-info-icon">⚠️</span>
                                                <div>
                                                    <p class="convert-info-label">Lead Status</p>
                                                    <p class="convert-info-value">Lead will be marked as Converted and closed</p>
                                                </div>
                                            </div>
                                        </div>
                                        <template if:true={convertError}>
                                            <div class="global-error-banner">🚨 {convertError}</div>
                                        </template>
                                    </div>
                                    <div class="modal-footer">
                                        <button class="btn-secondary" onclick={handleCloseConvertModal} disabled={isConverting}>Cancel</button>
                                        <button class="btn-convert btn-convert-lg" onclick={handleConfirmConvert} disabled={isConverting}>

                                                <span class="spinner-small spinner-white"></span> Converting…
                                            </template>
                                            <template if:false={isConverting}>
                                                🔄 Confirm Conversion
                                            </template>
                                        </button>
                                    </div>
                                </template>

                            </div>
                        </div>
                    </template>

                    <!-- ═══════════════════════════════════════
                         SECTION 1 — Basic Information
                    ═══════════════════════════════════════ -->

                                    <div class="save-success-banner">✅ {saveSuccess}</div>
                                </template>

                                <div class="form-grid">

                                    <div class="form-group">
                                        <label class="form-label" for="s1-firstName">
                                            First Name <span class="required-star">*</span>
                                        </label>
                                        <div class="input-wrapper">
                                            <span class="input-icon">👤</span>
                                            <input type="text" id="s1-firstName" class="form-input"
                                                placeholder="Enter first name"
                                                data-field="firstName" value={formData.firstName}
                                                oninput={handleInput} />
                                        </div>
                                        <template if:true={errors.firstName}>
                                            <span class="error-msg">⚠ {errors.firstName}</span>
                                        </template>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label" for="s1-lastName">
                                            Last Name <span class="required-star">*</span>
                                        </label>
                                        <div class="input-wrapper">
                                            <span class="input-icon">👤</span>
                                            <input type="text" id="s1-lastName" class="form-input"
                                                placeholder="Enter last name"
                                                data-field="lastName" value={formData.lastName}
                                                oninput={handleInput} />
                                        </div>
                                        <template if:true={errors.lastName}>
                                            <span class="error-msg">⚠ {errors.lastName}</span>
                                        </template>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label" for="s1-mobile">
                                            Mobile Number <span class="required-star">*</span>
                                        </label>
                                        <div class="input-wrapper">
                                            <span class="input-icon">📱</span>
                                            <input type="tel" id="s1-mobile" class="form-input"

                                                data-field="mobileNumber" value={formData.mobileNumber}

                                            Pincode <span class="required-star">*</span>
                                        </label>
                                        <div class="input-wrapper">
                                            <span class="input-icon">📍</span>
                                            <input type="text" id="s1-pincode" class="form-input"
                                                placeholder="6-digit pincode" maxlength="6"
                                                data-field="pincode" value={formData.pincode}
                                                oninput={handleInput} />

                                        <template if:true={errors.pincode}>
                                            <span class="error-msg">⚠ {errors.pincode}</span>

                                            <span class="input-icon">✉️</span>
                                            <input type="email" id="s1-email" class="form-input"
                                                placeholder="Enter email address"
                                                data-field="email" value={formData.email}
                                                oninput={handleInput} />
                                        </div>
                                        <template if:true={errors.email}>
                                            <span class="error-msg">⚠ {errors.email}</span>
                                        </template>
                                    </div>

                                </div>

                                <template if:true={globalError}>
                                    <div class="global-error-banner">🚨 {globalError}</div>
                                </template>
                            </div>

                            <div class="step-footer">
                                <span></span>
                                <button class="btn-primary" onclick={updateBasic} disabled={isSaving}>
                                    <template if:true={isSaving}>
                                        <span class="spinner-small spinner-white"></span> Saving…
                                    </template>
                                    <template if:false={isSaving}>💾 Update Basic Info</template>
                                </button>
                            </div>

                        </div>
                    </template>

                                    <p class="section-header-desc">View and update the applicant's educational background and study plans.</p>
                                </div>

                                <div class="progress-track">
                                    <div class="progress-fill" style={progressStyle}></div>

                                <div class="step-indicators">

                                    <div class={step5Class}><span class="step-dot">🏠</span><span class="step-label">Collateral</span></div>

                                <template if:true={saveSuccess}>

                                                <option value="Graduate">Graduate</option>
                                                <option value="Post Graduate">Post Graduate</option>
                                                <option value="Doctorate">Doctorate</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label" for="s2-country">
                                          Country for Study <span class="required-star">*</span>
                                        </label>
                                        <div class="input-wrapper">
                                            <span class="input-icon">🌍</span>
                                            <input type="text" id="s2-country" class="form-input"
                                                placeholder="e.g. USA, UK, Canada"
                                                data-field="plannedCountryForStudy"
                                                value={formData.plannedCountryForStudy}
                                                oninput={handleInput} />
                                        </div>
                                        <template if:true={errors.plannedCountryForStudy}>
                                            <span class="error-msg">⚠ {errors.plannedCountryForStudy}</span>
                                        </template>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label" for="s2-course">
                                            Planned Course for Study <span class="required-star">*</span>
                                        </label>
                                        <div class="input-wrapper">
                                            <span class="input-icon">📖</span>
                                            <input type="text" id="s2-course" class="form-input"
                                                placeholder="e.g. MBA, MS Computer Science"
                                                data-field="plannedCourseForStudy"
                                                value={formData.plannedCourseForStudy}
                                                oninput={handleInput} />
                                        </div>
                                        <template if:true={errors.plannedCourseForStudy}>
                                            <span class="error-msg">⚠ {errors.plannedCourseForStudy}</span>
                                        </template>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label" for="s2-startDate">
                                            Course Start Date <span class="required-star">*</span>
                                        </label>
                                        <div class="input-wrapper">
                                            <span class="input-icon">📅</span>
                                            <input type="date" id="s2-startDate" class="form-input"
                                                data-field="courseStartDate"
                                                value={formData.courseStartDate}
                                                onchange={handleSelectChange} />

                                        <template if:true={errors.courseStartDate}>
                                            <span class="error-msg">⚠ {errors.courseStartDate}</span>
                                        </template>

                                            <span class="input-icon">📋</span>
                                            <select id="s2-admissionStatus" class="form-select"
                                                data-field="admissionStatus"

                                        </template>

                                </template>
                            </div>

                            <div class="step-footer">
                                <button class="btn-secondary" data-section="basic" onclick={handleNavClick}>← Basic Info</button>
                                <button class="btn-primary" onclick={updateEducation} disabled={isSaving}>
                                    <template if:true={isSaving}>
                                        <span class="spinner-small spinner-white"></span> Saving…
                                    </template>
                                    <template if:false={isSaving}>💾 Update Education</template>
                                </button>
                            </div>

                        </div>
                    </template>
                    <!-- END SECTION 2 -->

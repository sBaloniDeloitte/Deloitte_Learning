<template>

    <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            
            <header class="slds-modal__header header-section">
                <div class="slds-text-align_center">
                    <h2 slot="title" class="slds-text-heading_medium slds-hyphenate header-title">Existing lead details</h2>
                </div>
            </header>
            
            <div class="slds-modal__content slds-p-around_medium" id="popup-body">
                <template if:true={teleSales}>
                    <template if:true={userMatched}>
                        <p class="dialog-message" style="font-size: 12px;">{dialogMessage} <br/>
                            <span if:true={userMatched} style="color:hsl(81, 45%, 54%);cursor: pointer;font: size 12px;" onclick={navigateToActiveLead}>{lead}</span>
                            <span if:true={userMatched} style="font-size: 12px;">{message}</span>
                        </p>
                    </template>
                   
                    <template if:false={userMatched}>
                        <p class="dialog-message" style="font-size: 12px;">{dialogMessageNonDuplicateUser}
                            <span if:true={userMatched}>{messageNonDuplicateUser}</span>
                            <span if:true={userMatched} style="color: hsl(81, 45%, 54%);cursor: pointer;font-size: 12px" onclick={navigateToActiveLead}>{lead}</span>
                            <span if:true={userMatched} style="font-size: 12px">{line}</span>
                        </p>
                    </template>
                </template>
            </div>

            <footer class="footer-section">
                <template if:false ={showButtons}><!--change by Kunal Bisht for SFHL-980-->
                    <div class="slds-align_absolute-center button-container">
                        <button class="slds-button slds-button_brand cancel-button" onclick={handleYes}>Close</button>
                        <template if:true={userMatched}>
                            <button class="slds-button slds-button_brand continue-button" onclick={navigateToActiveLead}>Open Lead</button>
                        </template>
                    </div>
                </template>
                <template if:true ={showButtons}><!--change by Kunal Bisht for SFHL-980-->
                    <div class="slds-align_absolute-center button-container">
                        <!-- <button class="slds-button slds-button_brand cancel-button" onclick={abandonLead}>Abandon Lead</button> -->
                        <button class="slds-button slds-button_brand continue-button" onclick={sendApproval} style="text-wrap: auto;">Send For City Head Approval</button>
                        <button class="slds-button slds-button_brand continue-button" onclick={navigateToActiveLead}>Open Lead</button>
                    </div>
                </template>
            </footer>
        </div>
    </section>

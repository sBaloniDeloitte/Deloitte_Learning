                                    filter-criteria="RecordType.Name=Partner;Partner_Type__c=Connector;Account.Vertical1__c INCLUDES ('AHL')"
                                    object-name="Account" search-fields="['Name', 'Vendor_Code__c']"
                                    return-fields="['Id', 'Name', 'Vendor_Code__c']" disabled={disableDsaField}
                                    onlookupselected={handleSelectDsaUser} onlookupdeselected={handleDeleteDsaUser}
                                    required="true"></c-search-lookup>

                                    </template>
                            </template>
                    </template>
                    <div if:true={showelig} class="slds-align_absolute-center button-container">
                        <button class="slds-button slds-button_brand previous-button" onclick={hideCancelrecord}>Previous</button>
                        <template if:true={shownext}>
                        
                            <button class="slds-button slds-button_brand save-button" onclick={handleconversion}>Convert to Loan</button>
                        
                        </template>
                        
                    </div>
                    <div if:false={showelig} class="slds-align_absolute-center button-container"
                        style="padding-top: 1rem;">
                        <button class="slds-button slds-button_brand previous-button" onclick={hideCancelrecord}>Previous</button>
                        <button class="slds-button slds-button_brand disabled-button" disabled>{checkEligibilityButton}</button>
                    </div>
                </template>

                <template if:true={fillfourthinformation}>
                    <!-- <template if:false={addDocuments}> -->
                    <!-- <div if:false={docUploaded} class="slds-box slds-box_x-small slds-theme_default slds-align_absolute-center empty-message-box">
                        <p class="empty-message-text">
                            No documents added yet. To add a document, kindly click on the add document button below.
                        </p>
                    </div> -->
                    <template if:true={visibilerecord}>
                        <div style="text-align: center;" class="slds-m-bottom_medium">
                            <b>Documents</b>
                        </div>
                        <c-document-details-screen record-id={recordId} process-name="Lead"></c-document-details-screen>
                    </template>
                    <template if:false={visibilerecord}>
                        <div style="text-align: center;" class="slds-m-bottom_medium">
                            <b>Documents</b>
                        </div>
                        <c-document-details-screen record-id={newLeadId} process-name="Lead">
                        </c-document-details-screen>
                    </template>

                    <div if:false={closed} class="slds-align_absolute-center button-container">
                        <c-upload-view-delete-document show-add-btn="true" show-add-big-btn="true"
                            doc-link-recod-id={leadId} doc-required-for="Lead" show-retake="true" process-object="Lead">
                        </c-upload-view-delete-document>
                    </div>
                    <div class="slds-align_absolute-center button-container">
                        <button class="slds-button slds-button_brand previous-button" onclick={hideCancelrecord}>Previous</button>
                        <button if:false={reqimagesUploaded} class="slds-button slds-button_brand disabled-button">{buttonval}</button>
                        <button if:true={reqimagesUploaded} class="slds-button slds-button_brand save-button" onclick={handleSaverecord}>{buttonval}</button>
                    </div>
                    <!-- </template> -->
                </template>

                <template if:true={fillthirdinformation}>
                    <div if:false={converted}>
                        <!--<div if:true={qualified} class="message">
                            This lead is qualified. Please continue.
                        </div>-->
                        <div if:true={qualified}>
                            <template if:true={dsa}>
                                <c-record-assignment record-id={recordId} process-name="Assign Lead"></c-record-assignment>
                            </template>
                             <div if:true={showLoanAmtMessage} style="text-align: center; margin: 0px 0px 15px 0px; color: red;">
                                Note:The loan amount is less than 5 lakhs.
                            </div>
                            <c-sales-otp-consent lead-id={recordId} parent-screen="Lead Screen" onsendstatus={handleStatusChange} isdisable={telesales}></c-sales-otp-consent>
                        </div>
                        <div if:false={qualified} class="message">
                            This lead is not qualified.
                        </div>
                    </div>
                    <div if:true={converted} class="message">
                        This lead is converted into Loan.
                    </div>
                    <div if:true={qualified} class="slds-align_absolute-center button-container">
                        <button style="margin-top: 50px;" class="slds-button slds-button_brand previous-button" onclick={hideCancelrecord}>Previous</button>
                        <button lwc:if={showCreateLoanButton} style="margin-top: 50px;" class="slds-button slds-button_brand disabled-button" disabled>Continue</button>
                        <button lwc:else style="margin-top: 50px;" class="slds-button slds-button_brand save-button" onclick={handleSaverecord} disabled={showCreateLoanButton} >Continue</button>
                        
                    </div>
                    <div if:false={qualified} class="slds-align_absolute-center button-container">
                        <button class="slds-button slds-button_brand previous-button" onclick={hideCancelrecord}>Previous</button>
                    </div>
                </template>
                <template if:true={fillfifthinformation}>
                    <div class="message">
                        This lead is not eligible.
                    </div>
                    <div class="slds-align_absolute-center button-container">
                        <button class="slds-button slds-button_brand previous-button" onclick={hideCancelrecord}>Previous</button>
                    </div>
                </template>
                <template if:true={fillseventhInformations}>
                    <div class="message">
                        {closedReason}
                    </div>
                </template>
                <div if:true={shownext}>
                    <div if:true={canClose}>
                        <lightning-layout multiple-rows>
                            <!-- First Row with Icons side by side -->
                            <lightning-layout-item size="3" class="slds-align_absolute-center">
                                <lightning-icon icon-name="standard:home" size="medium" alternative-text="home"
                                    class="close-lead-icon" style="fill: #dc387e; cursor: pointer;"
                                    onclick={redirectorclose}>
                                </lightning-icon>
                            </lightning-layout-item>
                            <lightning-layout-item size="2" class="slds-align_absolute-center">
                                <!-- This item is intentionally left blank for spacing -->
                            </lightning-layout-item>
                            <lightning-layout-item size="2" class="slds-align_absolute-center">
                                <template if:false={responsive}>
                                    <template if:false={disableLeadTypeField}>
                                        <lightning-icon icon-name="utility:dislike"
                                            style="cursor: pointer;" size="large" alternative-text="dislike" class="my-icon"
                                            onclick={handleresponsive}></lightning-icon>
                                    </template>
                                    <template if:true={disableLeadTypeField}>
                                        <lightning-icon icon-name="utility:dislike"
                                            style="cursor: not-allowed; opacity: 0.4;" size="large" alternative-text="dislike" class="my-icon">
                                        </lightning-icon>
                                    </template>
                                </template>
                                <template if:true={showHot}>
                                    <template if:false={disableLeadTypeField}>
                                        <lightning-icon icon-name="utility:like" style="cursor: pointer;"
                                            size="large" alternative-text="like" class="my-icon2" onclick={handlehotwarm}>
                                        </lightning-icon>
                                    </template>
                                    <template if:true={disableLeadTypeField}>
                                        <lightning-icon icon-name="utility:like" style="cursor: not-allowed; opacity: 0.4;"
                                            size="large" alternative-text="like" class="my-icon2">
                                        </lightning-icon>
                                    </template>
                                </template>
                            </lightning-layout-item>
                            <lightning-layout-item size="2" class="slds-align_absolute-center">
                                <!-- This item is intentionally left blank for spacing -->
                            </lightning-layout-item>
                            <lightning-layout-item size="3" class="slds-align_absolute-center">
                                <template if:false={disableLeadTypeField}>
                                    <lightning-icon icon-name="action:close" size="x-small"
                                        alternative-text="Close Lead Icon" class="close-lead-icon"
                                        style="fill: #dc387e; cursor: pointer;" onclick={closelead}></lightning-icon>
                                </template>
                                <template if:true={disableLeadTypeField}>
                                    <lightning-icon icon-name="action:close" size="x-small"
                                        alternative-text="Close Lead Icon" class="close-lead-icon"
                                        style="fill: #dc387e; cursor: not-allowed; opacity: 0.4;">
                                    </lightning-icon>
                                </template>
                            </lightning-layout-item>
                        </lightning-layout>
                        <lightning-layout multiple-rows>
                            <!-- Second Row with Text Labels below each Icon -->
                            <lightning-layout-item size="3"  class="slds-align_absolute-center ">
                                <p onclick={redirectorclose}>Home</p>
                            </lightning-layout-item>
                            <lightning-layout-item size="2" class="slds-align_absolute-center">
                                <!-- This item is intentionally left blank for spacing -->
                            </lightning-layout-item>
                            <lightning-layout-item size="2" class="slds-align_absolute-center">
                                <p if:false={responsive}>Cold</p>
                                <p if:true={showHot}>Hot</p>
                            </lightning-layout-item>
                            <lightning-layout-item size="2" class="slds-align_absolute-center">
                                <!-- This item is intentionally left blank for spacing -->
                            </lightning-layout-item>
                            <lightning-layout-item size="3" class="slds-align_absolute-center">
                                <template if:false={disableLeadTypeField}>
                                    <p onclick={closelead}>Discard Lead</p>
                                </template>
                                <template if:true={disableLeadTypeField}>
                                    <p style="cursor: not-allowed; opacity: 0.4;">Discard Lead</p>
                                </template>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                    <div if:false={canClose} style="margin-top: 10px;">
                        <div class="homepage-link slds-align_absolute-center">
                            <lightning-icon icon-name="standard:home" size="medium" alternative-text="Close Lead Icon"
                                class="close-lead-icon" style="fill: #dc387e; cursor: pointer;"
                                onclick={redirectorclose}>
                            </lightning-icon>
                        </div>
                        <div class="slds-align_absolute-center">
                            <p onclick={redirectorclose}>Home</p>
                        </div>
                    </div>
                </div>
            </div>
            <footer class="footer-section">
            </footer>
        </template>
    </div>
    <template if:true={callTopUpCmp}>
        <c-sales-loan-login-top-up-flow-cmp record-id={recordId} from-lead="true" onpassleaddetails={handleStampLeadDetails} onresetproduct={handleResetProduct} onresultfromflexi={handleReceiveResultFlexi}></c-sales-loan-login-top-up-flow-cmp>
    </template>
    </div>
</template>

   <template if:true={modalVisibility}>
      <section role="dialog" tabindex="-1" aria-modal="true" aria-label="This is a confirmation modal for step loan record deletion"
         class="slds-modal slds-fade-in-open">
         <div class="slds-modal__container">
            <header class="slds-modal__header header-section">
               <div class="slds-text-align_center">
                  <h2 slot="title" class="header-title slds-text-heading_medium slds-hyphenate">Confirmation Screen</h2>
               </div>
            </header>
            <div class="slds-modal__content slds-p-around_medium slds-modal__content_headless textAlignment">
               Are you sure you want to delete the Step Loan?
            </div>
            <footer class="slds-modal__footer footer-section">
               <div class="slds-align_absolute-center">
                  <button class="cancel-button slds-button slds-button_brand" onclick={closeModal} disabled={isDisableEdit}>No</button>
                  <button class="save-button slds-button slds-button_brand" onclick={confirmDelete} disabled ={isDisableEdit}>Yes</button>
               </div>
            </footer>
         </div>
      </section>
   </template>
   <template if:true={stepLoanUncheckModal}>
      <section role="dialog" tabindex="-1" aria-modal="true" aria-label="This is a confirmation modal for step loan record deletion"
         class="slds-modal slds-fade-in-open">
         <div class="slds-modal__container">
            <header class="slds-modal__header header-section">
               <div class="slds-text-align_center">
                  <h2 slot="title" class="header-title slds-text-heading_medium slds-hyphenate">Confirmation Screen</h2>
               </div>
            </header>
            <div class="slds-modal__content slds-p-around_medium slds-modal__content_headless textAlignment">
               Are you sure you want to delete all Step Loans?
            </div>
            <footer class="slds-modal__footer footer-section">
               <div class="slds-align_absolute-center">
                  <button class="cancel-button slds-button slds-button_brand" onclick={closeStepLoanAllDeleteModal} disabled={isDisableEdit}>No</button>
                  <button class="save-button slds-button slds-button_brand" onclick={confirmAllDelete} disabled={isDisableEdit}>Yes</button>
               </div>
            </footer>
         </div>
      </section>
   </template>

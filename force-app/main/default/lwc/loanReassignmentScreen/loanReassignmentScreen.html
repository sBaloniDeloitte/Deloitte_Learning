<template>
    <template if:true={isModalOpen}>
        <template if:false={showConfirmScreen}>
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class={cssContainer}>
                    <header class="slds-modal__header header-section">
                        <button class="slds-button slds-button_icon reassign-close-btn" title="Close"
                                aria-label="Close" onclick={closeModel}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="x-small" variant="inverse"></lightning-icon>
                        </button>
                        <div class="slds-text-align_center">
                            <h2 slot="title" class="slds-text-heading_medium slds-hyphenate header-title">{headerTitle}</h2>
                        </div>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id">
                        <template if:true={showInlineError}>
                            <div class="inline-error-panel">
                                <lightning-icon icon-name="utility:error" alternative-text="Error" variant="inverse" size="medium" class="inline-error-icon"></lightning-icon>
                                <p class="inline-error-title">Error</p>
                                <p class="inline-error-message">{inlineErrorMessage}</p>
                            </div>
                        </template>
                        <template if:false={showInlineError}>
                        <template if:true = {showUnauthorisedMessage}>
                            {message}

                        </template>
                        <!-- Current Assignee -->
                        <!-- <div class="slds-form-element__label" style="text-align: right;font-weight: 700;">
                            Current Assignee
                        </div>
                        <lightning-input type="text" style="margin-top: -2%;" variant="standard" label="" value={currentAssignee} disabled></lightning-input> -->
                        
                        <!-- Search and Select New Assignee -->
                        <template if:false = {showUnauthorisedMessage}>
                            <template if:true={showOptions}>
                                <lightning-input
                                    type="search"
                                    label="Search Assignee"
                                    placeholder="Type to search..."
                                    onchange={handleSearch}>
                                </lightning-input>
                            </template>                            
                            <template if:true={showOPS}>
                                <lightning-combobox label="Select Type" value={selectedOPSType}
                                    options={OPSTypeOptions} onchange={handleOPSTypeChange}>
                                </lightning-combobox>
                            </template>
                            <template if:true={showOptions}>
                                <lightning-radio-group name="radioGroup3" label="Select New Assignee" options={assigneeoptions}
                                    value={newAssignee} onchange={handleAssigneeChange} message-when-value-missing="Please select assignee" required type="radio">
                                </lightning-radio-group>
                            </template>                            
                        </template>
                        </template>
                    </div>
                    <footer class="footer-section">
                        <div class="slds-align_absolute-center button-container">
                            <button class="slds-button slds-button_brand close-button previous-style-btn" onclick={closeModel}>Cancel</button>
                            <template if:false={showUnauthorisedMessage}>
                            <button class="slds-button slds-button_brand save-button start-app-style-btn" onclick={reassignRecord}>{buttonLabel}</button>
                            </template>
                        </div>
                    </footer>
                </div>
            </section>
            
        </template>
        <template if:true={showConfirmScreen}>
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class={cssContainer}>
                    <header class="slds-modal__header header-section">
                        <div class="slds-text-align_center">
                            <h2 slot="title" class="slds-text-heading_medium slds-hyphenate header-title">Confirmation Screen</h2>
                        </div>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium" id="confirm-body">
                        <div style="padding: 10px; text-align: center;">
                            Are you sure you want to proceed with the re-assignment?
                        </div>
                    </div>
                    <footer class="footer-section">
                        <div class="slds-align_absolute-center button-container">
                            <button class="slds-button slds-button_brand previous-button" onclick={handleNoPerm}>No</button>
                            <button class="slds-button slds-button_brand continue-button" onclick={handleYesPerm}>Yes</button>
                        </div>
                    </footer>
                </div>
            </section>
        </template>
    </template>
</template>

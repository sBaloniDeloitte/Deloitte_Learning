<template>
    <span class="styleContainer"></span>
    <!-- Spinner -->
    <template if:true={isLoading}>
        <div class="spinner-overlay">
            <lightning-spinner alternative-text="Saving..." size="medium"></lightning-spinner>
        </div>
    </template>

    <div class="slds-grid slds-wrap">
        <!-- LEFT SIDE: Login Fee + Payment Section -->
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-around_small">
            <template if:true={hitWhatIf}>
                    <button class="save-button slds-button slds-button_brand slds-float_left"
                    style="border:none" onclick={refreshAPI}>Fetch Login Fee</button>
                </template>
                <template if:false={hitWhatIf}>
            <div class="slds-box slds-theme_default custom-border">
                <fieldset class="slds-m-top_medium">
                    <legend class="slds-text-title_bold slds-m-bottom_small">Login Fee Details</legend>

                    <!-- Login Fee Fields -->
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                            <lightning-input 
                                label="Login fee to be collected" 
                                value={loginFeeToBeCollected} 
                                disabled 
                                required>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                            <lightning-input 
                                label="Actual fee collected" 
                                value={loginFeeCollected} 
                                onchange={handleLoginFeeCollectedChange} 
                                onblur={handleLoginFeeCollectedBlur}
                              disabled={disableData}
                                required>
                            </lightning-input>
                        </div>
                    </div>
<template if:true={showPaymentDetails}>
                    <!-- Payment Details -->
                   
                        <legend class="slds-text-title_bold slds-m-bottom_small" style="margin-top: 1.5%;">Payment Details</legend>

                        <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <lightning-input 
                                    label="Payment Mode" 
                                    value="Online" 
                                   
                                   disabled={disableData}
                                    required>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <lightning-combobox  
                                    options={receiptOptions} 
                                    class="validate" 
                                    label="Sub Receipt Mode" 
                                     disabled={disableData}
                                    value={subReceiptMode}
                                    onchange={handleSubReceiptChange}
                                        
                                    required>
                                </lightning-combobox>
                            </div>
                         <!--   <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <lightning-combobox 
                                    value={paymentValue} 
                                    options={options} 
                                    onchange={handlePaymentStatusChange}
                                    class="validate" 
                                    label="Payment Status" 
                                    required>
                                </lightning-combobox>
                            </div>-->
                            <template if:true={showReceiptFields}>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <lightning-input 
                                    type="text" 
                                    label="Receipt No" 
                                    class="validate" 
                                    value={receiptValue} 
                                     disabled={disableData}
                                    onchange={handleReceiptNoChange}
                                   
                                    required>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <lightning-input 
                                    type="text" 
                                    label="Transaction Reference" 
                                    class="validate" 
                                    value={transactionRefNoValue} 
                                disabled={disableData}
                                    onchange={handleTransactionReferenceNoChange}
                                   
                                    required>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <lightning-file-upload 
                                    label="Upload Receipt"
                                    name="fileUploader" 
                                    accept={acceptedFormats} 
                                    multiple="false"
                                    record-id={recordId} 
                                    onuploadfinished={handleUploadFinished}
                                    disabled={isDisable}
                                    required>
                                </lightning-file-upload>

                                <!-- Uploaded file names -->
                                <template if:true={showDocumentName}>
                                    <template for:each={uploadedFileName} for:item="filename">
                                        <p key={filename} style="font-weight: 500;">
                                            {filename}
                                        </p>
                                    </template>
                                </template>
                            </div>
                            </template>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-around_small">
                                <lightning-input 
                                    type="text" 
                                    label="Remarks" 
                                    class="validate"
                                    disabled={disableData}
                                    onchange={handleRemarksChange}
                                    value = {Remarks}
                                    required
                                    >
                                    
                                </lightning-input>
                            </div>
                        </div>

                        <!-- Save / Retry Buttons -->
                        <template if:true={showSaveButton}>
                            <div class="slds-p-top_medium" style="text-align: right;">
                                <button class="save-button slds-button slds-button_brand" onclick={handleSave} disabled={disableSave}>Save</button>
                            </div>
                            <template if:true={isChargeCreated}>
                                <p class="slds-text-align_center" style="font-style: italic; font-size: 12px;color: red;padding-top:1%;padding-bottom:1%;">You cannot add another login fee or make changes to the existing record. Kindly delete the previous record if you wish to make any changes or add a new one.</p>
                            </template>
                        </template>
                       <!-- <template if:true={showRetryButton}>
                            <div class="slds-p-top_medium" style="text-align: right;">
                                <button class="save-button slds-button slds-button_brand" onclick={refreshAPI}>Retry</button>
                            </div>
                        </template>-->
</template>
                        <!-- Uploaded Records Table -->
                        <template if:true={showRecords}>
                            <div class="slds-p-around_medium">
                                <table class="slds-table">
                                    <thead>
                                        <tr class="sticky">
                                            <th scope="col" style="text-align: left;white-space: nowrap;">File Name</th>
                                            <th scope="col" style="width: 135px;">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={documentList} for:item="doc">
                                            <tr key={doc.id}>
                                                <td scope="col" style="text-align: left;">
                                                    <div style="font-weight: 500;" title={doc.docName}>{doc.name}</div>
                                                </td>
                                                <td scope="col">
                                                    <div class="upload-icon" key={doc.contentId}>
                                                        <lightning-icon size="small"
                                                            icon-name="utility:preview" variant="brand" title="View Document"
                                                            data-id={doc.contentId}
                                                            onclick={handleView}
                                                            >
                                                        </lightning-icon>&nbsp;&nbsp;&nbsp;
                                                        <template if:true={doc.showDelete}>
                                                            <template if:false={isReadOnly}>
                                                            <lightning-icon size="small"
                                                                icon-name="utility:delete" variant="brand" title="Delete Document"
                                                                data-id={doc.contentId} data-doc={doc.id}
                                                                onclick={handleDelete}
                                                                data-name={doc.name}
                                                                
                                                                >
                                                            </lightning-icon>
                                                            </template>
                                                        </template>
                                                    </div>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                   
                </fieldset>
            </div>
                </template>
        </div>

        <!-- RIGHT SIDE: Applicant Table -->
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-around_small">
            <template if:true={showRecords}>
                <!-- <div class="table-container"> -->
                    <table class="slds-table">
                        <thead>
                            <tr class="sticky">
                                <th scope="col" style="text-align: left;white-space: nowrap;">Applicant Name</th>
                                <th scope="col" style="text-align: left;white-space: nowrap;">File Name</th>
                                <th scope="col" style="text-align: left;white-space: nowrap;">API Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- <template for:each={documentList} for:item="doc"> -->
                                <tr>
                                    <td scope="col" style="text-align: left;">
                                        <div style="font-weight: 500;">Abhilash Saini</div>
                                    </td>
                                    <td scope="col" style="text-align: left;">
                                        <div style="font-weight: 500;">Login Fee Receipt</div>
                                    </td>
                                    <td scope="col" style="text-align: left;">
                                        <div style="font-weight: 500;">{status}</div>
                                    </td>
                                </tr>
                            <!-- </template> -->
                        </tbody>
                    </table>
                <!-- </div> -->

                <!-- Fixed Initiate API Button -->
                    <template if:true={hideAPIButton}>
                    <div class="fixed-button">
                        <button type="button" class="slds-button previous-button" onclick={handleInitiateAPI} disabled={disableApiButton}>
                            Initiate API
                        </button>
                    </div>
                    </template>
                 </template>
        </div>
       
    </div>

    <!-- NEXT Button -->
        <template if:false={hideNext}>
        <div class="next-button-container">
            <button class="save-button slds-button slds-button_brand" onclick={goToNext}>Next</button>
        </div>
    </template>
    </template>

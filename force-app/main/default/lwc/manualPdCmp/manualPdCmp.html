    <div class="title-div">Physical PD History</div>
    <template if:true={showManualPds}>
        <div class="phd-table-wrap">
            <table class="slds-table">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col" colspan="1">
                             Applicant Name
                        </th>
                        <th scope="col" colspan="1">
                            Customer Type
                        </th>
                        <th scope="col" colspan="1">
                            Customer Profile
                        </th>
                        <th scope="col" colspan="1">
                            Initiated Time
                        </th>
                        <template lwc:if={showAddPD}>
                        <th scope="col" colspan="1">
                             Edit
                        </th>
                        </template>
                    </tr>
                </thead>

                <tbody>
                    <template for:each={manualPds} for:item="item">
                        <tr key={item.appVeriId}>
                            
                            <td>
                                {item.name}
                            </td>
                            <td>
                                {item.customerType}
                            </td>
                            <td>
                                {item.customerProfile}   
                            </td>
                            <td>
                                {item.initiatedAt}   
                            </td>
                            <template lwc:if={showAddPD}>
                            <td>
                                <template if:false={disabledCmp}>
                            <lightning-icon data-id={item.appVeriId} icon-name="utility:edit" alternative-text="Edit Document" title="EDIT" size="x-small" onclick={openPdForm} style="cursor: pointer;" ></lightning-icon> 
                                    </template>
                        </td>
                            </template>
                        </tr>
                    </template>
                
                </tbody>
            </table>
        </div>
    </template>
    <template if:true={showImages}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <header class="slds-modal__header header-section">
                    <div class="slds-text-align_center">
                        <h2 slot="title" class="slds-text-heading_medium slds-hyphenate header-title">View Image</h2>
                    </div>
                </header>

                <div class="slds-modal__content slds-p-around_medium" id="confirm-body">
                    <!-- add child component here -->

                    <div style="padding: 10px; text-align: center;">
                        <div style="margin-top: 2%;">
                            <div class="content-container" style="height: 300px;">
                                <template if:true={pdfUrl}>
                                    <iframe src={pdfUrl} class="content-viewer"
                                        style="border: 1px solid #000000; height:70%; width:70%; margin-bottom: 5px;"></iframe>
                                </template>
                                <template if:true={imageUrl}>
                                    <div class="scrollable">
                                        <img src={imageUrl} alt="Document Image" class="content-viewer"
                                            style="border: 1px solid #000000; margin-bottom: 5px;" />
                                    </div>
                                </template>
                                <div>{documentName}</div>
                            </div>
                        </div>
                    </div>
                </div>

                <footer class="footer-section">
                    <div class="slds-align_absolute-center button-container">
                        <template if:true={showNextButton}>
                        <button class="slds-button slds-button_brand previous-button" onclick={handlePrevious} style="margin-right: 10px;"
                            disabled={previous}>Previous</button>
                        <button class="slds-button slds-button_brand continue-button" onclick={handleNext} style="margin-right: 10px;"
                            disabled={disableNext}>Next</button>
                        </template>
                        <button class="slds-button slds-button_brand previous-button" style="margin-right: 10px;"
                            onclick={handleClose}>Close</button>
                            <!-- <button class="slds-button slds-button_brand previous-button"
                            onclick={handledelete}>Delete</button> -->
                    </div>
                </footer>
            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open slds-modal_large"></div>
    </template>
</template>

<template>
    <!-- Screen Quick Action popup content -->
    <div class="slds-p-around_medium">
        <div class="slds-media slds-media_center slds-m-bottom_medium">
            <div class="slds-media__figure">
                <lightning-icon icon-name="utility:warning" size="small" alternative-text="Opt Out"></lightning-icon>
            </div>
            <div class="slds-media__body">
                <h2 class="slds-text-heading_small slds-m-bottom_xx-small">
                    {headerText}
                </h2>
                <p class="slds-text-body_regular">
                    {messageText}
                </p>
            </div>
        </div>

        <div class="slds-align_absolute-center slds-m-top_small">
            <lightning-button
                label="Cancel"
                variant="neutral"
                class="slds-m-right_small"
                onclick={handleCancel}
                disabled={isSaving}
            ></lightning-button>

            <lightning-button
                label="Confirm"
                variant="destructive"
                onclick={handleConfirm}
                disabled={isSaving}
            ></lightning-button>
        </div>

        <template if:true={isSaving}>
            <div class="slds-m-top_medium slds-align_absolute-center">
                <lightning-spinner size="small" alternative-text="Saving"></lightning-spinner>
            </div>
        </template>
    </div>
</template>

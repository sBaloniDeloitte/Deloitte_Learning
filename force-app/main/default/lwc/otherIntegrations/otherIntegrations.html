                <template if:true={isHLUser}>
                    <lightning-accordion-section name="fetchMCA" label="Fetch MCA">
                        <template if:true={isloading}>
                        <lightning-spinner alternative-text="Loading" variant="brand" size="large"></lightning-spinner>
                    </template>
                    <!-- ✅ Always show Applicant + CIN + Fetch Button -->
                    <template if:true={hasApplicants}>
                        <div class="slds-grid slds-wrap slds-p-around_small mca-input-section">
                            
                            <!-- Applicant Combobox -->
                            <div class="slds-col slds-size_1-of-4 slds-p-right_small">
                                <lightning-combobox
                                    name="applicant"
                                    label="Select Applicant"
                                    value={selectedApplicantId}
                                    options={applicantOptions}
                                    onchange={handleApplicantChangeMCA}
                                    class="responsive-combobox"
                                    required
                                    field-level-help="Select the non-individual applicant to fetch MCA details for.">
                                </lightning-combobox>
                            </div>

                            <!-- CIN Field -->
                             <template if:true={showFields}>
                            <div class="slds-col slds-size_1-of-3 slds-p-right_small">
                                <lightning-input
                                    label="CIN Number"
                                    value={cinNumber}
                                    onchange={handleCINChange}
                                    maxlength="21"
                                    message-when-pattern-mismatch="Invalid CIN format"
                                    required
                                    field-level-help="Enter the Corporate Identification Number (CIN) to fetch MCA details.">
                                </lightning-input>
                            </div>
                               <!-- Fetch Button -->
                            <div class="slds-align_absolute-center slds-p-around_small">
                                <button 
                                    class="fetch-mca-button"
                                    onclick={handleFetchMCA}>
                                    Fetch MCA
                                </button>
                            </div>
                            </template>

                        </div>
                    </template>

                                            <td>{item.wheather_dsc_registered}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>

                </lightning-accordion-section>
               </template>

        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                    onclick={closePopup}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                        size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <header class="slds-modal__header header-section">
                    <div class="slds-text-align_center">
                        <h2 class="slds-text-heading_medium">EPF History</h2>
                    </div>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <table class="slds-table slds-table_bordered integration-table">
                        <thead>
                            <tr>
                                <th style="background-color: skyblue;border-color: black;color: black;">Sr No.</th>
                                <th style="background-color: skyblue;border-color: black;color: black;">Wage Month</th>
                                <th style="background-color: skyblue;border-color: black;color: black;">Total Amount
                                </th>
                                <th style="background-color: skyblue;border-color: black;color: black;">Total Members
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={selectedEPFData} for:item="epf">
                                <tr key={epf}>
                                    <td style=" border-color: black">{epf.srno}</td>
                                    <td style=" border-color: black">{epf.wageMonth}</td>
                                    <td style=" border-color: black">{epf.totalAmount}</td>
                                    <td style=" border-color: black">{epf.totalMembers}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>

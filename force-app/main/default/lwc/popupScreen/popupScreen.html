<template>
    
    <lightning-card  variant="Narrow"  >
       
    
    <template lwc:if={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class={cssContainer}>
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Loading" variant="brand" size="large"></lightning-spinner>
                </template>
                
                <header class={headerClass}>
                    <div class="slds-text-align_center">
                        <h2 slot="title" class="slds-text-heading_medium slds-hyphenate header-title">{headerTitle}</h2>
                    </div>
                </header>
                
                <div class="slds-modal__content" id="popup-body">
                    <!-- add child component here -->

                    <template lwc:if={showFiComp}>
                        <c-credit-f-i-initiation-cmp  record-id={recordId} generic-initiate=true onclose={modalClose}></c-credit-f-i-initiation-cmp>
                    </template>

                    <template lwc:elseif={showLeadClosureCmp}>
                        <div class="slds-p-around_medium closure-remarks">
                            <lightning-combobox 
                            label="Closure Remarks" 
                            value={selectedReasonValue} 
                            placeholder="Select a reason" 
                            required="true" 
                            options={reasonOptions} 
                            onchange={handleLostReasonChange}>
                        </lightning-combobox>
                        <template lwc:if={showLostReason}>
                          <lightning-input label="Add Remarks" value={remarkValue} onchange={handleLostRemarks}></lightning-input>
                        </template>
                        </div>
                    </template>

                    <template lwc:elseif={showDialerDispositionCmp}>
                        <div class="slds-p-around_medium">
                            <c-lead-dialer-disposition record-id={recordId} count={callCount} onmodalclose={modalClose} onsave={handleModelSave}></c-lead-dialer-disposition>
                        </div>
                    </template>

                    <template lwc:elseif={showCollateralRemarks}>
                       <div class="slds-p-around_medium closure-remarks">
                            <lightning-textarea label="Add Remarks" value={remarkValue} maxlength="131072" onchange={handleLostRemarks}></lightning-textarea>
                        </div>
                    </template>

                    <template lwc:elseif={showColdLeadCmp}>
                        <div class="slds-p-around_medium">
                            <lightning-combobox name="Cold Reason" label="Cold Lead Reason" value={selectedDisposition} placeholder="Select an option." options={dispositionOptions} onchange={handleDispositionChange}></lightning-combobox>
                        </div>
                    </template>

                    <template lwc:elseif={showPreviewCmp}>
                        <div style="text-align: center; min-height: 65vh;">
                            <template lwc:if={showImage}>
                                <img src={imageUrl} title="" style="max-width: 100%; height: auto;" />
                            </template>
                            <template lwc:elseif={showPdf}>
                                <iframe src={pdfUrl} style="width: 100%; min-height: inherit; border: none;"></iframe>
                            </template>
                            <template lwc:else>
                                <div style="text-align: center; font-size: 20px; margin-top: 30vh; height: inherit;">No preview available for this document!</div>
                            </template>
                        </div>
                    </template>

                    <template lwc:elseif={showAddFileCmp}>
                        <div class="slds-p-around_medium">
                            <lightning-combobox label="Document Type" disabled={disableDocType} options={docOption} value={newFileName} onchange={handleDocSelectonChange}></lightning-combobox>
                            <template if:true={showDocName}>
                                <lightning-input label="Document Name" value={otherFileName} required onchange={handleDocNameChange} pattern="[a-zA-Z_ ]*"></lightning-input> 
                            </template>
                        </div>
                    </template>
                    <template lwc:elseif={showGeoLocationCmp}>
                        <lightning-map map-markers={mapMarkers} zoom-level="15" style="height: 400px;"></lightning-map>
                    </template>
                    <template lwc:elseif={showDedupeConfirmation}>
                        <div class="button-shadow" style="width: 90%;background: white; margin: 20px;padding: 20px;border-radius: 10px;border: 1px solid #113451;">       
                            <p class="slds-text-align_center" style="font-style: Lato Bold; font-size: 12px;color: #113451;"> <lightning-formatted-rich-text value={confirmMessage}></lightning-formatted-rich-text></p> 
                        </div>
                        <!-- <c-dedupe-confirmation-popup record-id={rcordId} confirm-message={confirmMessage}></c-dedupe-confirmation-popup> -->
                    </template>
                    <template lwc:elseif={showLoginWithoutException}>
                        <div class="button-shadow" style="width: 90%;background: white; margin: 20px;padding: 20px;border-radius: 10px;border: 1px solid #113451;">       
                            <h3 class="slds-text-heading_medium slds-m-bottom_small">Missing Stages:</h3>
                            <ul class="slds-list_dotted">
                                <template for:each={errors} for:item="error">
                                    <li key={error}>{error}</li>
                                </template>
                            </ul>
                        </div>
                    </template>
                    <template lwc:elseif={showLoginButton}>
                        <div class="button-shadow" style="width: 90%;background: white; margin: 20px;padding: 20px;border-radius: 10px;border: 1px solid #113451;">       
                            <p class="slds-text-align_center" style="font-style: Lato Bold; font-size: 12px;color: #113451;"> <lightning-formatted-rich-text value={confirmMessage}></lightning-formatted-rich-text></p> 
                        </div>
                    </template>
                    <template lwc:elseif={showInitiatePd}>
                        <div class="slds-p-around_medium">       
                            <lightning-combobox name="Select Applicant" label="Select Applicant" value={selectedDisposition} placeholder="Select Applicant" options={dispositionOptions} onchange={handleDispositionChange}></lightning-combobox>
                        </div>
                    </template>
                </div>
                
                <footer class={footerClass}>
                    <div class="slds-align_absolute-center button-container">
                        <template lwc:if={showCloseBtn}>
                            <button class="slds-button slds-button_brand cancel-button" onclick={modalClose}>{closeBtnText}</button>
                        </template>
                        <template lwc:if={showSaveBtn}>
                            <button class="slds-button slds-button_brand save-button" onclick={handleModelSave}>{saveBtnText}</button>
                        </template>
                    </div>
                </footer>
            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
    </lightning-card>
</template>

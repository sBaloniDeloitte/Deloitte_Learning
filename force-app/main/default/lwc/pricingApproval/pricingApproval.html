<template>
<!-- <lightning-card icon-name="standard:table"> -->
<span class="styleContainer"></span>

<template if:true={spinner}>
    <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
</template>

<template if:true={showSections}>
    <div class="bsa-page">
        <div style="margin-left: 15px; padding-top: 13px">
            <template if:true={showOpenAll}>
                <button class="save-button slds-button slds-button_brand openAll" onclick={handlePassAllSections}>Open All</button>
            </template>
            <template if:false={showOpenAll}>
                <button class="save-button slds-button slds-button_brand closeAll" onclick={handleCloseAllSections}>Close All</button>
            </template>
        </div>
    </div>
</template>

<lightning-accordion class="example-accordion" allow-multiple-sections-open
    active-section-name={mainAccordianActiveSection}>

    <template if:true={showSections}>
        <lightning-accordion-section name="Charges" label="Charges">
            <div class="slds-m-around_medium">
                    <c-credit-charges-table record-id={recordId} onloadingchange={handleLoadingChange} onenableapproval={handleEnableApproval} onhideeditbutton = {handleEditButton}></c-credit-charges-table><!--Sanwar-->
            </div>
        </lightning-accordion-section>

        <lightning-accordion-section name="LoandDetails" label={accordianLabel}>
            <div class="slds-m-around_medium">

                <div if:false={isLoaded} class="slds-is-relative">
                <lightning-spinner
                    alternative-text="Loading..." variant="brand">
                </lightning-spinner>
            </div>
                <div class="table-container">

                    <table cellpadding="0" cellspacing="0"
                        style="border-collapse: collapse; width: 70%; border: 1px solid black;"
                        class="slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered slds-table_col-bordered slds-border_left slds-border_right custom-table">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th
                                    style="width: 6%; text-align: center; background-color: #5bb6e3;color: black;border: 1px solid black;">
                                    <div class="slds-truncate" title="Charge Name">Product</div>
                                </th>
                                <th
                                    style="width: 6%; text-align: center; background-color: #5bb6e3;color: black;border: 1px solid black;">
                                    <div class="slds-truncate" title="Charge Name">Parameters</div>
                                </th>
                                <th
                                    style="width: 3%; text-align: center; background-color: #5bb6e3;color: black;border: 1px solid black;">
                                    <div class="slds-truncate" title="Sactioned Value">Sanctioned Value</div>
                                </th>
                                <th
                                    style="width: 3%; text-align: center; background-color: #5bb6e3;color: black;border: 1px solid black;">
                                    <div class="slds-truncate" title="Negotiated value">Negotiated value</div>
                                </th>
                                <th
                                    style="width: 3%; text-align: center; background-color: #5bb6e3;color: black;border: 1px solid black;">
                                    <div class="slds-truncate" title="Final value">Final value</div>
                                </th>

                            </tr>
                        </thead>
                        <tbody>
                            <template if:false={isHlRelated}>
                                <tr>
                                    <td style="text-align: left; padding: 2px; width: 10%;border: 1px solid black;">
                                    </td>
                                    <td style="text-align: left; padding: 2px; width: 10%;border: 1px solid black;">
                                        DSA Impact (In %)</td>

                                    <td
                                        style="text-align: left; padding: 2px;padding-bottom:3px; width: 10%;border: 1px solid black;">
                                        <lightning-input variant="label-hidden" disabled>
                                        </lightning-input>
                                    </td>
                                    <td
                                        style="text-align: left; padding: 2px;padding-bottom:3px; width: 10%;border: 1px solid black;">
                                        <lightning-input variant="label-hidden" type="number" step="0.01"
                                            onchange={handleDSAOnChange} value={dsaNegotiatedValue}
                                            data-field="negotiatedValueAHLChild" disabled={isDSAdisabled}>
                                        </lightning-input>
                                    </td>
                                    <td
                                        style="text-align: left; padding: 2px; padding-bottom:3px; width: 10%; border: 1px solid black;">
                                        <lightning-input variant="label-hidden" type="number" data-field="finalValue" disabled value={dsaFinalValue}>
                                        </lightning-input>
                                    </td>
                                </tr>
                            </template>
                            <template for:each={loanParameters} for:item="row">
                                <tr key={row.id}>
                                    <td style="text-align: left; padding: 2px; width: 10%;border: 1px solid black;">
                                        {row.productName}
                                    </td>
                                    <td style="text-align: left; padding: 2px; width: 10%;border: 1px solid black;">
                                        {row.Parameter}</td>

                                    <td
                                        style="text-align: left; padding: 2px;padding-bottom:3px; width: 10%;border: 1px solid black;">
                                        <lightning-input variant="label-hidden" type="number" step={row.step} 
                                            value={row.sanctionedValue} data-id={row.id} data-field="sanctionedValue"
                                            disabled>
                                        </lightning-input>
                                    </td>
                                    <td
                                        style="text-align: left; padding: 2px;padding-bottom:3px; width: 10%;border: 1px solid black;">
                                        <lightning-input variant="label-hidden" type="number" step={row.step} 
                                            value={row.negotiatedValue} onchange={handleloanDetailChange}
                                            data-id={row.id} data-field="negotiatedValue" disabled={isEditDisabled}>
                                        </lightning-input>
                                    </td>
                                    <td
                                        style="text-align: left; padding: 2px; padding-bottom:3px; width: 10%; border: 1px solid black;">
                                        <lightning-input variant="label-hidden" type="number" step={row.step}
                                            value={row.finalValue} data-id={row.id} data-field="finalValue"
                                            disabled>
                                        </lightning-input>
                                    </td>
                                </tr>
                            </template>
                            <template for:each={loanParametersAHLChild} for:item="row">
                                <tr key={row.id}>
                                    <td style="text-align: left; padding: 2px; width: 10%;border: 1px solid black;">
                                        {row.productName}
                                    </td>
                                    <td style="text-align: left; padding: 2px; width: 10%;border: 1px solid black;">
                                        {row.Parameter}</td>

                                    <td
                                        style="text-align: left; padding: 2px;padding-bottom:3px; width: 10%;border: 1px solid black;">
                                        <lightning-input variant="label-hidden" type="number" step={row.step} 
                                            value={row.sanctionedValue} data-id={row.id} data-field="sanctionedValue"
                                            disabled>
                                        </lightning-input>
                                    </td>
                                    <td
                                        style="text-align: left; padding: 2px;padding-bottom:3px; width: 10%;border: 1px solid black;">
                                        <lightning-input variant="label-hidden" type="number" step={row.step} 
                                            value={row.negotiatedValueAHLChild} onchange={handleloanDetailChangeAHLChild}
                                            data-id={row.id} data-field="negotiatedValueAHLChild" disabled={row.isdisabled}>
                                        </lightning-input>
                                    </td>
                                    <td
                                        style="text-align: left; padding: 2px; padding-bottom:3px; width: 10%; border: 1px solid black;">
                                        <lightning-input variant="label-hidden" type="number" step={row.step}
                                            value={row.finalValue} data-id={row.id} data-field="finalValue"
                                            disabled>
                                        </lightning-input>
                                    </td>
                                </tr>
                            </template>
                            <template for:each={loanParametersANHL} for:item="row">
                                <tr key={row.id}>
                                    <td style="text-align: left; padding: 2px; width: 10%;border: 1px solid black;">
                                        {row.productName}
                                    </td>
                                    <td style="text-align: left; padding: 2px; width: 10%;border: 1px solid black;">
                                        {row.Parameter}</td>

                                    <td
                                        style="text-align: left; padding: 2px;padding-bottom:3px; width: 10%;border: 1px solid black;">
                                        <lightning-input variant="label-hidden" type="number" step={row.step} 
                                            value={row.sanctionedValue} data-id={row.id} data-field="sanctionedValue"
                                            disabled>
                                        </lightning-input>
                                    </td>
                                    <td
                                        style="text-align: left; padding: 2px;padding-bottom:3px; width: 10%;border: 1px solid black;">
                                        <lightning-input variant="label-hidden" type="number" step={row.step} 
                                            value={row.negotiatedValueANHL} onchange={handleloanDetailChangeANHL}
                                            data-id={row.id} data-field="negotiatedValueANHL" disabled={row.isdisabled}>
                                        </lightning-input>
                                    </td>
                                    <td
                                        style="text-align: left; padding: 2px; padding-bottom:3px; width: 10%; border: 1px solid black;">
                                        <lightning-input variant="label-hidden" type="number" step={row.step}
                                            value={row.finalValue} data-id={row.id} data-field="finalValue"
                                            disabled>
                                        </lightning-input>
                                    </td>
                                </tr>
                            </template>
                            <template for:each={loanParametersANHLChild} for:item="row">
                                <tr key={row.id}>
                                    <td style="text-align: left; padding: 2px; width: 10%;border: 1px solid black;">
                                        {row.productName}
                                    </td>
                                    <td style="text-align: left; padding: 2px; width: 10%;border: 1px solid black;">
                                        {row.Parameter}</td>

                                    <td
                                        style="text-align: left; padding: 2px;padding-bottom:3px; width: 10%;border: 1px solid black;">
                                        <lightning-input variant="label-hidden" type="number" step={row.step} 
                                            value={row.sanctionedValue} data-id={row.id} data-field="sanctionedValue"
                                            disabled>
                                        </lightning-input>
                                    </td>
                                    <td
                                        style="text-align: left; padding: 2px;padding-bottom:3px; width: 10%;border: 1px solid black;">
                                        <lightning-input variant="label-hidden" type="number" step={row.step} 
                                            value={row.negotiatedValueANHLChild} onchange={handleloanDetailChangeANHLChild}
                                            data-id={row.id} data-field="negotiatedValueANHLChild" disabled={row.isdisabled}>
                                        </lightning-input>
                                    </td>
                                    <td
                                        style="text-align: left; padding: 2px; padding-bottom:3px; width: 10%; border: 1px solid black;">
                                        <lightning-input variant="label-hidden" type="number" step={row.step}
                                            value={row.finalValue} data-id={row.id} data-field="finalValue"
                                            disabled>
                                        </lightning-input>
                                    </td>
                                </tr>
                            </template>
                            <template for:each={loanParametersFL} for:item="row">
                                <tr key={row.id}>
                                    <td style="text-align: left; padding: 2px; width: 10%;border: 1px solid black;">
                                        {row.productName}
                                    </td>
                                    <td style="text-align: left; padding: 2px; width: 10%;border: 1px solid black;">
                                        {row.Parameter}</td>

                                    <td
                                        style="text-align: left; padding: 2px;padding-bottom:3px; width: 10%;border: 1px solid black;">
                                        <lightning-input variant="label-hidden" type="number" step={row.step} 
                                            value={row.sanctionedValue} data-id={row.id} data-field="sanctionedValue"
                                            disabled>
                                        </lightning-input>
                                    </td>
                                    <td
                                        style="text-align: left; padding: 2px;padding-bottom:3px; width: 10%;border: 1px solid black;">
                                        <lightning-input variant="label-hidden" type="number" step={row.step} 
                                            value={row.negotiatedValueFL} onchange={handleloanDetailChangeFL}
                                            data-id={row.id} data-field="negotiatedValueFL" disabled={row.isdisabled}>
                                        </lightning-input>
                                    </td>
                                    <td
                                        style="text-align: left; padding: 2px; padding-bottom:3px; width: 10%; border: 1px solid black;">
                                        <lightning-input variant="label-hidden" type="number" step={row.step}
                                            value={row.finalValue} data-id={row.id} data-field="finalValue"
                                            disabled>
                                        </lightning-input>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                  
                    <template if:true={isEditableUser}>
                        <div class="andcontainer align-end" style="margin-top: 1%;">
                            <template if:false={isEdit}>
                                <button type="button" disabled ={isEditHidden} class="slds-button previous-button" onclick={handleEdit} >Edit</button><!--Sanwar-->
                            </template>
                            <template if:false={isApprove}>
                                <button type="button" disabled ={isApprove} class="slds-button save-button" onclick={handleApprove}>Approve</button>
                            </template>
                            <template if:false={isSave}>
                                <button type="button" disabled ={isSave} class="slds-button save-button" onclick={handleSave}>Save</button>
                            </template>
                            <template if:true={showResanctionNotes}>
                                <div style="color: red; font-weight: bold; margin-top: 10px;" class="slds-m-around_small">
                                    * {resanctionNotes}
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </lightning-accordion-section>
      
        <template if:true={hideApprovalHistory}>
            <lightning-accordion-section name="ApprovalHistory" label="Approval History">
                <div class="slds-m-around_medium">
                    <div class="table-container">

                        <c-loan-approval-process record-id={recordId} approval-type="pricing Approval" show-approval={showApprovalButton} onloadloandata={loanLoanData} onrefreshpage= {handleRefreshDetails}><!--Sanwar-->
                        </c-loan-approval-process>
                    </div>
                </div>
            </lightning-accordion-section>
        </template>
    </template>

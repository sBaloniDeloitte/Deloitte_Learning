   <template if:true={showMissingFields}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-label="Missing Documents"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container" style="min-width: 90%;">
                <header class="slds-modal__header" style="background-color: #5bb6e3; color:white;font-weight:500;">
                    <div class="slds-text-align_center">
                        <h2 style="font-size:15px; font-weight: bold; margin: 5px 0;"
                            class="slds-text-heading_medium">
                            Missing Information
                        </h2>
                    </div>
                </header>

                <div class="slds-modal__content slds-p-around_medium slds-modal__content_headless" id="confirm-body"
                    style="min-height: 30% !important;">
                    <template if:true={errorMsg}>
                        <div style="font-size:14px">
                            The following documents contain addresses without a specified Address Type. Please either complete the address information by selecting an appropriate Address Type, or unselect the document.
                            <br />
                        </div>
                    </template>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                        <thead>
                            <!-- <tr class="slds-line-height_rseset">
                                    <th colspan="4"  scope="col">
                                        <div class="slds-truncate" title="Missing Document Type">Missing Document/Address</div>
                                    </th>
                                </tr> -->
                            <tr class="slds-line-height_reset">
                                <th scope="col">
                                    <div class="slds-truncate" title="Applicant Name">Customer Name</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate" title="Applicant Name">Document Name</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate" title="Applicant Name">Missing Fields</div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={errorfield} for:item="group">
                                <tr key={group.applicantName}>
                                    <td>
                                        <div class="slds-truncate" title={group.applicantName}>{group.applicantName}
                                        </div>
                                    </td>
                                    <td>
                                        <div class="slds-truncate" title={group.customerType}>{group.documentName}</div>
                                    </td>
                                    <td>
                                        <div class="slds-truncate" title={group.applicantProfile}>{group.missingFields}
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <footer class="slds-modal__footer" style="border: revert;">
                    <div class="slds-align_absolute-center">
                        <button class="cancel-button slds-button slds-button_brand" style="border: none;"
                            onclick={handleClosefields} >Close</button>
                    </div>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open slds-modal_large"></div>

    <template if:true={errorModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"

                <header class="slds-modal__header" style="background-color: skyblue; font-weight:500;">
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Please review the
                        following errors</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <template for:each={errorLst} for:item="listVariable" for:index="index">
                        <div style="color: red;" key={listVariable}>
                            {listVariable}
                        </div>
                    </template>
                </div>
                <div class="slds-modal__footer"
                    style="background-color: skyblue;border-radius: 0px 0px 5px 5px;text-align: center;min-height: 30px;">
                    <button class="slds-button slds-button_brand previous-button"
                        style="width: 140px;background-color: #dc387e;font-weight: 500;"
                        onclick={hideModalBox}>Cancel</button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <template if:true={errorModalAddressMissing}>

                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-3">
                    <template for:each={errorLstAddressMissing} for:item="listVariable" for:index="index">

                            {listVariable.errorMsg}
                        </div>
                    </template>
                </div>
                <div class="slds-modal__footer"
                    style="background-color: skyblue;border-radius: 0px 0px 5px 5px;text-align: center;min-height: 30px;">

                        onclick={hideModalBoxAddress}>Cancel</button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

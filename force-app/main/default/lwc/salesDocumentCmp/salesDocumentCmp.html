                <div class="slds-spinner--brand slds-spinner slds-spinner--medium" role="alert">
                    <span class="slds-assistive-text">Loading...</span>
                    <div class="slds-spinner__dot-a"></div>
                    <div class="slds-spinner__dot-b"></div>
                </div>
            </div>
        </section> 
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

            <template if:true={modalVisibility}>
                <section role="dialog" tabindex="-1" aria-modal="true" aria-label="Meaningful description of the modal content"
                    class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container select-doc-container" style="min-width: 60%;">
                        <template if:true={isSpinnerLoading}>
                            <lightning-spinner variant="brand" size="large"> </lightning-spinner>
                        </template>
                        <header class="slds-modal__header select-doc-header" style="background-color: #5bb6e3;font-weight:500;">
                            <div class="slds-text-align_center">
                                <h2 slot="title"
                                    style="font-style: Lato Bold; font-size:15px; font-weight: bold; margin-top: 5px; margin-bottom: 5px"
                                    class="slds-text-heading_medium slds-hyphenate">Select Documents</h2>
                            </div>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <!-- 1) Choose applicant -->
                            <template if:true={showApplicantPicker}>
                                <lightning-combobox name="applicant" label="Pick an Applicant" options={applicantOptions}
                                    value={selectedApplicantId} placeholder="Select an applicant" onchange={handleApplicantChange}>
                                </lightning-combobox>
                            </template>
                        </div>
                        <div class="slds-modal__content slds-p-around_medium slds-modal__content_headless " id="confirm-body2"
                            style="min-height: 30% !important;">
                            <template if:false={showApplicantPicker}>
                                <template for:each={docCheckList} for:item="doc">
                                    <div class="doc-category-header" key={doc}>
                                        {doc.docType}
                                    </div>
                                    <template for:each={doc.docList} for:item="doc">
                                        <div key={doc.Id} style="margin:1.5%;">
                                            <lightning-input type="checkbox" data-id={doc.Id} data-name={doc.Name} label={doc.Name}
                                                onchange={docSelectHandler} checked={doc.checked} disabled={doc.isDisabled}>
                                            </lightning-input>
                                        </div>
                                    </template>
                                </template>
                            </template>
                        </div>
                        <footer class="slds-modal__footer select-doc-footer" style="border: revert;">
                            <div class="slds-align_absolute-center">
                                <button class="cancel-button slds-button slds-button_brand select-doc-close-btn" style="border:none"
                                    onclick={handleClose}>Close</button>
                                <button class="save-button slds-button slds-button_brand select-doc-confirm-btn" style="border: none;" onclick={addDocHandler}>
                                    Confirm
                                </button>
                            </div>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open slds-modal_large"></div>
            </template>

        </template>

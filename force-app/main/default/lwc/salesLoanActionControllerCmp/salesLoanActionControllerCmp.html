<template>
    <span class="styleContainer"></span>
    <template if:true={showcmp}>
        <div class="slds-path">
            <div class="slds-grid slds-path__track">
                <div class="slds-grid slds-path__scroller-container" style="width: 100%;overflow-x: auto;white-space: nowrap;padding: 10px;">
                    <div class="slds-path__scroller">
                        <div class="slds-path__scroller_inner">
                            <ul style="padding-left: 1%;padding-right: 1%;width: 100%;overflow-x: auto;white-space: nowrap;padding: 10px;" class="slds-path__nav" role="listbox" aria-orientation="horizontal"
                                aria-labelledby="slds-path__stage-name">
                                <template for:each={actionList} for:item="rec" for:index="index">
                                    <template if:true={rec.completed}>
                                        <template if:true={rec.isDisabled}>
                                            <li key={rec.name} data-id={rec.name} style="background: lightgray;min-width: 295px;margin-left: 4px;border-top-left-radius: var(--lwc-heightSalesPath, 2rem);border-bottom-left-radius: var(--lwc-heightSalesPath, 2rem);padding-left: .625rem;clip-path:polygon(6% 0%, 94% 0%, 99% 50%, calc(100% - 18px) 100%, 6% 100%, 31px 5);" class="disableFile slds-path__item" role="presentation">
                                                <a aria-selected="false" style="background: lightgray;" class="slds-path__link" href="#" id="path-6" role="option"
                                                    tabindex="-1">
                                                    <span class="slds-path__stage">
                                                        <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                                                            <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#check"></use>
                                                        </svg>
                                                        <span class="slds-assistive-text">Stage Complete</span>
                                                    </span>
                                                    <span class="slds-path__title" style="color: #113451;font-weight: 500;">{rec.name}</span>
                                                </a>
                                            </li>
                                        </template>
                                        <template if:false={rec.isDisabled}>
                                            <template if:true={rec.isActive}>
                                                <li key={rec.name} data-id={rec.name} style="background: #dc387e;min-width: 295px;margin-left: 4px;border-top-left-radius: var(--lwc-heightSalesPath, 2rem);border-bottom-left-radius: var(--lwc-heightSalesPath, 2rem);padding-left: .625rem;clip-path: polygon(6% 0%, 94% 0%, 99% 50%, calc(100% - 18px) 100%, 6% 100%, 31px 50%);" class="activeBtn slds-path__item" role="presentation" onclick={handleClick}>
                                                    <a aria-selected="false" style="background: #dc387e;" class="slds-path__link" href="#" id="path-7" role="option"
                                                        tabindex="-1">
                                                        <span class="slds-path__stage">
                                                            <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                                                                <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#check"></use>
                                                            </svg>
                                                            <span class="slds-assistive-text">Stage Complete</span>
                                                        </span>
                                                        <span class="slds-path__title" style="color: white;font-weight: 500;">{rec.name}</span>
                                                    </a>
                                                </li>
                                            </template>
                                            <template if:false={rec.isActive}>
                                                <li key={rec.name} data-id={rec.name} style="background: #9bbf56;min-width: 295px;margin-left: 4px;border-top-left-radius: var(--lwc-heightSalesPath, 2rem);border-bottom-left-radius: var(--lwc-heightSalesPath, 2rem);padding-left: .625rem;clip-path: polygon(6% 0%, 94% 0%, 99% 50%, calc(100% - 18px) 100%, 6% 100%, 31px 50%);" class="uploadFile slds-path__item" role="presentation" onclick={handleClick}>
                                                    <a aria-selected="false" style="background: #9bbf56;" class="uploadFile slds-path__link" href="#" id="path-8" role="option"
                                                        tabindex="-1">
                                                        <span class="slds-path__stage">
                                                            <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                                                                <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#check"></use>
                                                            </svg>
                                                            <span class="slds-assistive-text">Stage Complete</span>
                                                        </span>
                                                        <span class="slds-path__title" style="color: white;font-weight: 500;">{rec.name}</span>
                                                    </a>
                                                </li>
                                            </template>
                                        </template>
                                    </template>
                                    <template if:false={rec.completed}>
                                        <template if:true={rec.isDisabled}>
                                            <li key={rec.name} data-id={rec.name} style="background: lightgray;min-width: 295px;min-width: 295px;margin-left: 4px;border-top-left-radius: var(--lwc-heightSalesPath, 2rem);border-bottom-left-radius: var(--lwc-heightSalesPath, 2rem);padding-left: .625rem;clip-path:polygon(6% 0%, 94% 0%, 99% 50%, calc(100% - 18px) 100%, 6% 100%, 31px 50%);" class="disableFile slds-path__item" role="presentation">
                                                <a aria-selected="false" style="background: lightgray;" class="slds-path__link" href="#" id="path-9" role="option"
                                                    tabindex="-1">
                                                    <span class="slds-path__stage">
                                                        <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                                                            <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#check"></use>
                                                        </svg>
                                                    </span>
                                                    <span class="slds-path__title" style="color: #113451;font-weight: 500;">{rec.name}</span>
                                                </a>
                                            </li>
                                        </template>
                                        <template if:false={rec.isDisabled}>
                                            <template if:true={rec.isActive}>
                                                <li key={rec.name} data-id={rec.name} style="background: #dc387e;min-width: 295px;margin-left: 4px;border-top-left-radius: var(--lwc-heightSalesPath, 2rem);border-bottom-left-radius: var(--lwc-heightSalesPath, 2rem);padding-left: .625rem;clip-path: polygon(6% 0%, 94% 0%, 99% 50%, calc(100% - 18px) 100%, 6% 100%, 31px 50%);" class="activeBtn slds-path__item" role="presentation" onclick={handleClick}>
                                                    <a aria-selected="false" style="background: #dc387e;" class="slds-path__link" href="#" id="path-10" role="option"
                                                        tabindex="-1">
                                                        <span class="slds-path__stage">
                                                            <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                                                                <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#check"></use>
                                                            </svg>
                                                        </span>
                                                        <span class="slds-path__title" style="color: white;font-weight: 500;">{rec.name}</span>
                                                    </a>
                                                </li>
                                            </template>
                                            <template if:false={rec.isActive}>
                                                <li key={rec.name} data-id={rec.name} style="background: white;min-width: 295px;margin-left: 4px;border-top-left-radius: var(--lwc-heightSalesPath, 2rem);border-bottom-left-radius: var(--lwc-heightSalesPath, 2rem);padding-left: .625rem;clip-path: polygon(6% 0%, 94% 0%, 99% 50%, calc(100% - 18px) 100%, 6% 100%, 31px 50%);" class="normalFile slds-path__item" role="presentation" onclick={handleClick}>
                                                    <a aria-selected="false" style="background: white;" class="slds-path__link" href="#" id="path-11" role="option"
                                                        tabindex="-1">
                                                        <span class="slds-path__stage">
                                                            <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                                                                <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#check"></use>
                                                            </svg>
                                                        </span>
                                                        <span class="slds-path__title" style="color: #113451;font-weight: 500;">{rec.name}</span>
                                                    </a>
                                                </li>
                                            </template>
                                        </template>
                                    </template>
                                </template>  
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>  
    </template>
   
    
</template>

            <div class="slds-modal__container" style="min-width: 60%;">
                <header class="slds-modal__header api-check-modal-header" >
                    <div class="slds-text-align_center">
                        <h2 style="font-style: Lato Bold; font-size:15px; font-weight: bold; margin-top: 5px; margin-bottom: 5px"
                            class="slds-text-heading_medium slds-hyphenate">API Details Check</h2>
                    </div>
                </header>
                <div class="slds-modal__content slds-p-around_medium slds-modal__content_headless api-check-modal-content" id="confirm-body3"
                    style="min-height: 30% !important;">

                    <c-sales-loan-login-integration-details-check-cmp record-id={recordId} from-stage="Draft"></c-sales-loan-login-integration-details-check-cmp>
                </div>
                <footer class="slds-modal__footer api-check-modal-footer" style="border: revert;">
                    <div class="slds-align_absolute-center">
                        <button class="cancel-button slds-button slds-button_brand" style="border:none"
                            onclick={handleCloseAPI} disabled={isDisabled}>Close</button>
                        <button class="save-button slds-button slds-button_brand" style="border: none;"
                            onclick={navToNextFromApi} disabled={isDisabled}>Next</button>
                    </div>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open slds-modal_large"></div>

            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container" style="min-width: 80%;">
                <header class="slds-modal__header" style="background-color: skyblue; font-weight:500;">
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Please review the
                        following errors</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <template for:each={errorLst} for:item="listVariable" for:index="index">
                        <div style="color: red;" key={listVariable}>
                            {listVariable.errorMsg}
                        </div>
                    </template>
                </div>
                <div class="slds-modal__footer"
                    style="background-color: skyblue;border-radius: 0px 0px 5px 5px;text-align: center;min-height: 30px;">
                    <button class="slds-button slds-button_brand previous-button"
                        style="width: 140px;background-color: #dc387e;font-weight: 500;"
                        onclick={hideModalBoxError}>Cancel</button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

<template>
    <template if:false={showInPopup}>
        <template if:true={showChildCmp}>
            <c-sales-loan-360 customer-id={custId}></c-sales-loan-360>
        </template>
    </template>
    <template if:true={showInPopup}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container modal-class">
                <header class="slds-modal__header header-section">
                    <div class="slds-text-align_center">
                        <h2 slot="title" class="slds-text-heading_medium slds-hyphenate header-title">View Existing Loan Details</h2>
                    </div>
                </header>
                <div class="slds-modal__content" id="popup-body">
                    <c-sales-loan-360 customer-id={custId}></c-sales-loan-360>
                </div>
                <footer class="footer-section">
                    <div class="slds-align_absolute-center button-container">
                        <button class="slds-button slds-button_brand cancel-button" onclick={modalClose}>Close</button>
                    </div>
                </footer>
            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>

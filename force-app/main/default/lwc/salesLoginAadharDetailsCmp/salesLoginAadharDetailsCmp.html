        <template if:false={disableUploadOption}>

                            <template for:each={aadharUploadOrFillManuallyOptions} for:item="option">

                                    type="radio"

                    </lightning-layout-item>

                        <template if:true={showcheckBoxMaskingManualBack}>

                    <lightning-layout-item size="12" padding="around-small">

                    <template if:true={ShowConfirmAadharUpload}>

                    </lightning-layout-item>
                </template>
                </template>

                <template if:true={isDesktop}>
                    <lightning-layout-item size="3" padding="around-small">
                        <!--<lightning-input type="file" accept=".pdf,.jpg,.jpeg,.png" label="Aadhaar Front" data-type="Aadhaar Front" onchange={handleUploadAadharFinished} disabled={disableFrontUpload} icon-name="standard:upload"></lightning-input>-->

                        <template if:true={showcheckBoxMaskingManualFront}>

                                <lightning-input class="comboBoxSelect" type="checkbox" data-side="front"
                                    label="I acknowledge that I am uploading a masked Aadhaar card Front." 
                                    checked={checkedFront} onchange={handleAckowledgeChangeChange}></lightning-input>
                            </div>
                        </template>
                    </lightning-layout-item>
                    <lightning-layout-item size="3" padding="around-small">
                        <!--<lightning-input type="file" accept=".pdf,.jpg,.jpeg,.png" label="Aadhaar Back" data-type="Aadhaar Back" onchange={handleUploadAadharFinished} disabled={disableBackUpload} icon-name="standard:upload"></lightning-input>-->

                            label="Aadhaar Back"
                            accept=".pdf,.jpg,.jpeg,.png"
                           applicant-id={applicantId}             
                            onuploadfinished={handleUploadAadharFinished}
                            data-type="Aadhaar Back"
                            multiple="false">
                        </lightning-file-upload>-->
                        <template if:true={showcheckBoxMaskingManualBack}>
                            <div style="padding-top: 5%;">
                            The system is currently unable to mask the uploaded Aadhar card. You can try again later or upload a
                            masked Aadhar Back by clicking the checkbox below.
                            <lightning-input class="comboBoxSelect" type="checkbox" data-side="back"
                                label="I acknowledge that I am uploading a masked Aadhaar card Back." 
                                checked={checkedBack} onchange={handleAckowledgeChangeChange}></lightning-input>
                            </div>
                        </template>
                    </lightning-layout-item>
                    <!--<lightning-layout-item size="3" padding="around-small">
                        <lightning-input type="text" label="Aadhar" value={stampedAadharNumber} max-length="12" disabled></lightning-input>
                    </lightning-layout-item>-->
                    <template if:true={ShowConfirmAadharUpload}>
                        <lightning-layout-item size="3" padding="around-small">
                            <button class="button-green slds-button slds-button_success slds-button_stretch" onclick={handleConfirmAadharUpload} >Confirm Aadhar Upload</button>
                        </lightning-layout-item>

                    </template>
                </template>
                
            </lightning-layout>
        </template>

        <template if:true={showManualAadharFillOption}>
            <lightning-layout multiple-rows vertical-align="center">
                <template if:false ={hideManualDetailsAddButton}>
                    <template if:true={isMobile}>
                        <lightning-layout-item size="12" class="slds-p-around_small">
                            <button class="button-green slds-button slds-button_success slds-button_stretch" onclick={openAadharManualCmp} disabled={disableUploadOption}>Add Aadhar Details Manually</button>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" class="slds-p-around_small">
                            <lightning-input type="text" label="Aadhar" value={stampedAadharNumber} max-length="12" disabled></lightning-input>
                        </lightning-layout-item>
                    </template>
                </template>
               
            <template if:true={isDesktop}>
                <template if:false ={hideManualDetailsAddButton}>
                      <lightning-layout-item size="3" class="slds-p-around_small">
                    <button class="button-green slds-button slds-button_success slds-button_stretch" onclick={openAadharManualCmp} disabled={disableUploadOption}>Add Aadhar Details Manually</button>
                </lightning-layout-item>
                <lightning-layout-item size="3" class="slds-p-around_small">
                    <lightning-input type="text" label="Aadhar" value={stampedAadharNumber} max-length="12" disabled></lightning-input>
                </lightning-layout-item>
                </template>
              
            </template>
            <template if:true={isTablet}>
                 <template if:false ={hideManualDetailsAddButton}>
                    <lightning-layout-item size="6" class="slds-p-around_small">
                    <button class="button-green slds-button slds-button_success slds-button_stretch" onclick={openAadharManualCmp} disabled={disableUploadOption}>Add Aadhar Details Manually</button>
                    </lightning-layout-item>
                    <lightning-layout-item size="6" class="slds-p-around_small">
                        <lightning-input type="text" label="Aadhar" value={stampedAadharNumber} max-length="12"  disabled></lightning-input>
                    </lightning-layout-item>
                 </template>
                
            </template>
            </lightning-layout>
            
            <template if:true={manualAadharcmp}>
                <section role="dialog" class="slds-modal slds-fade-in-open custom-mobile-modal manual-aadhar-modal" style="z-index: 10004;">
                    <div class="slds-modal__container manual-aadhar-modal-container">
                        <template if:true={isManualloading}>
                            <lightning-spinner alternative-text="Loading" variant="brand" size="large"></lightning-spinner>
                        </template>
                        <header class="slds-modal__header modal-header manual-aadhar-modal-header" style="background-color: skyblue;">
                            <h2 class="pan-heading">Add Aadhar Details Manually</h2>
                        </header>

                        <div class="slds-modal__content slds-p-around_medium manual-aadhar-modal-content">
                            <table class="slds-table slds-table_bordered">
                                <thead style="background-color: skyblue;">
                                    <tr>
                                        <th>Field</th>
                                        <th>Value</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>First Name (as per Aadhar)<span style="color: red;">*</span></td>
                                        <td><lightning-input type="text" value={aadharDetails.firstName} onchange={handleInputAadharChange} data-field="firstName" max-length="150" onkeydown={blockSpaces}></lightning-input></td>
                                    </tr>
                                    <tr>
                                        <td>Middle Name (as per Aadhar)</td>
                                        <td><lightning-input type="text" value={aadharDetails.middleName} onchange={handleInputAadharChange} data-field="middleName" max-length="150" onkeydown={blockSpaces}></lightning-input></td>
                                    </tr>
                                    <tr>
                                        <td>Last Name (as per Aadhar)<span style="color: red;">*</span></td>
                                        <td><lightning-input type="text" value={aadharDetails.lastName} onchange={handleInputAadharChange} data-field="lastName" max-length="150" onkeydown={blockSpaces}></lightning-input></td>
                                    </tr>
                                    <tr>
                                        <td>Date of Birth<span style="color: red;">*</span></td>
                                        <td>
                                            <lightning-input type="date" value={aadharDetails.dob} onchange={handleInputAadharChange} onblur ={handleInputBlurDate} onfocus={handleInputBlurDate} message-when-bad-input={dobError} data-field="dob"></lightning-input>
                                            <template if:true={dobError}>
                                                <div class="slds-text-color_error slds-m-top_xx-small">{dobError}</div>
                                            </template>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>Aadhar Card Number<span style="color: red;">*</span></td>
                                        <td>
                                            <template if:true={isHLUser}>
                                                <lightning-input value={aadharDetails.aadharNumber} onchange={handleInputAadharChange} data-field="aadharNumber" max-length="12" onkeydown={blockSpaces}></lightning-input>
                                            </template>
                                            <template if:false={isHLUser}>
                                                <lightning-input value={aadharDetails.aadharNumber} message-when-pattern-mismatch="Enter Correct Aadhaar Number" pattern="[2-9][0-9]{11}" onchange={handleInputAadharChange} data-field="aadharNumber" max-length="12" onkeydown={blockSpaces}></lightning-input>
                                            </template>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>Mobile<span style="color: red;">*</span></td>
                                        <td><lightning-input type="Phone" value={aadharDetails.mobileNumber} onchange={handleInputAadharChange} pattern="^[6-9]\d{9}$" message-when-pattern-mismatch="Enter a valid 10-digit mobile number starting with 6-9" data-field="mobileNumber" max-length="10" onkeydown={blockSpaces}></lightning-input></td>
                                    </tr>
                                    <tr>
                                        <td>Address (as per Aadhar)<span style="color: red;">*</span></td>
                                        <td>
                                            
                                            <lightning-layout multiple-rows class="manual-aadhar-address-layout">
                                                 <lightning-layout-item size="12" padding="horizontal-small">
                                                      <lightning-combobox
                                                        name="Address Type"
                                                        label="Address Type"
                                                        variant="label-inline"
                                                        value={aadharDetails.addType}
                                                        options={addressTypeOptions}
                                                        onchange={handleAddressTypeChange}
                                                        required>
                                                    </lightning-combobox>
                                                </lightning-layout-item>
                                                <lightning-layout-item size="12" padding="horizontal-small">
                                                    <lightning-combobox label="Address Ownership" variant="label-inline" data-field="addressOwnership"
                                                        value={aadharDetails.aadharAddress.addressOwnership} options={addressOwnershipOptions} required
                                                        onchange={handleInputAadharChange}>
                                                    </lightning-combobox>
                                                </lightning-layout-item>
                                                <lightning-layout-item size="12" padding="horizontal-small">
                                                    <lightning-input name="AddLn1" label="Address Line 1" variant="label-inline" max-length="200" data-field="addressLine1" value={aadharDetails.aadharAddress.addressLine1} onchange={handleInputAadharChange} required></lightning-input>
                                                </lightning-layout-item>
                                                <lightning-layout-item size="12" padding="horizontal-small">
                                                    <lightning-input name="AddLn2" label="Address Line 2" variant="label-inline" max-length="200" data-field="addressLine2" value={aadharDetails.aadharAddress.addressLine2} onchange={handleInputAadharChange} required></lightning-input>
                                                </lightning-layout-item>
                                                <lightning-layout-item size="12" padding="horizontal-small">
                                                    <lightning-input name="AddLn3" label="Address Line 3" variant="label-inline" max-length="200" data-field="addressLine3" value={aadharDetails.aadharAddress.addressLine3} onchange={handleInputAadharChange}></lightning-input>
                                                </lightning-layout-item>
                                                <lightning-layout-item size="12" padding="horizontal-small">
                                                    <lightning-input type="text" label="Pincode" variant="label-stacked" value={aadharDetails.aadharAddress.postalCode} data-field="postalCode" onchange={handleInputAadharChange} maxlength="6" pattern="[0-9]{6}" message-when-pattern-mismatch="Pincode must be 6 digits" required></lightning-input>
                                                </lightning-layout-item>
                                                <lightning-layout-item size="12" padding="horizontal-small">
                                                    <lightning-input type="text" label="City" variant="label-stacked" value={aadharDetails.aadharAddress.city} disabled></lightning-input>
                                                </lightning-layout-item>
                                                <lightning-layout-item size="12" padding="horizontal-small">
                                                    <lightning-input type="text" label="State" variant="label-stacked" value={aadharDetails.aadharAddress.province} disabled></lightning-input>
                                                </lightning-layout-item>
                                                <lightning-layout-item size="12" padding="horizontal-small">
                                                    <lightning-input type="text" label="Country" variant="label-stacked" value={aadharDetails.aadharAddress.country} disabled></lightning-input>
                                                </lightning-layout-item>
                                            </lightning-layout>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <footer class="footer-section manual-aadhar-footer">
                            <button class="slds-button manual-aadhar-cancel-button" onclick={closeAadharModalManual}>Close</button>
                            <button class="slds-button manual-aadhar-confirm-button" onclick={handleAddAadharDetailsManually}>Confirm</button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open" style="z-index: 10003;"></div>
            </template>
        </template>

  <template if:true={showAadharModal}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <!-- Spinner -->
            <template if:true={isConformationLoading}>
                <lightning-spinner alternative-text="Loading" variant="brand" size="large"></lightning-spinner>
            </template>

            <!-- Modal Header -->
            <header class="slds-modal__header" style="background-color: skyblue;">
                <h2 class="slds-text-heading_medium">Confirmation Screen</h2>
            </header>

            <!-- Modal Body -->
            <div class="slds-modal__content slds-p-around_medium">
                <!-- Aadhaar Image or PDF Preview -->
                <div class="slds-grid slds-wrap slds-m-bottom_medium slds-align_absolute-center">
                    <template if:true={isImage}>
                        <div class="preview-box">
                            <img src={uploadedAadharUrl} alt="Uploaded Aadhaar" class="uploaded-image" style={zoomStyle} />
                        </div>
                        <div class="image-controls slds-m-top_small">
                            <button onclick={zoomIn} class="zoom-button">+</button>
                            <button onclick={zoomOut} class="zoom-button">-</button>
                        </div>
                    </template>
                    <template if:true={isPDF}>
                        <a href={uploadedAadharUrl} target="_blank" rel="noopener noreferrer">
                            Click here to view the PDF
                        </a>
                    </template>
                </div>

                <!-- Aadhaar Table -->
                <div class="slds-scrollable_x slds-p-horizontal_small" style="max-width: 960px; margin: auto;">
                    <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                        <thead style="background-color: skyblue;">
                            <tr>
                                <th>Field</th>
                                <th>Value</th>
                                <th>Confidence</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>First Name (as per Aadhaar)<span class="slds-text-color_error">*</span></td>
                                <td>
                                    <lightning-input type="text" value={aadharDetails.firstName} onchange={handleInputAadharChange}  data-field="firstName" max-length="150" onkeydown={blockSpaces}></lightning-input>
                                </td>
                                <td><lightning-input type="text" value={aadharDetails.firstNameConfidence} disabled></lightning-input></td>
                            </tr>
                            <tr>
                                <td>Middle Name (as per Aadhaar)<span class="slds-text-color_error">*</span></td>
                                <td>
                                    <lightning-input type="text" value={aadharDetails.middleName} onchange={handleInputAadharChange} data-field="middleName" max-length="150" onkeydown={blockSpaces}></lightning-input>
                                </td>
                                <td><lightning-input type="text" value={aadharDetails.middleNameConfidence} disabled></lightning-input></td>
                            </tr>
                            <tr>
                                <td>Last Name (as per Aadhaar)<span class="slds-text-color_error">*</span></td>
                                <td>
                                        <lightning-input type="text" value={aadharDetails.lastName} onchange={handleInputAadharChange} data-field="lastName" max-length="150" onkeydown={blockSpaces}></lightning-input>
                                </td>
                                <td><lightning-input type="text" value={aadharDetails.lastNameConfidence} disabled></lightning-input> </td>
                                </tr>
                            <template if:true={isAadharBackModalOpen}>
                                <tr>
                                    <td>Address<span class="slds-text-color_error">*</span></td>
                                    <td style="width: 100%;">
                                        <lightning-textarea type="text-area" value={aadharDetails.aadharFullAddress} onchange={handleInputAadharChange} data-field="aadharFullAddress"></lightning-textarea>
                                    </td>
                                    <td><lightning-input type="text" value={aadharDetails.addressConfidence} disabled></lightning-input> </td>
                                </tr>
                                <tr>
                                    <td>Pincode<span class="slds-text-color_error">*</span></td>
                                    <td>
                                        <lightning-input type="number" value={aadharDetails.aadharAddress.postalCode} onchange={handleInputAadharChange} data-field="postalCode" max-length="6" pattern="[0-9]{6}" message-when-pattern-mismatch="Pincode must be 6 digits" required></lightning-input>
                                    </td>
                                    <td><lightning-input type="text" value={aadharDetails.pinCodeConfidence} disabled></lightning-input></td>
                                </tr>
                                <tr>
                                    <td>Address Type<span class="slds-text-color_error">*</span></td>
                                    <td>
                                        <lightning-combobox data-field="addressType" value={aadharDetails.addType} options={addressTypeOptions} 
                                            onchange={handleInputAadharChange}>
                                        </lightning-combobox>
                                    </td>
                                    <td>
                                       
                                    </td>
                                </tr>
                                <tr>
                                    <td>Address Ownership<span class="slds-text-color_error">*</span></td>
                                    <td>
                                        <lightning-combobox data-field="addressOwnership"
                                            value={aadharDetails.aadharAddress.addressOwnership} options={addressOwnershipOptions} 
                                            onchange={handleInputAadharChange}>
                                        </lightning-combobox>
                                    </td>
                                    <td>
                                    </td>
                                </tr>
                            </template>
                            <template if:true={isAadharFrontModalOpen}>
                                <tr>
                                    <td>Date of Birth<span class="slds-text-color_error">*</span></td>
                                    <td>
                                        <lightning-input type="date" value={aadharDetails.dob} onchange={handleInputAadharChange} onblur ={handleInputBlurDate} onfocus={handleInputBlurDate} data-field="dob"></lightning-input>
                                    </td>
                                    <td><lightning-input type="text" value={aadharDetails.dobConfidence} disabled></lightning-input></td>
                                </tr>
                                <tr>
                                    <td>Aadhaar Number<span class="slds-text-color_error">*</span></td>
                                    <td>
                                        <lightning-input type="text" value={aadharDetails.aadharNumber} onchange={handleInputAadharChange} data-field="aadharNumber" max-length="12" ></lightning-input>
                                    </td>
                                    <td><lightning-input type="text" value={aadharDetails.aadharNumberConfidence} disabled=""></lightning-input></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Modal Footer -->
            <footer class="slds-modal__footer">
                <div class="slds-grid slds-wrap slds-grid_align-center">
                    <button class="slds-button slds-button_destructive slds-m-right_small" onclick={closeModal}>Close</button>
                    <button class="slds-button slds-button_brand" onclick={handleConfirm}>Confirm</button>
                </div>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>

</template>

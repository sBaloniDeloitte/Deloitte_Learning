<template>
    <span class="styleContainer"></span>

    <template if:true={ShowLoader}>
        <section role="dialog"
                 aria-modal="true"
                 aria-busy="true"
                 aria-label="Loading, please wait"
                 tabindex="-1"
                 class="slds-modal slds-fade-in-open"
                 style="z-index:900003;">
            <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </section>
    </template>

    <div class="bsa-root">

        <div class="bsa-topbar" role="toolbar" aria-label="Bank statement analysis controls">
            <div class="bsa-topbar__left">
                <!-- Custom "Statement method" dropdown (light DOM, fully CSS-controllable) -
                     replaces lightning-combobox, which renders its listbox in native shadow
                     DOM here and blocks external CSS from reaching option text color. -->
                <div class="method-select">
                    <label class="method-select__label" id="method-select-label">Statement method</label>
                    <button
                        type="button"
                        class="method-select__trigger"
                        aria-haspopup="listbox"
                        aria-labelledby="method-select-label"
                        aria-expanded={isMethodOpen}
                        disabled={isFieldDisable}
                        onclick={toggleMethodDropdown}>
                        <span class="method-select__value">{selectedMethodLabel}</span>
                        <svg class="method-select__chevron" viewBox="0 0 52 52" aria-hidden="true">
                            <path d="M4 18 L26 38 L48 18" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </button>
                    <template if:true={isMethodOpen}>
                        <ul class="method-select__listbox" role="listbox" aria-label="Statement method">
                            <template for:each={decoratedMethodOptions} for:item="opt">
                                <li key={opt.value}
                                    class={opt.optionClass}
                                    role="option"
                                    aria-selected={opt.isSelected}
                                    data-value={opt.value}
                                    onclick={selectMethod}>{opt.label}</li>
                            </template>
                        </ul>
                    </template>
                </div>
            </div>
        </div>

        <template if:true={showData}>
            <div class="bsa-layout">

                <aside class="bsa-panel" aria-label="Configuration">
                    <div class="bsa-panel__header">
                        <span class="bsa-panel__title" aria-hidden="true">Configuration</span>
                    </div>
                    <div class="bsa-panel__body">

                        <lightning-combobox
                            name="applicantSelect"
                            label="Applicant"
                            value={selectedId}
                            placeholder="Select applicant"
                            required
                            options={options}
                            onchange={handleChange}>
                        </lightning-combobox>

                        <template if:false={isManual}>
                            <lightning-input
                                type="tel"
                                label="Contact number"
                                name="mobileNumber"
                                maxlength="10"
                                value={mobileNumber}
                                placeholder="10-digit mobile number"
                                onchange={handleMobileNumberChange}
                                required
                                onfocus={handleStopPropgation}
                                onblur={handleStopPropgation}>
                            </lightning-input>
                        </template>

                        <template if:true={isManual}>
                            <lightning-combobox
                                required
                                label="Account type"
                                value={loanFacility}
                                options={loanFacilityOptions}
                                onchange={handleLoanFacility}>
                            </lightning-combobox>
                        </template>

                        <template if:true={showOD}>
                            <lightning-input
                                type="number"
                                label="Sanction limit"
                                name="sanctionLimit"
                                value={sanctionLimit}
                                placeholder="Enter amount"
                                onchange={handleSanctionLimitChange}
                                required
                                onfocus={handleStopPropgation}
                                onblur={handleStopPropgation}>
                            </lightning-input>
                        </template>

                        <template if:true={isAccountAggregator}>
                            <template if:true={showErrorListAA}>
                              <!--  <div class="inline-error" role="alert" aria-live="assertive">
                                    <svg class="inline-error__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                        <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.4"/>
                                        <line x1="8" y1="5" x2="8" y2="8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                                        <circle cx="8" cy="11" r="0.7" fill="currentColor"/>
                                    </svg>
                                    <span>{errorList}</span>
                                </div> -->
                            </template>
                            <div class="panel-action">
                                <template if:false={renameButtonAA}>
                                    <button type="button" class="bsa-btn bsa-btn--solid" onclick={initiateAA}>Initiate AA</button>
                                </template>
                                <template if:true={renameButtonAA}>
                                    <button type="button" class="bsa-btn bsa-btn--solid" onclick={initiateAA}>Re-send link</button>
                                </template>
                            </div>
                        </template>

                        <template if:true={isNetBanking}>
                            <template if:true={showNetBakingError}>
                                <div class="inline-error" role="alert" aria-live="assertive">
                                    <svg class="inline-error__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                        <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.4"/>
                                        <line x1="8" y1="5" x2="8" y2="8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                                        <circle cx="8" cy="11" r="0.7" fill="currentColor"/>
                                    </svg>
                                    <span>{errorList}</span>
                                </div>
                            </template>
                            <div class="panel-action">
                                <template if:false={renameButtonNetBanking}>
                                    <button type="button" class="bsa-btn bsa-btn--solid" onclick={initateNetBanking}>Initiate net banking</button>
                                </template>
                                <template if:true={renameButtonNetBanking}>
                                    <button type="button" class="bsa-btn bsa-btn--solid" onclick={initateNetBanking}>Re-send link</button>
                                </template>
                            </div>
                        </template>

                        <template if:true={isManual}>
                            <template if:true={displayManualBank}>
                                <c-add-bank-account-cmp
                                    bsa=false
                                    from-sales={isManual}
                                    record-id={selectedId}
                                    selected-cust-opt={selectedId}
                                    loan-facility={loanFacility}
                                    account-type={accountType}
                                    is-modal-open={openBankAccountModal}
                                    onclosemodal={closeBankAccount}
                                    acc-holder-name={selectedName}
                                    sanction-limit={sanctionLimit}
                                    loan-id={recordId}
                                    onsavedbankrecord={openCamera}
                                    is-disable={isFieldDisable}
                                    is-bsa=true
                                    uploaded-file-names={uploadedFileNames}>
                                </c-add-bank-account-cmp>
                            </template>
                        </template>

                    </div>
                </aside>

                <main class="bsa-content" aria-label="Bank statement records">
                    <template if:true={showNoRecords}>
                        <template if:true={openBSA}>

                            <template for:each={groupedApplicants} for:item="applicant">
                                <div key={applicant.applicantId}
                                     class="appl-card"
                                     role="region"
                                     aria-label={applicant.applicantName}>

                                    <div class={applicant.headerCls}
                                         data-id={applicant.applicantId}
                                         onclick={toggleApplicantAcc}
                                         role="button"
                                         tabindex="0"
                                         aria-expanded={applicant.isOpen}
                                         aria-controls={applicant.applicantId}>
                                        <div class="appl-avi" data-color={applicant.colorKey} aria-hidden="true">{applicant.initials}</div>
                                        <div class="appl-meta">
                                            <div class="appl-name">{applicant.applicantName}</div>
                                            <div class="appl-type">{applicant.applicantType}</div>
                                        </div>

                                        <svg class={applicant.chevronCls} viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                            <polyline points="4,6 8,10 12,6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </div>

                                    <template if:true={applicant.isOpen}>
                                        <div class="appl-body" id={applicant.applicantId}>

                                            <div class="tab-strip" role="tablist" aria-label="Statement type">
                                                <button class={applicant.manualTabCls}
                                                        role="tab"
                                                        aria-selected={applicant.showManual}
                                                        aria-controls="manual-pane"
                                                        data-id={applicant.applicantId}
                                                        data-tab="manual"
                                                        onclick={switchTab}>
                                                    Manual statements
                                                </button>
                                                <button class={applicant.aaTabCls}
                                                        role="tab"
                                                        aria-selected={applicant.showAA}
                                                        aria-controls="aa-pane"
                                                        data-id={applicant.applicantId}
                                                        data-tab="aa"
                                                        onclick={switchTab}>
                                                    AA statements1
                                                </button>
                                                <div class="tab-strip__spacer"></div>
                                                <button class="tab-refresh-btn"
                                                        type="button"
                                                        onclick={handleRefreshData}
                                                        title="Refresh statements"
                                                        aria-label="Refresh statements"
                                                        onfocus={handleStopPropgation}>
                                                    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                        <path d="M13.5 8a5.5 5.5 0 1 1-1.1-3.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                                                        <polyline points="10,2 12.5,4.7 10,7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                                                    </svg>
                                                    Refresh
                                                </button>
                                            </div>

                                            <template if:true={applicant.showManual}>
                                                <div class="tab-pane" role="tabpanel" id="manual-pane" aria-label="Manual statements">
                                                    <div class="tbl-scroll">
                                                        <table class="bsa-tbl" aria-label="Manual bank statements">
                                                            <caption class="sr-only">Manual bank statements for {applicant.applicantName}</caption>
                                                            <thead>
                                                                <tr>
                                                                    <th scope="col" class="th-sno">S.No</th>
                                                                    <th scope="col" class="th-cb">
                                                                        
                                                                        <template if:true={applicant.manualHasSelectable}>
                                                                            <input type="checkbox"
                                                                                   checked={applicant.manualAllSelected}
                                                                                   data-applicant={applicant.applicantId}
                                                                                   onchange={handleSelectAllManual}
                                                                                   onclick={handleStopPropgation}
                                                                                   title="Select all"
                                                                                   aria-label="Select all manual statements" />
                                                                        </template>
                                                                        <template if:false={applicant.manualHasSelectable}>
                                                                            <span class="sr-only">Select</span>
                                                                        </template>
                                                                    </th>
                                                                    <th scope="col">Bank name</th>
                                                                    <th scope="col">BSA status</th>
                                                                    <th scope="col">Errors</th>
                                                                    <th scope="col">Internal BSA</th>
                                                                    <th scope="col">View file</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                <template for:each={applicant.manualDocs} for:item="doc">
                                                                    <tr key={doc.id}>
                                                                        <td class="td-sno">{doc.sno}</td>
                                                                        <td class="td-cb">
                                                                            <input type="checkbox"
                                                                                   checked={doc.isManualSelected}
                                                                                   onchange={handleManualCheckboxChange}
                                                                                   data-id={doc.id}
                                                                                   data-name={doc.fileName}
                                                                                   disabled={doc.checkboxDisabled}
                                                                                   aria-label="Select this statement"
                                                                                   onfocus={handleStopPropgation} />
                                                                        </td>
                                                                        <td>
                                                                            <div class="cell-bank">
                                                                                <svg class="bank-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                                                    <rect x="1" y="6" width="14" height="9" rx="1" stroke="currentColor" stroke-width="1.2"/>
                                                                                    <path d="M1 6l7-4 7 4" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
                                                                                    <rect x="4" y="9" width="2" height="4" rx="0.5" fill="currentColor" opacity=".5"/>
                                                                                    <rect x="7" y="9" width="2" height="4" rx="0.5" fill="currentColor" opacity=".5"/>
                                                                                    <rect x="10" y="9" width="2" height="4" rx="0.5" fill="currentColor" opacity=".5"/>
                                                                                </svg>
                                                                                <span class="cell-main">{doc.bankName}</span>
                                                                            </div>
                                                                        </td>
                                                                        <td><span class={doc.bsaStatusCls}>{doc.bsaStatus}</span></td>
                                                                        <td>
                                                                            <template if:true={doc.hasErrors}>
                                                                                <div class="err-list" role="list" aria-label="Errors" aria-live="polite">
                                                                                    <template for:each={doc.errorList} for:item="err">
                                                                                        <span key={err} class="spill spill--rose err-spill" role="listitem">{err}</span>
                                                                                    </template>
                                                                                </div>
                                                                            </template>
                                                                            <template if:false={doc.hasErrors}>
                                                                                <span class="td-nil" aria-label="No errors">—</span>
                                                                            </template>
                                                                        </td>
                                                                        <td>
                                                                            <lightning-input
                                                                                type="toggle"
                                                                                label="Internal BSA"
                                                                                checked={doc.toggleOn}
                                                                                disabled={doc.toggleDisabled}
                                                                                class="bsa-toggle"
                                                                                data-id={doc.id}
                                                                                onchange={handleInternalBSAToggle}
                                                                                message-toggle-active="Yes"
                                                                                message-toggle-inactive="No">
                                                                            </lightning-input>
                                                                        </td>
                                                                        
                                                                        <td>
                                                                            <template for:each={doc.uploadedFiles} for:item="uf">
                                                                                <div key={uf.contentDocId} class="view-cell">
                                                                                    <button class="icon-btn"
                                                                                            data-id={uf.contentDocId}
                                                                                            onclick={handleView}
                                                                                            title="Preview file"
                                                                                            aria-label="Preview file">
                                                                                        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                                                            <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.3"/>
                                                                                            <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>
                                                                                        </svg>
                                                                                    </button>
                                                                                </div>
                                                                            </template>
                                                                        </td>
                                                                    </tr>
                                                                </template>
                                                            </tbody>
                                                        </table>
                                                    </div>

                                                    <template if:true={showErrorBSA}>
                                                        <div class="inline-error inline-error--block" role="alert" aria-live="assertive">
                                                            <svg class="inline-error__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                                <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.4"/>
                                                                <line x1="8" y1="5" x2="8" y2="8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                                                                <circle cx="8" cy="11" r="0.7" fill="currentColor"/>
                                                            </svg>
                                                            <span>{errorListBSA}</span>
                                                        </div>
                                                    </template>

                                                    <template if:true={showPerfiosError}>
                                                        <div class="inline-warn inline-warn--block" role="alert" aria-live="assertive">
                                                            <span>{perfiosErrorMessage} — Whitelisted. You may continue.</span>
                                                            <button class="bsa-btn bsa-btn--solid bsa-btn--xs" onclick={handleConfirmError}>Confirm &amp; continue</button>
                                                        </div>
                                                    </template>

                                                    <template if:false={hideBSAButton}>
                                                        <div class="tab-footer">
                                                            <button type="button"
                                                                    class="bsa-btn bsa-btn--solid"
                                                                    data-applicant={applicant.applicantId}
                                                                    data-type="manual"
                                                                    onclick={handleInitiateBSA1}
                                                                    onfocus={handleStopPropgation}
                                                                    aria-label="Initiate BSA for selected statements">
                                                                <svg viewBox="0 0 16 16" fill="none" class="btn-icon" aria-hidden="true">
                                                                    <polygon points="4,2 14,8 4,14" fill="currentColor"/>
                                                                </svg>
                                                                Initiate BSA
                                                            </button>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>

                                            <template if:true={applicant.showAA}>
                                                <div class="tab-pane" role="tabpanel" id="aa-pane" aria-label="Account aggregator statements">

                                                    <template for:each={applicant.triggerGroups} for:item="trigger">
                                                        <div key={trigger.consentHandle}
                                                             class="trigger-card"
                                                             role="region"
                                                             aria-label={trigger.label}>

                                                            <div class={trigger.headerCls}
                                                                 data-id={trigger.consentHandle}
                                                                 data-applicant={applicant.applicantId}
                                                                 onclick={toggleTriggerAcc}
                                                                 role="button"
                                                                 tabindex="0"
                                                                 aria-expanded={trigger.isOpen}>
                                                                <span class="trigger-label-plain">{trigger.label}</span>
                                                                <div class="trigger-head-meta">
                                                                    <div class="trigger-head-info">
                                                                        <span class="trigger-head-contact">
                                                                            <svg class="trigger-head-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                                                <rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.2"/>
                                                                                <circle cx="8" cy="6.5" r="1.8" stroke="currentColor" stroke-width="1.1"/>
                                                                                <path d="M4 13c0-2 1.8-3 4-3s4 1 4 3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
                                                                            </svg>
                                                                            {trigger.mobileNumber}
                                                                        </span>
                                                                        <span class={trigger.overallStatusCls}>{trigger.overallStatus}</span>
                                                                        <span class="trigger-head-ts">
                                                                            <svg class="trigger-head-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                                                <circle cx="8" cy="8" r="6.3" stroke="currentColor" stroke-width="1.2"/>
                                                                                <path d="M8 5v3.2l2 1.3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                                                                            </svg>
                                                                            {trigger.triggerTimestamp}
                                                                        </span>
                                                                    </div>
                                                                    <div class="trigger-head-pills">
                                                                        <template if:true={trigger.hasErrors}>
                                                                            <span class="spill spill--rose">{trigger.errorCount} error(s)</span>
                                                                        </template>
                                                                        <template if:true={trigger.canResend}>
                                                                            <button type="button"
                                                                                    class="bsa-btn bsa-btn--ghost bsa-btn--xs trigger-resend-btn"
                                                                                    data-trigger={trigger.consentHandle}
                                                                                    data-applicant={applicant.applicantId}
                                                                                    data-mobile={trigger.mobileNumber}
                                                                                    onclick={handleResendLink}
                                                                                    onfocus={handleStopPropgation}
                                                                                    title="Resend consent link to customer"
                                                                                    aria-label="Resend consent link">
                                                                                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                                                    <path d="M2 8h10M9 5l3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                                                                                </svg>
                                                                                Resend link
                                                                            </button>
                                                                        </template>
                                                                    </div>
                                                                </div>
                                                                <svg class={trigger.chevronCls} viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                                    <polyline points="4,6 8,10 12,6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                                                                </svg>
                                                            </div>

                                                            <template if:true={trigger.isOpen}>
                                                                <div class="trigger-body">

                                                                    <div class="tbl-scroll">
                                                                        <table class="bsa-tbl" aria-label="AA bank statements">
                                                                            <caption class="sr-only">Account aggregator statements for {trigger.label}</caption>
                                                                            <thead>
                                                                                <tr>
                                                                                    <th scope="col" class="th-sno">S.No</th>
                                                                                    <th scope="col" class="th-cb">
                                                                                        
                                                                                        <template if:true={trigger.hasSelectable}>
                                                                                            <input type="checkbox"
                                                                                                   checked={trigger.allSelected}
                                                                                                   data-trigger={trigger.consentHandle}
                                                                                                   data-applicant={applicant.applicantId}
                                                                                                   onchange={handleSelectAllTrigger}
                                                                                                   onclick={handleStopPropgation}
                                                                                                   title="Select all in this trigger"
                                                                                                   aria-label="Select all statements in this trigger" />
                                                                                        </template>
                                                                                        <template if:false={trigger.hasSelectable}>
                                                                                            <span class="sr-only">Select</span>
                                                                                        </template>
                                                                                    </th>
                                                                                    <th scope="col">Bank name</th>
                                                                                    <th scope="col">Account</th>
                                                                                    <th scope="col">AA status</th>
                                                                                    <th scope="col">BSA status</th>
                                                                                    <th scope="col">Errors</th>
                                                                                    <th scope="col">Internal BSA</th>
                                                                                    <th scope="col">View file</th>
                                                                                </tr>
                                                                            </thead>
                                                                            <tbody>
                                                                                <template for:each={trigger.docs} for:item="doc">
                                                                                    <tr key={doc.id}>
                                                                                        <td class="td-sno">{doc.sno}</td>
                                                                                        <td class="td-cb">
                                                                                            <input type="checkbox"
                                                                                                   checked={doc.isSelected}
                                                                                                   onchange={handleCheckboxChange}
                                                                                                   data-id={doc.contentVersionId}
                                                                                                   data-name={doc.fileName}
                                                                                                   disabled={doc.checkboxDisabled}
                                                                                                   aria-label="Select this statement"
                                                                                                   onfocus={handleStopPropgation} />
                                                                                        </td>
                                                                                        <td>
                                                                                            <div class="cell-bank">
                                                                                                <svg class="bank-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                                                                    <rect x="1" y="6" width="14" height="9" rx="1" stroke="currentColor" stroke-width="1.2"/>
                                                                                                    <path d="M1 6l7-4 7 4" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
                                                                                                    <rect x="4" y="9" width="2" height="4" rx="0.5" fill="currentColor" opacity=".5"/>
                                                                                                    <rect x="7" y="9" width="2" height="4" rx="0.5" fill="currentColor" opacity=".5"/>
                                                                                                    <rect x="10" y="9" width="2" height="4" rx="0.5" fill="currentColor" opacity=".5"/>
                                                                                                </svg>
                                                                                                <span class="cell-main">{doc.bankName}</span>
                                                                                            </div>
                                                                                        </td>
                                                                                        <td>
                                                                                            <template if:true={doc.hasMaskedAccNo}>
                                                                                                <span class="cell-accno" aria-label="Masked account number">{doc.maskedAccNo}</span>
                                                                                            </template>
                                                                                            <template if:false={doc.hasMaskedAccNo}>
                                                                                                <span class="td-nil" aria-label="Account number not available">—</span>
                                                                                            </template>
                                                                                        </td>
                                                                                        <td><span class={doc.aaStatusCls}>{doc.aaStatusLabel}</span></td>
                                                                                        <td><span class={doc.bsaStatusCls}>{doc.bsaStatus}</span></td>
                                                                                        <td>
                                                                                            <template if:true={doc.hasErrors}>
                                                                                                <div class="err-list" role="list" aria-label="Errors" aria-live="polite">
                                                                                                    <template for:each={doc.errorList} for:item="err">
                                                                                                        <span key={err} class="spill spill--rose err-spill" role="listitem">{err}</span>
                                                                                                    </template>
                                                                                                </div>
                                                                                            </template>
                                                                                            <template if:false={doc.hasErrors}>
                                                                                                <span class="td-nil" aria-label="No errors">—</span>
                                                                                            </template>
                                                                                        </td>
                                                                                        <td>
                                                                                            <lightning-input
                                                                                                type="toggle"
                                                                                                label="Internal BSA"
                                                                                                checked={doc.toggleOn}
                                                                                                disabled={doc.toggleDisabled}
                                                                                                class="bsa-toggle"
                                                                                                data-id={doc.id}
                                                                                                onchange={handleInternalBSAToggle}
                                                                                                message-toggle-active="Yes"
                                                                                                message-toggle-inactive="No">
                                                                                            </lightning-input>
                                                                                        </td>
                                                                                        
                                                                                        <td>
                                                                                            <template if:true={doc.showViewAA}>
                                                                                                <template if:true={doc.bankStatementPreviewContentId}>
                                                                                                    <button class="icon-btn"
                                                                                                            data-id={doc.bankStatementPreviewContentId}
                                                                                                            onclick={handleView}
                                                                                                            title="Preview file"
                                                                                                            aria-label="Preview file">
                                                                                                        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                                                                            <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.3"/>
                                                                                                            <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>
                                                                                                        </svg>
                                                                                                    </button>
                                                                                                </template>
                                                                                            </template>
                                                                                            <template if:false={doc.showViewAA}>
                                                                                                <span class="td-nil" aria-label="No file received">—</span>
                                                                                            </template>
                                                                                        </td>
                                                                                    </tr>
                                                                                </template>
                                                                            </tbody>
                                                                        </table>
                                                                    </div>

                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>

                                                    <template if:false={hideBSAButton}>
                                                        <div class="tab-footer">
                                                            <button type="button"
                                                                    class="bsa-btn bsa-btn--solid"
                                                                    data-applicant={applicant.applicantId}
                                                                    data-type="aa"
                                                                    onclick={handleInitiateBSA1}
                                                                    onfocus={handleStopPropgation}
                                                                    aria-label="Initiate BSA for selected statements">
                                                                <svg viewBox="0 0 16 16" fill="none" class="btn-icon" aria-hidden="true">
                                                                    <polygon points="4,2 14,8 4,14" fill="currentColor"/>
                                                                </svg>
                                                                Initiate BSA
                                                            </button>
                                                        </div>
                                                    </template>

                                                </div>
                                            </template>

                                        </div>
                                    </template>
                                </div>
                            </template>

                        </template>
                    </template>
                </main>

            </div>
        </template>

        <template if:true={showCreditPopUp}>
            <section role="dialog"
                     tabindex="-1"
                     aria-modal="true"
                     aria-labelledby="modal-title-credit"
                     aria-describedby="modal-desc-credit"
                     class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container modal-sm">
                    <header class="slds-modal__header modal-header">
                        <h2 id="modal-title-credit" class="modal-title">Confirm document type</h2>
                    </header>
                    <div class="slds-modal__content modal-body">
                        <p id="modal-desc-credit" class="modal-question">Are the uploaded documents scanned copies?</p>
                        <lightning-combobox
                            label="Scanned copy"
                            options={scannedOptions}
                            required
                            onchange={handleChooseScannedCopy}
                            value={scannedTrueFalse}>
                        </lightning-combobox>
                    </div>
                    <footer class="slds-modal__footer modal-footer">
                        <button class="bsa-btn bsa-btn--ghost" onclick={modalClose} aria-label="Cancel and close dialog">Cancel</button>
                        <button class="bsa-btn bsa-btn--solid" onclick={handleConfirm} aria-label="Confirm document type">Confirm</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <div class="page-footer">
            <button class="bsa-btn bsa-btn--next" onclick={handleNavigateNext} aria-label="Proceed to next step">Next</button>
        </div>

    </div>
</template>

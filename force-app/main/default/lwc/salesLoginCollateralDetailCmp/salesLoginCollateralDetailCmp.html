<template>
  <div class="collateral-dark-theme">
    <span class="styleContainer"></span>
  <div class="slds-m-top_large">
    <!-- <template lwc:if={isVisible}> -->
    <template if:false={disabledCmp}>
        <template if:false={isFlexiLoan}>
            <button class="slds-button slds-button_brand initiate-button add-collateral-btn"
                    style="margin-left: 2%;"
                    onclick={handleAddNewCollateral}>
                Add Collateral
            </button>
        </template>
        <template if:true={isFlexiLoan}>
                <p>Collateral cannot be added for flexi loan</p>
        </template>
    </template>
    <template if:true={isModalOpen}>
        <section role="dialog" class="slds-modal slds-fade-in-open custom-mobile-modal">
            <div class="slds-modal__container custom-modal-container">


                    <header class="slds-modal__header modal-header">
                        <h2 id="modal-heading" class="slds-text-heading_medium">{modalHeader}</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                 <template if:true={isloading}>
        <lightning-spinner alternative-text="Loading" variant="brand" size="large"></lightning-spinner>
    </template>
    <template if:true={isPropertyIdentified}>
         <lightning-layout multiple-rows>
            <!-- Row 1: APF and Project (if visible) -->
            <lightning-layout-item size="6" padding="around-small">
                <lightning-combobox
                    name="isProp"
                    label="Is Property Identified?"
                    placeholder="Select an option"
                    options={apfOptions}
                    value={isPropertyIdentifiedVal}
                    data-field="apf"
                    onchange={isProphandleInputChange}
                    disabled={isEditMode}>
                </lightning-combobox>
            </lightning-layout-item>
         </lightning-layout>
    </template>
    <template if:false={isPropertyIdentified}>


                    <template if:true={showAPFSelection}>
        <lightning-layout multiple-rows>
            <!-- Row 1: APF and Project (if visible) -->
            <lightning-layout-item size="6" padding="around-small">
                <lightning-combobox
                    name="apf"
                    label="Is Property APF?"
                    placeholder="Select an option"
                    options={apfOptions}
                    value={collateral.apfValue}
                    data-field="apf"
                    onchange={handleInputChange}
                    disabled={isEditMode}>
                </lightning-combobox>
            </lightning-layout-item>

        <template if:true={showAPFFields}>

        <!-- Project Search -->
        <lightning-layout-item size="6" padding="around-small">
        <lightning-input
        type="search"
        label="Search Project"
        placeholder="Search by name..."
        value={collateral.projName}
        onchange={handleProjectSearch}
        required>
    </lightning-input>

        <template if:true={filteredProjectList.length}>
            <ul class="slds-list_dotted slds-m-top_small">
                <template for:each={filteredProjectList} for:item="project">
                    <li key={project.Id} class="slds-p-vertical_x-small slds-border_bottom">
                        <a href="javascript:void(0);" onclick={handleProjectSelect} data-id={project.Id} data-apfno={project.APF_No__c} data-name={project.Name} data-devname={project.Builder_Master__r.Name} data-devid={project.Builder_Master__c} data-addr1={project.Address_Line_1__c} data-addr2={project.Address_Line_2__c} data-addr3={project.Address_Line_3__c}>{project.Name}</a>

                    </li>
                </template>
            </ul>
        </template>
        </lightning-layout-item>

        <!-- Developer Name (Auto-filled, Readonly) -->
        <lightning-layout-item size="6" padding="around-small">
            <lightning-input
                label="Developer Name"
                value={collateral.devName}
                disabled
                data-field="devName">
            </lightning-input>
        </lightning-layout-item>
         <template if:true={hasBuildings}>
        <!-- Tower Search (searchable and disabled if no project selected) -->
            <lightning-layout-item size="6" padding="around-small">
            <lightning-input
                type="search"
                label="Search Tower"
                placeholder="Search Tower..."
                value={towerName}
                onchange={handleTowerSearch}
                data-field="towerNumber"
                required
                disabled={istowerDisabled}>
            </lightning-input>

            <template if:true={filteredTowerList.length}>
                <ul class="slds-list_dotted slds-m-top_small">
                            <template for:each={filteredTowerList} for:item="tower">
                                <li key={tower.Id} class="slds-p-vertical_x-small slds-border_bottom">
                                    <a href="javascript:void(0);"
                                    onclick={handleTowerSelect}
                                    data-id={tower.Id}
                                    data-name={tower.Name}>
                                        {tower.Name}
                                    </a>
                                </li>
                            </template>
                        </ul>
                    </template>
                </lightning-layout-item>
         </template>
         <template if:true={showUnitField}>
        <!-- Unit Search (searchable and disabled if no project selected) -->
            <lightning-layout-item size="6" padding="around-small">
            <lightning-input
                type="search"
                label="Search Unit"
                placeholder="Search unit by name or number..."
                value={collateral.unitName}
                onchange={handleUnitSearch}
                 data-field="unitNumber"
                required
                disabled={isUnitDisabled}>
            </lightning-input>

            <template if:true={filteredUnitList.length}>
                <ul class="slds-list_dotted slds-m-top_small">
                            <template for:each={filteredUnitList} for:item="unit">
                                <li key={unit.Id} class="slds-p-vertical_x-small slds-border_bottom">
                                    <a href="javascript:void(0);"
                                    onclick={handleUnitSelect}
                                    data-id={unit.Id}
                                    data-name={unit.Name}>
                                        {unit.Name}
                                    </a>
                                </li>
                            </template>
                        </ul>
                    </template>
                </lightning-layout-item>
         </template>
            </template>

        </lightning-layout>
    </template>

                        <template if:true={showFieldSections}>
                            <fieldset class="custom-fieldset">
                                <legend class="fieldset-legend">Address Details</legend>
                                <lightning-layout multiple-rows="true" pull-to-boundary="small">

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Address 1" type="text"
                                            value={collateral.address1}
                                            data-field="address1"
                                            onchange={handleInputChange}
                                            minlength="2"
                                            message-when-too-short="Minimum 2 characters required"
                                            required disabled={showAPFFields}>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="City" type="text"
                                            value={collateral.city}
                                            disabled
                                            data-field="city"
                                            onchange={handleInputChange}>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Address 2" type="text"
                                            value={collateral.address2}
                                            data-field="address2"
                                            onchange={handleInputChange}
                                            minlength="2"
                                            message-when-too-short="Minimum 2 characters required"
                                            required disabled={showAPFFields}>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="State" type="text"
                                            value={collateral.state}
                                            disabled
                                            data-field="state"
                                            onchange={handleInputChange}>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Address 3" type="text"
                                            value={collateral.address3}
                                            data-field="address3"
                                            onchange={handleInputChange}
                                            minlength="2"
                                            message-when-too-short="Minimum 2 characters required"
                                            required disabled={showAPFFields}>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Country" type="text"
                                            value={collateral.country}
                                            disabled
                                            data-field="country"
                                            onchange={handleInputChange}>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input
                                            type="text"
                                            label="Pincode"
                                            value={collateral.pincode}
                                            data-field="pincode"
                                            onchange={handlePincodeChange}
                                            required>
                                        </lightning-input>

                                        <template if:true={filteredPincodeList.length}>
                                            <ul class="slds-list_dotted slds-m-top_small">
                                                <template for:each={filteredPincodeList} for:item="pincode">
                                                    <li key={pincode.Id} class="slds-p-vertical_x-small slds-border_bottom">
                                                        <a href="javascript:void(0);"
                                                        onclick={handlePincodeSelect}
                                                        data-id={pincode.Id}
                                                        data-name={pincode.Name}>
                                                            {pincode.Name}
                                                        </a>
                                                    </li>
                                                </template>
                                            </ul>
                                        </template>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Block/Taluka" type="text"
                                            value={collateral.block}
                                            data-field="block"
                                            onchange={handleInputChange}>
                                        </lightning-input>
                                    </lightning-layout-item>



                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-combobox label="Address Type"
                                            options={addressTypeOptions}
                                            value={collateral.addressType}
                                            data-field="addressType"
                                            onchange={handleInputChange}>
                                        </lightning-combobox>
                                    </lightning-layout-item>

                                    <template if:false={showAPFFields}>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-combobox
                                            label="Unit / Property Type"
                                            value={collateral.unitType}
                                            options={propertyTypeOptions}
                                            data-field="unitType"
                                            onchange={handleInputChange}
                                            required>
                                        </lightning-combobox>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-combobox label="Construction Stage"
                                            options={constructionStageOptions}
                                            value={collateral.constructionStage}
                                            data-field="constructionStage"
                                            onchange={handleInputChange}
                                            required>
                                        </lightning-combobox>
                                    </lightning-layout-item>
                                     <lightning-layout-item size="6" padding="around-small">
                                        <lightning-combobox label="Current Usage"
                                            options={currentUsageOptions}
                                            value={collateral.currentUsage}
                                            data-field="currentUsage"
                                            onchange={handleInputChange}
                                            required>
                                        </lightning-combobox>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Completion Timeline (In months)" type="number"
                                            value={collateral.complitionTime}
                                            data-field="complitionTime"
                                            onchange={handleInputChange}
                                            required>
                                        </lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-combobox label="Collateral Type"
                                            options={collateralTypeOptions}
                                            value={collateral.collateralType}
                                            data-field="collateralType"
                                            onchange={handleInputChange}
                                            required>
                                        </lightning-combobox>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-combobox label="Property Usage"
                                            options={propertyUsageOptions}
                                            value={collateral.propertyUsage}
                                            data-field="propertyUsage"
                                            onchange={handleInputChange}>
                                        </lightning-combobox>
                                    </lightning-layout-item>
                                  <!--   <lightning-layout-item size="6" padding="around-small">
                                        <lightning-combobox label="Occupancy Type"
                                            options={occupancyTypeOptions}
                                            value={collateral.occupancyType}
                                            data-field="occupancyType"
                                            onchange={handleInputChange}>
                                        </lightning-combobox>
                                    </lightning-layout-item>-->

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-combobox label="Occupancy Since(In Years)"
                                            options={occupancySinceOptions}
                                            value={collateral.occupancySince}
                                            data-field="occupancySince"
                                            onchange={handleInputChange}>
                                        </lightning-combobox>
                                    </lightning-layout-item>
                                    </template>
                                </lightning-layout>
                            </fieldset>
                            <template if:true={showAPFFields}>
                            <fieldset class="custom-fieldset">
                                <legend class="fieldset-legend">Project Details</legend>
                                <lightning-layout multiple-rows="true" pull-to-boundary="small">

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Project Name" type="text"
                                            value={collateral.projName}
                                            data-field="projName"
                                            onchange={handleInputChange}
                                            minlength="2"
                                            message-when-too-short="Minimum 2 characters required"
                                            disabled>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Developer Name" type="text"
                                            value={collateral.devName}
                                            data-field="devName"
                                            disabled>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Unit / Property Type" type="text"
                                            value={collateral.unitType}
                                            data-field="unitType"
                                            disabled>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Tower/Building Name" type="text"
                                            value={collateral.towerName}
                                            data-field="towerName"
                                            disabled>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Floor" type="text"
                                            value={collateral.floor}
                                            data-field="floor"
                                            disabled>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Unit Number" type="text"
                                            value={collateral.unitNumber}
                                            data-field="unitNumber"
                                            disabled>
                                        </lightning-input>
                                    </lightning-layout-item>
                                    <template if:true={showAPFReraEndDate}>
                                        <lightning-layout-item size="6" padding="around-small">
                                            <lightning-input
                                                type="date"
                                                label="RERA End Date"
                                                data-field="reraEndDate"
                                                value={collateral.reraEndDate}
                                                onchange={handleInputChange}
                                                required>
                                            </lightning-input>
                                        </lightning-layout-item>
                                    </template>
                                     <lightning-layout-item size="6" padding="around-small">
                                        <lightning-combobox label="Collateral Type"
                                            options={collateralTypeOptions}
                                            value={collateral.collateralType}
                                            data-field="collateralType"
                                            onchange={handleInputChange}
                                            required>
                                        </lightning-combobox>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-combobox label="Construction Stage"
                                            options={constructionStageOptions}
                                            value={collateral.constructionStage}
                                            data-field="constructionStage"
                                            onchange={handleInputChange}
                                            required>
                                        </lightning-combobox>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-combobox label="Current Usage"
                                            options={currentUsageOptions}
                                            value={collateral.currentUsage}
                                            data-field="currentUsage"
                                            onchange={handleInputChange}
                                            required>
                                        </lightning-combobox>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-combobox
                                            label="Unit / Property Type"
                                            value={collateral.unitType}
                                            options={propertyTypeOptions}
                                            data-field="unitType"
                                            onchange={handleInputChange}
                                            required>
                                        </lightning-combobox>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-combobox label="Occupancy Since(In Years)"
                                            options={occupancySinceOptions}
                                            value={collateral.occupancySince}
                                            data-field="occupancySince"
                                            onchange={handleInputChange}>
                                        </lightning-combobox>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-combobox label="Property Usage"
                                            options={propertyUsageOptions}
                                            value={collateral.propertyUsage}
                                            data-field="propertyUsage"
                                            onchange={handleInputChange}>
                                        </lightning-combobox>
                                    </lightning-layout-item>
                                   <!-- <lightning-layout-item size="6" padding="around-small">
                                        <lightning-combobox label="Occupancy Type"
                                            options={occupancyTypeOptions}
                                            value={collateral.occupancyType}
                                            data-field="occupancyType"
                                            onchange={handleInputChange}>
                                        </lightning-combobox>
                                    </lightning-layout-item>-->


                                </lightning-layout>
                            </fieldset>
                            </template>
                            <fieldset class="custom-fieldset">
                                <legend class="fieldset-legend">Other Details</legend>
                                <lightning-layout multiple-rows="true" pull-to-boundary="small">
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Estimated Value" type="number" formatter="currency"
                                            value={collateral.estimatedValue}
                                            data-field="estimatedValue"
                                            step="0.01"
                                            onchange={handleInputChange}
                                            required>
                                        </lightning-input>
                                    </lightning-layout-item>
                                    <!--<lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Market Value" type="number" formatter="currency"
                                            value={collateral.marketValue}
                                            data-field="marketValue"
                                            onchange={handleInputChange}
                                            required>
                                        </lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input
                                            type="text"
                                            label="Assign Percentage"
                                            value={collateral.assignPercentage}
                                            data-field="assignPercentage"
                                            onchange={handleInputChange}
                                            required>
                                        </lightning-input>
                                     </lightning-layout-item>-->

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Build up area" type="number" step="0.01"
                                            value={collateral.areaOfPlot}
                                            data-field="areaOfPlot"
                                            onchange={handleInputChange}>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Carpet Area of Residential Unit (sq. m)" type="text"
                                            value={collateral.carpetArea}
                                            data-field="carpetArea"
                                            onchange={handleInputChange}>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="RERA Registration Number" type="text"
                                            value={collateral.reraRegNumber}
                                            data-field="reraRegNumber"
                                            onchange={handleInputChange}
                                            pattern="^[a-zA-Z0-9]{15,20}$"
                                            message-when-pattern-mismatch="RERA Registration Number must be 15-20 alphanumeric characters">
                                        </lightning-input>
                                    </lightning-layout-item>
                                    <template if:true={showReraEndDate}>
                                        <lightning-layout-item size="6" padding="around-small">
                                            <lightning-input
                                                type="date"
                                                label="RERA End Date"
                                                data-field="reraEndDate"
                                                value={collateral.reraEndDate}
                                                onchange={handleInputChange}
                                                required>
                                            </lightning-input>
                                        </lightning-layout-item>
                                    </template>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-combobox label="GPL Flag"
                                            options={gplFlagOptions}
                                            value={collateral.gplFlag}
                                            data-field="gplFlag"
                                            onchange={handleInputChange}
                                            required>
                                        </lightning-combobox>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-combobox label="Property Insurance Flag"
                                            options={insuranceFlagOptions}
                                            value={collateral.insuranceFlag}
                                            data-field="insuranceFlag"
                                            onchange={handleInputChange}>
                                        </lightning-combobox>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Primary/Secondary" type="text"
                                            value={collateral.primarySecondary}
                                            data-field="primarySecondary"
                                            disabled></lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Document Value" type="Integer"
                                        value={collateral.docVal} data-field="docVal" required="true"
                                        onchange={handleInputChange}></lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </fieldset>
                             <fieldset class="custom-fieldset">
                                <legend class="fieldset-legend">Cost of Property</legend>
                                <lightning-layout multiple-rows="true" pull-to-boundary="small">

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Cost of Plot" type="number" formatter="currency"
                                            value={collateral.costOfPlot}
                                            data-field="costOfPlot"
                                            step="0.01"
                                            onchange={handleInputChange}
                                             onblur={handleBlur}>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Improvement Cost" type="number" formatter="currency"
                                            value={collateral.improvementCost}
                                            data-field="improvmentCost"
                                            step="0.01"
                                            onchange={handleInputChange}
                                             onblur={handleBlur}>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Agreement Value" type="number" formatter="currency"
                                            value={collateral.agreementValue}
                                            data-field="agreementValue"
                                            step="0.01"
                                            onchange={handleInputChange}
                                             onblur={handleBlur}>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Society Charges/Insurance" type="number" formatter="currency"
                                            value={collateral.societyCharges}
                                            data-field="societyCharges"
                                            step="0.01"
                                            onchange={handleInputChange}
                                             onblur={handleBlur}>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Electricty Board / Municiple Charges" type="number" formatter="currency"
                                            value={collateral.electricityMunicipleCharges}
                                            data-field="electricityMunicipleCharges"
                                            step="0.01"
                                            onchange={handleInputChange}
                                             onblur={handleBlur}>
                                        </lightning-input>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Architects / Contractors Estimate" type="number" formatter="currency"
                                            value={collateral.architectsEstimate}
                                            data-field="architectsEstimate"
                                            step="0.01"
                                            onchange={handleInputChange}
                                             onblur={handleBlur}>
                                        </lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Amenities as permitted by Policy" type="number" formatter="currency"
                                            value={collateral.amenitiesPermitPolicy}
                                            data-field="amenitiesPermitPolicy"
                                            step="0.01"
                                            onchange={handleInputChange}
                                             onblur={handleBlur}>
                                        </lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Others" type="number" formatter="currency"
                                            value={collateral.others}
                                            data-field="others"
                                            step="0.01"
                                            onchange={handleInputChange}
                                             onblur={handleBlur}>
                                        </lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input label="Total Property Cost ( Sum of all)" type="number" formatter="currency"

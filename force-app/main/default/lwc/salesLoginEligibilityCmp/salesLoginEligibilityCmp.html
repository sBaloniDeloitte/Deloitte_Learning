<template>
    <template if:true={spinner}>
        <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
    </template>

    <template if:true={showInEligibility}>
        <div class="center-container button-shadow">
            <span style="display:inline-flex;margin-bottom: 6%;">
                <img src={notEligibleIcon} alt="Image Preview" style="max-width:80%; max-height:100%;height:79px" class="slds-align_absolute-center" />
                <p class="slds-text-align_center" style="font-style: Lato Bold; font-size: 20px;color: red;padding-top:3%">
                    We are currently processing your eligibility. Kindly reopen this section after sometime.
                </p>
            </span>
        </div>
    </template>
    <template if:true={isDetailsVisible}>
        <div class="custom-table-container">
            <table class="custom-table">
                <!-- <thead>
                    <tr>
                        <th>Key</th>
                        <th>Value</th>
                    </tr>
                </thead> -->
                <tbody>
                    <template for:each={tableData} for:item="category">
                        <template if:true={category.isSectionSeperator}>
                            <tr key={category.fieldLabel}>
                                <td colspan="2" style="border-bottom: 1px solid #ccc; padding: 10px;background: lightgray;">
                                    <div class="slds-text-title" style="text-align: center;font-weight: 900;">{category.sectionSeperatorName}</div>
                                </td>
                            </tr>
                        </template>
                        <tr key={category.fieldLabel}>
                            <td>
                                <div class="">{category.fieldLabel}</div>
                            </td>
                            <template if:true ={category.isGreen}>
                                <td>
                                 <div class=""  style="color:#9bbf56">{category.fieldValue}</div>
                                </td>
                            </template>
                            <template if:true={category.isRed}>
                                <td>
                                <div class="" style="color:red">{category.fieldValue}</div>
                                </td>
                            </template>
                            <template if:true={category.isBlank}>
                                <td>
                                    <div class="">{category.fieldValue}</div>
                                </td>
                        </template>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </template>
</template>

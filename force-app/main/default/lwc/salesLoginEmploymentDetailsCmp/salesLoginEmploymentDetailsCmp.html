        <lightning-spinner alternative-text="Loading" variant="brand" size="large"></lightning-spinner>
    </template>
    <template if:true={showEmploymentDetails}>
        <!-- <h2 style="margin-bottom: 1%; font-weight: 700;margin-left:1%">Show Basic Details</h2> -->

    </template>

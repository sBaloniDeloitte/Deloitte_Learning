<template if:false={showFormSixtyUrl}>
    <template if:false={disablePan}>
    <template if:true={showUploadOrManualScreen}>
    <lightning-card>
            <!-- HL-Testing-Requirement: Previous button removed - this screen is now the
            first screen shown, there is no earlier "Is PAN Available?" screen to go back to.
            <template if:true={showIndividual}>
                <button class = "button-deeppink slds-button slds-m-bottom_small"  onclick={handlePreviousButtonClick}>Previous</button>
            </template>
            -->
            <div class="slds-p-around_medium">
            <p class="radio-question">Would you like to upload PAN or enter details manually?</p>
        <template if:true={isDesktop}>
        <div class="radio-inline-wrapper">
        <template for:each={UploadOrFillManuallyOptions} for:item="option">
            <lightning-input
                key={option.value}
                type="radio"
                name="panUploadOrFill"
                label={option.label}
                value={option.value}
                data-value={option.value}
                onchange={handlePanUploadOrFillChange}>
            </lightning-input>
        </template>
    </div>
	</template>
    <template if:true={isTablet}>
    <lightning-layout-item size="6" class="slds-p-around_x-small">
            <template for:each={UploadOrFillManuallyOptions} for:item="option">
            <lightning-input
                key={option.value}
                type="radio"
                name="panUploadOrFill"

                value={option.value}
                data-value={option.value}
                onchange={handlePanUploadOrFillChange}>
            </lightning-input>
        </template>
    </lightning-layout-item>
    </template>
    <template if:true={isMobile}>
    <lightning-layout-item size="3" class="slds-p-around_x-small">
            <template for:each={UploadOrFillManuallyOptions} for:item="option">
            <lightning-input
                key={option.value}
                type="radio"
                name="panUploadOrFill"
                label={option.label}
                value={option.value}
                data-value={option.value}

        </template>
    </lightning-layout-item>
    </template>
        </div>
        </lightning-card>
    </template>
    </template>
    </template>

    <template if:true={showFormSixtyScreen}>
                <button class = "button-deeppink slds-button slds-m-bottom_small"  onclick={handlePreviousButtonClickFormSixty}>Previous</button>
            
        <template if:false={disablePan}>
            <h2 class="slds-text-heading_medium slds-m-bottom_small slds-m-left_small">Form 60</h2>
        </template>
    <div class="slds-grid slds-wrap slds-m-around_small">
        <div class="slds-col slds-size_1-of-2 slds-medium-size_6-of-12 slds-p-around_x-small">
            <button class="button-green slds-button" onclick={openFormSixtyManualCmp}>
                Add Form 60 Details
            </button>
        </div>
        <div class="slds-col slds-size_2-of-2 slds-medium-size_6-of-12 slds-p-around_x-small">
            <button class="button-red slds-button" onclick={handledownloadSampleCSV}>
                Download Sample Form 60
            </button>
        </div>
    </div>

    <!-- Modal Section -->
    <template if:true={manualFormSixtycmp}>
        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container" style="width: 45% !important;">
                <template if:true={isManualloading}>
                    <lightning-spinner alternative-text="Loading" variant="brand" size="large"></lightning-spinner>
                </template>

                <header class="slds-modal__header" style="background-color: skyblue;">
                    <h2 class="slds-text-heading_medium">Add Form 60 Details</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-max-medium-table_stacked-horizontal">
                        <thead>
                            <tr>
                                <th class="slds-size_1-of-3 slds-truncate">Field</th>
                                <th class="slds-size_2-of-3 slds-truncate">Value</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="slds-truncate" title="First Name">First Name <span class="slds-text-color_error">*</span></td>
                                <td>
                                    <lightning-input type="text" value={formSixtyDetails.firstName}
                                        onchange={handleInputFormSixtyChange} data-field="firstName" max-length="150" onkeydown={blockSpaces}>
                                    </lightning-input>
                                </td>
                            </tr>
                            <tr>
                                <td class="slds-truncate" title="Middle Name">Middle Name</td>
                                <td>
                                    <lightning-input type="text" value={formSixtyDetails.middleName}
                                        onchange={handleInputFormSixtyChange} data-field="middleName" max-length="150" onkeydown={blockSpaces}>
                                    </lightning-input>
                                </td>
                            </tr>
                            <tr>
                                <td class="slds-truncate" title="Last Name">Last Name<span class="slds-text-color_error">*</span></td>
                                <td>
                                    <lightning-input type="text" value={formSixtyDetails.lastName}
                                        onchange={handleInputFormSixtyChange} data-field="lastName" max-length="150" onkeydown={blockSpaces}>
                                    </lightning-input>
                                </td>
                            </tr>
                            <tr>
                                <td class="slds-truncate" title="Mobile">Mobile <span class="slds-text-color_error">*</span></td>
                                <td>
                                    <lightning-input type="Phone" value={formSixtyDetails.mobileNumber}
                                        onchange={handleInputFormSixtyChange}
                                        pattern="^[6-9]\d{9}$"
                                        message-when-pattern-mismatch="Enter a valid 10-digit mobile number starting with 6-9"
                                        data-field="mobileNumber" max-length="10">
                                    </lightning-input>
                                </td>
                            </tr>
                            <tr>
                                <td class="slds-truncate" title="Form-60">Form-60 <span class="slds-text-color_error">*</span></td>
                                <td>
                                    <lightning-input type="file" accept=".pdf"
                                        variant="label-stacked" disabled={disableFormSixty}
                                        onchange={handleUploadFormSixtyFinished} icon-name="standard:upload" label="Upload Form 60 (PDF Only)" field-level-help="Only PDF files are allowed" 
                                         data-field="formSixtyFile" required>
                                    </lightning-input>

                                    <template if:true={formSixtyPreviewUrl}>
                                        <div class="slds-m-top_small">
                                            <lightning-button label="Delete" icon-name="utility:delete"
                                                onclick={handleDeleteFormSixty} variant="destructive">
                                            </lightning-button>
                                        </div>
                                    </template>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <footer class="slds-modal__footer slds-align_absolute-center">
                   <button class="slds-button button-red" onclick={closeFormSixtyManual}>Close</button>
                   <button class="slds-button button-green" onclick={handleAddFormSixtyDetails}>Confirm</button>
                </footer>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
    <template if:true={showUploadOption}>
    <template if:false={showFormSixtyUrl}>

        <template if:false={disablePan}>

            </template>

            <!-- Modal Header -->
            <header class="slds-modal__header" style="background-color: skyblue;">
                <h2 class="slds-text-heading_medium">Confirmation Screen</h2>
            </header>

            <!-- Modal Body -->
            <div class="slds-modal__content slds-p-around_medium">
                <template if:true={showCustomerDetails}>
                    <div class="slds-grid slds-wrap slds-m-bottom_medium">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-align_absolute-center">
                            <lightning-combobox label="Customer Type" value={selectedCustomerType}
                                options={customerTypeOptions} onchange={handleCustomerTypeChange}>
                            </lightning-combobox>
                        </div>
                    </div>

                    <template if:true={showNonIndividual}>
                        <div class="slds-grid slds-wrap slds-m-bottom_medium">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-align_absolute-center">
                                <template if:true={isProprietor}>
                                    <lightning-input label="Constitution" value={selectedConstitution} disabled>
                                    </lightning-input>
                                </template>
                                <template if:false={isProprietor}>
                                    <lightning-combobox label="Constitution" value={selectedConstitution}
                                        options={constitutionOptions} onchange={handleConstitutionChange}>
                                    </lightning-combobox>
                                </template>
                            </div>
                        </div>
                    </template>
                </template>

                <template if:true={isCustomerTypeSelected}>
                    <!-- PAN Image or PDF Preview -->
                    <div class="slds-grid slds-wrap slds-m-bottom_medium slds-align_absolute-center">
                        <template if:true={isImage}>
                            <div class="preview-box">
                                <img src={uploadedPanUrl} alt="Uploaded PAN" class="uploaded-image" style={zoomStyle} />
                            </div>
                            <div class="image-controls slds-m-top_small">
                                <button onclick={zoomIn} class="zoom-button">+</button>
                                <button onclick={zoomOut} class="zoom-button">-</button>
                            </div>
                        </template>

                        <template if:true={isPDF}>
                            <a href={uploadedPanUrl} target="_blank" rel="noopener noreferrer">
                                Click here to view the PDF
                            </a>
                        </template>
                    </div>

                    <!-- Prop Message -->
                    <template if:true={showPropMessage}>
                        <div class="slds-text-color_error slds-align_absolute-center slds-m-bottom_medium">
                            <p><b>The above PAN may be of the individual applicant. The data populated below is from lead stage except PAN which was fetched via OCR.</b></p>
                        </div>
                    </template>

                    <!-- PAN Table -->
                    <div class="slds-scrollable_x slds-p-horizontal_small" style="max-width: 960px; margin: auto;">
                        <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                            <thead>
                                <tr>
                                    <th>Field</th>
                                    <th>Value</th>
                                    <th>Confidence %</th>
                                </tr>
                            </thead>
                            <tbody>
                            
                                    <template if:true={showIndividual}>
                                        <tr>
                                            <td>First Name(as per PAN)<span style="color: red;">*</span></td>
                                            <td>
                                                <lightning-input type="text" value={panDetails.firstName} onchange={handleInputChange}
                                                    onblur={handleInputBlur} onfocus={handleInputBlur} data-field="firstName" max-length="150">
                                                </lightning-input>
                                            </td>
                                            <td>{panDetails.confidencePercentageName}</td>
                                        </tr>
                                        <tr>
                                            <td>Middle Name(as per PAN)</td>
                                            <td>
                                                <lightning-input type="text" value={panDetails.middleName} onchange={handleInputChange}
                                                    onblur={handleInputBlur} onfocus={handleInputBlur} data-field="middleName" max-length="150">
                                                </lightning-input>
                                            </td>
                                            <td>{panDetails.confidencePercentageName}</td>
                                        </tr>
                                        <tr>
                                            <td>Last Name(as per PAN)</td>
                                            <td>
                                                <lightning-input type="text" value={panDetails.lastName} onchange={handleInputChange}
                                                    onblur={handleInputBlur} onfocus={handleInputBlur} data-field="lastName" max-length="150">
                                                </lightning-input>
                                            </td>
                                            <td>{panDetails.confidencePercentageName}</td>
                                        </tr>
                                 
                                   <!-- <template if:true={showNonIndividual}>
                                        <tr>
                                            <td>Full Name(as per PAN)<span style="color: red;">*</span></td>
                                            <td>
                                                <lightning-input type="text" value={panDetails.name} onchange={handleInputChange}
                                                    onblur={handleInputBlur} onfocus={handleInputBlur} data-field="name" max-length="150">
                                                </lightning-input>
                                            </td>
                                            <td>{panDetails.confidencePercentageName}</td>
                                        </tr>
                                    </template>-->
                                </template>
                              
                                  <!-- <tr>
                                        <td>Full Name (as per PAN)<span class="slds-text-color_error">*</span></td>
                                        <td>
                                            <div class="slds-grid slds-wrap">
                                                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12">
                                                    <lightning-input type="text" value={panDetails.name} onchange={handleInputChange}
                                                        onblur={handleInputBlur} onfocus={handleInputBlur} data-field="name" max-length="150">
                                                    </lightning-input>
                                                </div>
                                            </div>
                                        </td>
                                        <td>{panDetails.confidencePercentageName}</td>
                                    </tr>-->
                                <!--Commented By Prachi-->
                               <!-- </template>-->
                               

                                <!-- Date of Birth / Incorporation -->
                                <tr>
                                    <td>Date of Birth / Incorporation<span class="slds-text-color_error">*</span></td>
                                    <td>
                                        <div class="slds-grid slds-wrap">
                                            <!-- <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12"> -->
                                                <lightning-input
                                                    type="date"
                                                    value={panDetails.dobDoi}
                                                    onchange={handleInputChange}
                                                    onblur={handleInputBlurDate}
                                                    onfocus={handleInputBlurDate}
                                                    data-field="dobDoi">
                                                </lightning-input>
                                            <!-- </div> -->
                                        </div>
                                    </td>
                                    <td>{panDetails.confidencePercentagedob}</td>
                                </tr>

                                <!-- Father's Name -->
                                <template if:true={showIndividual}>
                                    <tr>
                                        <td>Father's Name (If Applicable)<span class="slds-text-color_error">*</span></td>
                                        <td>
                                            <div class="slds-grid slds-wrap">
                                                <!-- <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12"> -->
                                                    <lightning-input
                                                        type="text"
                                                        value={panDetails.fathersName}
                                                        onchange={handleInputChange}
                                                        onblur={handleInputBlur}
                                                        onfocus={handleInputBlur}
                                                        data-field="fathersName"
                                                        max-length="25">
                                                    </lightning-input>
                                                <!-- </div> -->
                                            </div>
                                        </td>
                                        <td>{panDetails.confidencePercentageFatherName}</td>
                                    </tr>
                                </template>

                                <!-- PAN Number -->
                                <tr>
                                    <td>PAN<span class="slds-text-color_error">*</span></td>
                                    <td>
                                        <!-- <div class="slds-grid slds-wrap">
                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12"> -->
                                                <lightning-input
                                                    type="text"
                                                    value={panDetails.panNumber}
                                                    onchange={handlePanChange}
                                                    onblur={handleInputBlur}
                                                    onfocus={handleInputBlur}
                                                    data-field="panNumber"
                                                    max-length="10">
                                                </lightning-input>
                                            <!-- </div>
                                        </div> -->
                                    </td>
                                    <td>{panDetails.confidencePercentagepan}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </template>
            </div>

            <!-- Modal Footer -->
            <footer class="slds-modal__footer">
                <div class="slds-grid slds-wrap slds-grid_align-center">
                    <template if:true={isCustomerTypeSelected}>
                        <button class="slds-button slds-button_neutral slds-m-right_small" onclick={goPrevious}>Previous</button>
                        <button class="slds-button slds-button_destructive slds-m-right_small" onclick={closeModal}>Close</button>
                        <button class="slds-button slds-button_brand" onclick={handleConfirm}>Confirm</button>
                    </template>
                    <template if:false={isCustomerTypeSelected}>
                        <button class="slds-button slds-button_destructive slds-m-right_small" onclick={closeModal}>Close</button>
                        <button class="slds-button slds-button_brand" onclick={handleNextPan}>Next</button>
                    </template>
                </div>
            </footer>

        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
<!-- CASE: PAN Disabled - Show Only Centered PAN -->
<template if:false={showFormSixtyUrl}>
    <template if:true={disablePan}>
        <template if:true={isDesktop}>
        <div class="slds-p-around_medium">
            <lightning-card >
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered table-class">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate" title="PAN Name">Name as per PAN Card</div></th>
                                <th scope="col"><div class="slds-truncate" title="PAN Number">PAN Number</div></th>

                                <template if:true={showNonIndividual}>
                                    <th scope="col"><div class="slds-truncate" title="DOI">Date Of Incorporation</div></th>
                                </template>

                                <template if:true={showIndividual}>
                                    <th scope="col"><div class="slds-truncate" title="DOB">Date Of Birth</div></th>
                                    <th scope="col"><div class="slds-truncate" title="Father's Name">Father's Name</div></th>
                                </template>
                                <!-- Bug Fix: Actions column (Edit/Delete) header removed per requirement -->
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><div class="slds-truncate" title={panName}>{panDetails.name}</div></td>
                                <td><div class="slds-truncate" title={stampedPanNumber}>{stampedPanNumber}</div></td>

                                <template if:true={showNonIndividual}>
                                    <td><div class="slds-truncate" title={panDob}>{panDetails.dobDoi}</div></td>
                                </template>

                                <template if:true={showIndividual}>
                                    <td><div class="slds-truncate" title={panDob}>{panDetails.dobDoi}</div></td>
                                    <td><div class="slds-truncate" title={fatherName}>{panDetails.fathersName}</div></td>
                                </template>
                                <!-- Bug Fix: Actions column (Edit/Delete buttons) row removed per requirement -->
                            </tr>
                        </tbody>
                    </table>

            </lightning-card>
        </div>
        </template>
        <!-- Mobile & Tablet View -->
        <template if:true={isMobileOrTablet}>
            <div class="slds-p-around_medium">
                <lightning-card title="PAN Details">
                    <div class="custom-mobile-table">

                        <div class="custom-row">
                            <div class="custom-cell label">Name as per PAN Card</div>
                            <div class="custom-cell value">{panDetails.name}</div>
                        </div>

                        <div class="custom-row">
                            <div class="custom-cell label">PAN Number</div>
                            <div class="custom-cell value">{stampedPanNumber}</div>
                        </div>

                        <template if:true={showNonIndividual}>
                            <div class="custom-row">
                                <div class="custom-cell label">Date Of Incorporation</div>
                                <div class="custom-cell value">{panDetails.dobDoi}</div>
                            </div>
                        </template>

                        <template if:true={showIndividual}>
                            <div class="custom-row">
                                <div class="custom-cell label">Date Of Birth</div>
                                <div class="custom-cell value">{panDetails.dobDoi}</div>
                            </div>
                            <div class="custom-row">
                                <div class="custom-cell label">Father's Name</div>
                                <div class="custom-cell value">{panDetails.fathersName}</div>
                            </div>
                        </template>
                        <!-- Bug Fix: Actions row (Edit/Delete buttons) removed per requirement -->
                            </div>
                    </lightning-card>
                </div>
        </template>
    </template>
</template>

</template>

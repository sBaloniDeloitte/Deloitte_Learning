<template>
    <template if:false={hideTrigger}>
        <div class="trigger-wrapper">
            <button class="trigger-btn" onclick={openModal}>
                Calculate Home Loan EMI
            </button>
        </div>
    </template>

    <template if:true={isModalOpen}>
        <div class="modal-backdrop">
            <div class="modal-container" role="dialog">

                <div class="modal-titlebar">
                    <h1 class="modal-title">EMI Calculator</h1>
                    <button class="modal-close" onclick={closeModal} title="Close">
                        <lightning-icon
                            icon-name="utility:close"
                            size="x-small"
                            alternative-text="Close">
                        </lightning-icon>
                    </button>
                </div>

                <div class="modal-body">

                    <div class="banner-section">
                        <div class="banner-text">
                            <h2>Calculate Home Loan EMI</h2>
                            <p>
                                Enter your loan details below to know your estimated
                                monthly EMI and plan your payments easily.
                            </p>
                        </div>
                        <lightning-icon
                            icon-name="standard:event"
                            size="large"
                            class="banner-icon">
                        </lightning-icon>
                    </div>

                    <div class="calculator-card">

                        <!-- LEFT PANEL -->
                        <div class="left-panel">
                            <h2>Calculate Loan EMI</h2>

                            <!-- Loan Amount -->
                            <div class="field-group">
                                <label>Loan Amount</label>

                                <div class="value-display">
                                    ₹ {formattedLoanAmount}
                                </div>

                                <input
                                    type="range"
                                    min="100000"
                                    max="10000000"
                                    step="10000"
                                    value={loanAmount}
                                    onchange={handleLoanAmount}
                                    class="slider"
                                />

                                <div class="range-labels">
                                    <span>1 Lakh</span>
                                    <span>1 Crores</span>
                                </div>
                            </div>

                            <!-- Loan Tenure -->
                            <div class="field-group">
                                <label>Loan Tenure</label>

                                <div class="value-display">
                                    {tenure}
                                </div>

                                <input
                                    type="range"
                                    min="60"
                                    max="180"
                                    step="1"
                                    value={tenure}
                                    onchange={handleTenure}
                                    class="slider"
                                />

                                <div class="range-labels">
                                    <span>60</span>
                                    <span>180</span>
                                </div>
                            </div>

                            <!-- Interest Rate -->
                            <div class="field-group">
                                <label>Interest Rate</label>

                                <div class="value-display">
                                    {interestRate}
                                </div>

                                <input
                                    type="range"
                                    min="7"
                                    max="15"
                                    step="0.1"
                                    value={interestRate}
                                    onchange={handleInterest}
                                    class="slider"
                                />

                                <div class="range-labels">
                                    <span>7</span>
                                    <span>15</span>
                                </div>
                            </div>

                            <button
                                class="calculate-btn"
                                onclick={calculateEmi}
                                disabled={isCalculateDisabled}
                            >
                                CALCULATE EMI
                            </button>
                        </div>

                        <!-- RIGHT PANEL -->
                        <div class="right-panel">

                            <div class="result-header">
                                <h2>Your Result</h2>

                                <button class="reset-btn" onclick={handleReset}>
                                    <lightning-icon
                                        icon-name="utility:refresh"
                                        size="x-small"
                                        alternative-text="Reset">
                                    </lightning-icon>

                                    <span>RESET</span>
                                </button>
                            </div>

                            <div class="result-top">

                                <div class="chart-section">
                                    <div
                                        class="donut-chart"
                                        style={chartStyle}
                                    >
                                        <div class="donut-center">
                                            <div class="total-label">Total</div>
                                            <div class="total-value">
                                                ₹ {formattedTotalPayment}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="breakdown">

                                    <div class="breakdown-item">
                                        <div class="legend blue"></div>

                                        <div>
                                            <div class="legend-label">Principal</div>
                                            <div class="legend-value">
                                                ₹ {formattedPrincipal}
                                            </div>
                                        </div>
                                    </div>

                                    <div class="breakdown-item">
                                        <div class="legend hollow"></div>

                                        <div>
                                            <div class="legend-label">Interest</div>
                                            <div class="legend-value">
                                                ₹ {formattedInterest}
                                            </div>
                                        </div>
                                    </div>

                                </div>

                            </div>

                            <div class="emi-result fade-in">
                                <div class="emi-label">
                                    Your Equated Monthly Installment is
                                </div>

                                <div class="emi-value">
                                    ₹ {formattedEmi}
                                </div>
                            </div>

                        </div>

                    </div>
                </div>
            </div>
        </div>
    </template>
</template>
<!--__________________________GenAI: Generated code ends here______________________________-->

<template>
    <template if:true={modalVisibility}>
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class={cssContainer}>
                    <header class="slds-modal__header header-section">
                        <div class="slds-text-align_center">
                            <h2 slot="title" class="slds-text-heading_medium slds-hyphenate header-title">{headerTitle}</h2>
                        </div>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium" id="confirm-body">
                        <div style="padding: 10px; text-align: center;">
                            {confirmationText}
                        </div>
                        <!-- Remarks Field -->
                        <lightning-textarea
                            label="Remarks"
                            value={remarks}
                            required
                            onchange={handleRemarksChange}
                            class="remarks-textarea slds-m-top_medium"
                        ></lightning-textarea>
                    </div>
                    <footer class="footer-section">
                        <div class="slds-align_absolute-center button-container">
                            <button class="slds-button slds-button_brand previous-button" onclick={handleNegative}>No</button>
                            <button class="slds-button slds-button_brand continue-button" onclick={handlePositive}>Yes</button>
                        </div>
                    </footer>
                </div>
            </section>
            
            <!--<div class="slds-backdrop slds-backdrop_open slds-modal_large"></div>-->  
    </template>
</template>
